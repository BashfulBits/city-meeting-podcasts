[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citypods"
version = "0.1.0"
description = "Convert US city meeting archives into subscribable podcast feeds, hosted on GitHub Pages."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "Pillow>=10.0",                  # podcast cover-art generation
    "opencv-python-headless>=4.10",  # pinned R6 face/mouth-motion speaker framing
    "defusedxml>=0.7",               # hardened XML parsing of provider feeds
    "pypdf>=5.0",                     # agenda/minutes PDF text and link extraction
    "beautifulsoup4>=4.12",           # agenda/minutes HTML extraction
]

[project.optional-dependencies]
storage = ["boto3>=1.34"]           # Cloudflare R2 / S3-compatible upload
svg = ["cairosvg>=2.7"]              # seal rendering (PR-B; needs libcairo)
asr-transcribe = [
    "faster-whisper>=1.0",          # CTranslate2-optimised fresh transcription (CPU int8)
]
asr-align = [
    "whisperx>=3.8",                # CTC known-text alignment; much faster than full ASR
]
asr-bench = [
    "faster-whisper>=1.0",
    "whisperx>=3.8",
    "jiwer>=3.0",                   # WER computation for asr-bench diagnostic
]
# H15 Layer 2 (review/12 §H15): independent, non-Whisper CTC forced-alignment judge, used only
# by the periodic asr-quality-eval.yml sampler for a bounded rotating subset of samples.
# torch/torchaudio are listed for correctness if this extra is ever installed standalone, but in
# practice they're already a transitive pin via WhisperX's torch/torchaudio closure
# dependency wherever `asr` is installed too — torchcodec is the only genuinely new download.
# Compiled into the same constraints/asr.txt resolution as `asr` (see
# scripts/compile_constraints.sh) rather than a separate lock file, so torch/torchaudio never
# get two conflicting pins across two constraint files.
asr-align2 = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "torchcodec>=0.1",              # torchaudio.load()'s AudioDecoder backend as of torchaudio 2.9
]
# Backward-compatible aggregate for local contributors that want every ASR surface.
asr = [
    "faster-whisper>=1.0",
    "whisperx>=3.8",
    "jiwer>=3.0",
]
# H15 Layer 3 (review/12 §H15): WER/CER for the gold-anchored calibration report. Deliberately
# separate from asr-bench/asr — those also pull in faster-whisper/WhisperX, which the weekly
# asr-quality-review.yml workflow (this extra's only consumer) has no other reason to install.
wer = ["jiwer>=3.0"]
# Offline-only experiments for generated agenda chapters (GH#1078).  This is deliberately not
# included by the production or Worker dependency profiles.
chapter-research = ["scikit-learn>=1.5"]
llm = [
    "pydantic>=2.8",                # task-owned structured-output contracts
    # gemini-3.5-flash-lite support (day-0 pricing/provider registration) landed in litellm main
    # 2026-07-21 (BerriAI/litellm@59ebe043c2) but no *stable* release contains it yet as of
    # 2026-07-23 -- v1.93.0 (2026-07-19) predates the fix. Floor pinned to the first pre-release
    # that has it (1.94.0rc3, 2026-07-22) rather than the usual abstract >= so pip-compile resolves
    # into prerelease space for just this package (PEP 440: a prerelease lower bound opts a
    # requirement into prereleases without a blanket --pre). Revisit and relax once litellm cuts a
    # stable release containing this commit.
    "litellm>=1.94.0rc3",            # provider-neutral model routing
    # Extra dropped (not just the version): instructor==1.15.4 (its own latest release) pins its
    # `[litellm]` extra to `litellm<=1.83.7`, which conflicts with the floor above and blocks
    # pip-compile outright -- there is no newer instructor release with a higher cap. The extra
    # only pulls in litellm as a convenience; we already declare litellm ourselves above, and
    # instructor.from_litellm() imports litellm lazily at call time rather than needing the extra
    # for anything instructor's own code paths do internally.
    "instructor>=1.15",             # Pydantic structured outputs and bounded validation retries
]
dev = ["pytest>=8.0", "ruff>=0.6", "boto3>=1.34", "pip-tools>=7.4"]

[project.scripts]
citypods = "citypods.cli:main"

[tool.setuptools.packages.find]
include = ["citypods*"]

[tool.setuptools.package-data]
"citypods.compute" = ["llm_routes.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live endpoint-contract tests hit real provider URLs and are flaky by nature, so they're
# excluded from the default (offline, deterministic) run. Opt in with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: hits live external endpoints (network); run with -m live"]
