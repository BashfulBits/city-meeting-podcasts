version: 1
reviewed_at: 2026-07-16

# Compact bibliography for the annual taxonomy review.  The design document explains how these
# references are re-evaluated; keeping identifiers here makes each seed tag's provenance auditable
# without repeating long URLs in every entry.
source_refs:
  st-walkability: https://actionlab.strongtowns.org/hc/en-us/articles/13240394073876-3-ways-to-make-places-more-walkable
  st-trees: https://www.strongtowns.org/journal/2024/2/15/theres-more-than-one-way-to-save-a-street-tree
  st-third-places: https://archive.strongtowns.org/journal/2019/2/20/its-the-little-things-19
  st-incremental: https://archive.strongtowns.org/journal/2024/5/6/how-to-start-strengthening-your-town-with-incremental-development
  cnu-missing-middle: https://www.cnu.org/our-projects/missing-middle-housing
  better-block: https://www.betterblock.org/
  better-block-tactical: https://www.betterblock.org/post/interim-design-tactical-urbanism-a-new-civic-engagement-approach-in-action
  southern-main-street: https://www.southernurbanism.org/p/storefront-10-first-steps-toward
  southern-walkability: https://www.southernurbanism.org/p/thirteen-characteristics-of-walkable
  southern-housing: https://www.southernurbanism.org/p/affordability-tackling-atlantas-housing-452
  southern-third-places: https://www.southernurbanism.org/p/zoning-wont-save-us
  dallas-urbanists: https://thisdallaslife.com/
  lean-code: https://leanurbanism.org/lean-code-tool/
  ida: https://www.incrementaldevelopment.org/services
  pps-lqc: https://www.pps.org/article/lighter-quicker-cheaper
  pps-placemaking: https://www.pps.org/article/what-is-placemaking

tags:
  - id: zoning-reform
    label: Zoning reform
    description: Changes to zoning districts, use permissions, or development standards.
    group: land-use-housing
    source_refs: [st-walkability, cnu-missing-middle, dallas-urbanists, lean-code]
    rules:
      include: [zoning reform, zoning amendment, zoning code, rezoning, land use code, use district]
      exclude: [school zoning, school zone]
  - id: parking-mandates
    label: Parking mandates
    description: Minimum parking requirements and their effect on development or public space.
    group: land-use-housing
    source_refs: [st-walkability, dallas-urbanists, lean-code]
    rules:
      include: [parking minimum, minimum parking, parking requirement, parking mandate, off-street parking]
      exclude: [parking ticket, parking citation]
  - id: minimum-lot-size-setbacks
    label: Lot sizes and setbacks
    description: Minimum lot area, frontage, building placement, or setback standards.
    group: land-use-housing
    source_refs: [cnu-missing-middle, lean-code]
    rules:
      include: [minimum lot size, lot size minimum, minimum lot area, setback requirement, building setback, front setback, lot frontage]
  - id: housing-supply
    label: Housing supply
    description: Policies or projects intended to increase the amount or variety of housing.
    group: land-use-housing
    source_refs: [cnu-missing-middle, southern-housing, dallas-urbanists]
    rules:
      include: [housing supply, housing production, housing needs, residential capacity, homes per acre]
