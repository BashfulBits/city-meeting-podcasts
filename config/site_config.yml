# Global site configuration. Field reference: the inline comments here + ARCHITECTURE.md
# (start at AGENTS.md). (PLAN.md is the historical build plan, not the current config reference.)
custom_domain: "www.citymeetings.fyi"   # blank = github.io URL
site_title: "City Meeting Podcasts"
site_description: "Subscribe to your local government."
site_author: ""
site_author_url: ""
github_repo: "BashfulBits/city-meeting-podcasts"   # "user/repo" for Issue links
# Public website city-request form. Both values are intentionally public: Formspark's action URL
# and Turnstile's site key are emitted into the page. Spam verification uses the Turnstile secret
# stored only in Formspark; the Formspark→Worker shared secret stays only in the private webhook URL.
city_request_form:
  formspark_action: "https://submit-form.com/lyq8iwEP2"  # https://submit-form.com/<form-id>
  turnstile_site_key: "0x4AAAAAAD2JkYk0lOKcinjB"  # public Cloudflare Turnstile site key
# R12-only inference route. This is committed configuration, not a repository-wide LLM preference;
# future summary/tag features may select different models without changing city discovery.
city_discovery:
  llm_model: "gemini/gemini-3-flash-preview"
  llm_mode: "direct"  # direct | dispatch
# R5 topic tagging. Rules are always available. Dispatch collects validated LLM candidates in
# shadow storage; the generic calibration matrix controls visibility. The initial 1.0 fallback is
# intentionally conservative and can be lowered only after the weekly human-review process has
# established how a route's confidence scores behave.
tagging:
  enabled: true
  llm_model: "gemini/gemini-3-flash-preview"
  # direct | dispatch. Gemini's transport under R13's scheduler is "direct" (review/33 §7 — its
  # free tier doesn't need the Mistral Worker's async pacing); "dispatch" is for a route that
  # actually needs LLM_DISPATCH_URL configured (environment-only), which this route does not.
  llm_mode: "direct"
  taxonomy_path: "config/taxonomy.yml"
  evaluation:
    state_path: "llm_evaluation.json"
    fallback_confidence: 1.0
    required_precision: 0.90
    minimum_reviews: 12
    review_batch_size: 20
    fallbacks:
      topic-tags:
        "litellm:gemini/gemini-3-flash-preview": 1.0
# Optional banner shown on every page; clear it ("") to remove at launch.
site_notice: "Feed URLs and details may change before launch — don't rely on these feeds yet."
schedule_cron: "0 */4 * * *"             # production deploy cadence (also set in workflow)
request_delay_seconds: 0.1               # politeness sleep per worker thread
max_workers: 8
max_encodes_per_source: 2                # parallel episode workers within one source (silence + encode)
audio_queue_lookahead: 4                 # rolling audio submissions beyond active workers; raw source files are per-item

# Per-provider (per-host) rate limiting (issue #39 / per-provider rate limits). Caps the number of
# SIMULTANEOUS in-flight requests to each provider host across ALL worker threads in a process —
# covering both the requests session (RSS/page/probe) AND the ffmpeg media fetches (the heavy path).
# Sharded audio.yml/asr.yml (H6b) concentrate many workers on a few sources sharing one CDN; without
# this cap that burst throttles the provider (Granicus answers 403; Swagit returns short responses
# ffmpeg "succeeds" on → truncated 5-second audio). Keys are REGISTRABLE DOMAINS (not provider
# short-names) so the Granicus-owned Swagit CDN (*.granicus.com) is matched by the host the tenant
# actually sees; a host with no matching key is unlimited. Per-process (each shard is its own runner).
provider_rate_limits:
  granicus.com: 2  # process-local cap per shard (GH#300); aggregate is bounded by the distributed slots below
  swagit.com: 2
  civicclerk.com: 4

# Cross-shard provider leases. The process-local cap above is still needed inside each shard, but
# audio.yml has four shard jobs, so Granicus could still see 4×2 concurrent media fetches. These
# storage-backed soft leases cap aggregate ffprobe/ffmpeg media overlap across all shard processes
# using ordinary B2-compatible object upload/list/delete operations (no conditional PUT). Reduced
# from 6 → 2 as Phase 1 of the Granicus media reliability fix (GH#300): attack the likely cause
# (aggregate runner concurrency hitting CDN throttle) before request-shape experiments. Monitor
# audio backlog drain rate; ratchet back up only after confirming 403 rate < 5%.
provider_distributed_leases:
  granicus.com:
    slots: 4
    ttl_seconds: 900  # GH#378: 3600→900 so a dead holder's slot is reclaimable in ~15min, not 1h. Free: _renew_interval caps the renewal cadence at 60s for any ttl≥180, so 900/3=300→still 60s (unchanged renewal traffic). A legitimate fetch+encode (≤45min audio_encode_timeout) renews well within this.
    poll_seconds: 2
    settle_seconds: 0.25

# Declared Granicus audio concurrency ceiling. The H16 `concurrency_ceiling` acceptance criterion
# asserts the operative knobs above (provider_rate_limits.granicus.com + the distributed slots) match
# this intent, so a deliberate tune passes while an accidental drift between the two operative knobs is
# caught. Update this in lockstep when you change the operative ceiling. (Default if absent: 1 / 2.)
provider_audio_concurrency_ceiling:
  process_local: 1
  distributed: 4

# Domains for which the Audio lane records per-tenant transport telemetry (direct vs Cloudflare
# Worker fallback vs truncation). These counters feed the H16 acceptance report's `transport`
# criterion. The run-local rate-limit *circuit breaker* that used to live here
# (threshold/cooldown/parking/canary) was removed in GH#353: it never tripped across audio runs
# #51–#56 — the runner 403s were shared GitHub-egress IP reputation (handled by the Worker), not
# request-shape or concurrency throttling — and the provider-lease ceiling above plus per-episode
# materialize backoff already bound aggregate load. Rollback to direct-only stays config-only: unset
# GRANICUS_PROXY_BASE_URL / GRANICUS_PROXY_TOKEN.
provider_transport_telemetry_domains:
  - granicus.com

# Backlog prioritization (H5). An ordered list of comparator keys applied to the work backlog;
# ties fall through to the next key. With no list set, ordering is the behavior-preserving default.
# Keys: recency ({order: asc|desc, within_days: N}), recent_first: N, city_order (ranks by the
# city_order list below — partial lists fall through), body_order, feed_visible_first, long_first
# (transcript-lane work over N hours — bare `long_first` defaults to asr_local_max_duration_hours
# below — ranks first catalog-wide, ahead of every later key; never reorders audio). See
# review/12 §H5. Today: float the >4h external-required transcript backlog to the front (only the
# capped external GPU tier can ever transcribe those — H14), then keep the last 30 days complete,
# then fall to the default order. `long_first` never reorders `audio`, and the local ASR lane simply
# defers the floated >4h items at preflight (cheap, pre-download) — see workqueue.DURATION_AWARE_*.
backlog_priority:
  - long_first: 4                          # >4h transcript work first (== asr_local_max_duration_hours)
  - recency: {order: desc, within_days: 30}
# city_order: [denton-tx, dallas-tx]       # explicit city ranking (unset today)

defaults:
  search: true                           # static browser search; false removes its public output
  # Search-sidecar reads are restartable. Keep the render-only deployment bounded; a stopped build
  # retains the last complete manifest and tries again on the next render (0 = no time cap).
  search_index_budget_minutes: 20
  podcast_language: "en-us"
  podcast_category: "Government"
  max_episodes: 500                      # how many episodes a FEED renders (display cap)
  # Append-only archive retention (issue #109). The archive keeps every meeting we've ever seen
  # — even after it drops off the provider's window — so content + audio are never silently lost.
  # These caps bound that growth; set arbitrarily high so nothing is pruned today. Ratchet them
  # DOWN to reclaim storage (the admin/usage report shows the $/mo cost of keeping old audio).
  max_archive_items: 5000                # max records RETAINED per source (newest kept)
  max_archive_age_years: 1000            # drop records older than this many years
  extract_audio: true                    # re-host audio for direct (Granicus) sources as M4A
  audio_storage_backend: "routing"       # "local" | "b2" | "r2" | "routing"
  # This bounds the HEAVY `citypods enrich` phase only (chapters + audio + later transcripts). The
  # fast `citypods build --phase render` runs first and the Pages deploy happens BEFORE enrich, so
  # the site is already live regardless of how long enrich runs — this window just caps how much
  # backfill one run attempts. Enrich processes recordings until its wall-clock window is spent OR a
  # newer run is queued behind it (graceful yield). No count budget / per-episode estimate: with
  # variable per-recording cost (encode, later transcription), wall-clock time is the honest bound.
  #
  # Size the window so enrich COMPLETES (incl. its tail: finishing the in-flight recording + pushing
  # state) inside ONE schedule_cron interval — otherwise it overruns and the next run preempts it
  # (it still yields gracefully). Window = run_time_budget_minutes × budget_safety; keep
  # run_time_budget_minutes == the cron interval and let budget_safety reserve the tail.
  run_time_budget_minutes: 240           # == schedule_cron interval (4h); 0 = no time cap (yield only)
  budget_safety: 0.85                    # window = 204m; leaves ~36m of the 240m cron tick for the tail
  # ASR runs every 5h. Stop starting new local ASR at 285m, then let any in-flight transcript
  # continue until the 350m backstop. TranscriptStage estimates fit from the rolling
  # state/asr_runtime_log.json ratio log (falling back to the conservative timeout formula
  # until real samples exist).
  asr_start_cutoff_minutes: 285
  asr_backstop_minutes: 350
  # (Chapter scraping is bounded only by the wall-clock window in production; the PR preview passes
  # `citypods build --chapters-cap N` to keep its sanity-check fast — see .github/workflows/preview.yml.)
  audio_max_kbps: 96                     # re-host cap: copy audio if <= this, else re-encode to N kbps mono AAC
  # Multi-mic speech master: 80 Hz high-pass → dynaudnorm speaker leveling → gentle compressor →
  # measured linear EBU R128 normalization. The two-pass flow reads provider media once, stores a
  # temporary FLAC, and remains bounded-memory even for all-day meetings.
  audio_processing_profile: "podcast-speech-v2"
  audio_loudness_profile: "ebuR128:-16LUFS"  # final integrated target (Apple/Spotify speech norm).
                                              # The processing profile is part of audio_spec_hash:
                                              # enabling/changing its version gradually re-encodes
                                              # the catalog; clear it to use the legacy path.
  # Silence trimming via SilencePlanner (#111). Ships enabled; the re-encode backfill is gradual
  # (bounded by ~204 min run budget, spread across multiple cron ticks). To force a full catalog
  # re-trim after changing parameters, bump SilencePlanner.version in citypods/silence.py.
  # Per-feed opt-out: set extra: {trim_silence: false} in the feed YAML.
  trim_silence: true
  silence_noise_db: -40          # noise floor in dB for silence detection (negative value)
  silence_lead_trail_min_s: 1.0  # min leading/trailing silence to remove (seconds)
  silence_mid_min_s: 10          # min mid-meeting gap to remove (seconds); 10s cuts procedural
                                 # pauses and vote transitions for a tighter podcast edit
  # Sanity floor on the planned result (audio workflow review, 2026-06): rejects a near-empty
  # served timeline (observed: 0.005s/0.010s outputs from a bad/truncated silencedetect probe
  # reading the source as nearly all silent). Floor = max(silence_min_served_seconds,
  # source_duration * silence_min_served_fraction). When rejected, a prior valid timeline is
  # preserved; with no prior timeline the episode is stamped identity (untrimmed) instead.
  silence_min_served_seconds: 5.0
  silence_min_served_fraction: 0.02
  # Hard cap per probe+encode of a *network* fetch. 0 = no cap. Recalibrated 2026-07-02 (issue #497)
  # from 45min: a very conservative 12h longest-meeting ceiling (well above the
  # asr_backstop_minutes=350min/5h50m the ASR pipeline already assumes, and a real production Audio
  # run log floor of ~5.2h) at a conservative 20 Mbps floor throughput for the new 54 GB
  # source_media_max_bytes cap below: 54e9*8/20e6 = 21,600s ≈ 360min. The independent 120s stall
  # detector (-rw_timeout) is the first line of defense for a truly hung connection; this is the
  # backstop for a degraded-but-still-progressing one. Since the audio-workflow review (2026-07-19),
  # a run-in-progress ffmpeg child also gets terminated as soon as the run's wall-clock stop()
  # budget expires — it no longer has to poll out this whole timeout once the run is out of time.
  #
  # NOTE: GitHub-hosted runners hard-cap total job execution at 360 minutes, unconfigurable upward
  # (self-hosted runners have no such limit). Since this value already equals that ceiling, a
  # network fetch that genuinely needs the *entire* budget has zero margin against setup time and
  # whatever else the shard already processed this run — GitHub's kill can still win the race and
  # produce an undiagnosable "cancelled" job instead of a clean, backed-off encode error. Lowering
  # this to reclaim margin is a deliberate product tradeoff against real very-long meetings and is
  # not changed here; see audio_concat_timeout_minutes below for the one piece of this that *was*
  # safe to tighten unilaterally (a local, non-network step with a well-understood real-world cost).
  audio_encode_timeout_minutes: 360
  # Hard cap on the *local* multi-segment concat decode+re-encode (audio-workflow review,
  # 2026-07-19) — independent of audio_encode_timeout_minutes above, which is sized for a network
  # fetch of a single huge meeting. This step has no network I/O: every segment is already
  # downloaded with a known duration, so real production concats (including multi-hour meetings)
  # complete in seconds to a couple of minutes. Root cause of the incident that added this: one
  # corrupted upstream Swagit archive segment (malformed AAC) stalled ffmpeg's decoder inside this
  # step for hours on every run, silently consuming an entire audio shard's job budget until
  # GitHub's hard 6h ceiling force-killed it — the 360min network-fetch timeout above could never
  # fire first because it starts its clock after setup and every earlier episode in the run. Each
  # segment is now also decode-validated before reaching this step (citypods/media.py
  # CorruptSourceSegmentError), so this cap is a backstop for a still-unknown stall cause, not the
  # primary guard. 20min is generous headroom over the observed real-world cost. 0 = no cap.
  audio_concat_timeout_minutes: 20
  # Media-specific size ceiling for direct ffmpeg source fetches (issue #497): ffmpeg reads media
  # URLs directly via libavformat, bypassing every HTTP-layer byte cap (MAX_RESPONSE_BYTES is 64
  # MiB, sized for feed/JSON/HTML, not hours of audio/video). Before ffmpeg starts, a HEAD/ranged-
  # GET preflight refuses a source that *honestly discloses* a size over this cap; an unverifiable
  # ("unknown") size is logged and allowed through, since nothing can enforce a cap ffmpeg itself
  # doesn't respect. Calibrated from the same 12h duration ceiling as audio_encode_timeout_minutes
  # above, at an assumed worst-case 10 Mbps source bitrate (providers serve video containers, not
  # just the audio-only output this codebase can measure): 12h * 10 Mbps / 8 = 54,000,000,000
  # bytes. 0/blank disables the guard. See DEFAULT_SOURCE_MEDIA_MAX_BYTES in citypods/media.py.
  source_media_max_bytes: 54000000000
  audio_ffmpeg_threads: 1                # per-encode AAC threads; filter paths also pin
                                         # -filter_threads/-filter_complex_threads to this value.
                                         # Production enrich runs this as a one-core audio lane
                                         # beside ASR/resource-gated native work.
                                         # Clear to auto-calc (cpu_count // native_audio_max_active).
  audio_finalize_workers: 2              # local pass-2 workers. Provider fetch and speech-measure
                                         # stay on the global worker pool; completed FLACs finalize
                                         # here, sharing native_audio_max_active's total CPU cap.
  audio_ffmpeg_memory_floor_mb: 1536     # terminate the active ffmpeg child if runner MemAvailable
                                         # drops below this floor; records a retryable audio error
                                         # instead of letting the Actions runner get killed.
  native_audio_max_active: 3             # global ffmpeg encode slots — the HARD concurrency ceiling.
                                         # H11a tuning: 1 → 4 → 3. The streaming profile removes
                                         # duration-scaled memory pressure; this ceiling now primarily
                                         # caps CPU. At -threads 1 each, 3 encodes saturate 3 cores
                                         # while leaving one for the runner/orchestrator.
  # Predicted-memory admission for audio encodes (H8). The production streaming speech profile has a
  # fixed 768 MiB reservation independent of duration, so this 12 GiB budget no longer serializes long
  # meetings. The old duration-scaled 12 GiB estimate remains only for the disabled legacy dynamic-
  # loudnorm path. The kill floor above is still the backstop. 0/blank disables reservation admission.
  audio_memory_budget_mb: 12288
  # Resource admission guard for GitHub Actions enrich runs. It waits before starting another
  # expensive ffmpeg/ASR item when the runner is near the memory/CPU cliff, preventing exit-143 /
  # lost-communication kills. Locally it is off unless resource_guard_enabled is set true. With
  # `audio_memory_budget_mb` set, the reservation supersedes this for audio encodes; this gate then
  # governs ASR (a separate workflow/runner) and is the fallback if the budget is disabled.
  resource_guard_min_available_mb: 1536
  resource_guard_max_load_per_cpu: 1.0
  resource_guard_poll_seconds: 10
  min_meetings_per_body: 3               # generator: a body needs this many recent meetings to get a feed
  # Bodies whose name contains any of these (case-insensitive) are NOT turned into feeds by
  # the generator (procurement / public-info programs, not deliberative bodies). Override or
  # extend per city with a `body_exclude:` list in the city YAML.
  body_exclude: ["bid", "purchasing", "public education", "psa"]

  # ASR transcript generation (#110). Runs after audio is hosted; produces timed VTT for
  # <podcast:transcript> and downstream features (summaries, soundbites, search).
  # Two paths per episode:
  #   A. Forced alignment (stable-ts) when the provider has an untimed source transcript —
  #      preserves official wording, faster than full transcription.
  #   B. Fresh transcription (faster-whisper) when no source text is available.
  #
  # Model throughput on ubuntu-latest (4 vCPU, CPU int8, no GPU):
  #   large-v3-turbo  809 MB  ~15-20 min/hr audio  ~2-3% WER  ← default (best quality)
  #   small.en        244 MB  ~8-12 min/hr audio   ~5-7% WER  ← 2-3× more episodes/run
  #   base.en          74 MB  ~3-4 min/hr audio    ~8-10% WER ← max throughput
  # Run `citypods asr-bench` on 3-5 episodes with known transcripts to measure WER on this
  # corpus before changing the model. Per-feed override: set asr_model in the feed YAML.
  asr_enabled: true
  asr_model: "large-v3-turbo"           # preferred model; overridden at runtime by
                                        # ASR_MODEL_PATH (set by scripts/prepare_whisper.py)
                                        # which falls back to distil-large-v3 if large-v3-turbo
                                        # is unavailable from HuggingFace Hub or our B2 mirror
  asr_compute_type: "int8"              # int8 = fastest / most memory-efficient on CPU
  asr_language: "en"                    # Whisper language hint; clear for auto-detect
  asr_workers: 1                        # episode-level parallelism (1 model per worker);
                                        # 2 = ~1.7× throughput at 2× RAM; see models.py
  asr_beam_size: 5                      # beam search width; 1 = ~2× faster at quality cost
  # Temporarily defer forced alignment of untimed provider transcripts. stable-ts alignment loads a
  # separate model and has been the active exit-143 pressure point when overlapped with ffmpeg work.
  # H5/H6 will re-enable it as an align-only backlog/workflow lane with tighter resource isolation.
  asr_alignment_enabled: false
  # Bound one ASR item by wall-clock. If native inference stalls, abandon that item, skip
  # remaining ASR for this run, and persist completed enrich work instead of waiting for
  # GitHub Actions to terminate the whole process with exit 143.
  asr_timeout_base_minutes: 15
  asr_timeout_per_audio_hour_minutes: 30
  # Headroom over the base+per-hour budget above. Real run telemetry has shown completions at
  # ratio~0.503 against a budget assuming ratio 0.5 (~3% margin) — too tight to absorb routine
  # variance (harder audio, runner contention) without killing genuinely-progressing inference.
  asr_timeout_safety_margin: 1.2
  asr_timeout_budget_reserve_minutes: 1
  # Local/in-process faster-whisper memory-safety ceiling. This is independent from the rolling
  # runtime estimator above: external dispatch may accept recordings of any duration, but a known
  # recording longer than this is never allowed to overflow onto the GitHub runner. It remains
  # queued for Modal/Beam instead. Forks with larger self-hosted machines may raise it; <=0 disables.
  asr_local_max_duration_hours: 4
  # GPU/ASR execution backend (H13 — the pre-1.0 "compute is pluggable" lock). Selects where
  # transcribe/align inference runs. "local" runs faster-whisper/stable-ts in-process on the runner;
  # "auto" (H14a) routes through the dispatcher below — filling each external free-tier GPU budget
  # first, then overflowing to "local". Override: COMPUTE_BACKEND=local (a hard bypass of the seam).
  compute_backend: "auto"                # "local" | "auto"
  # External-compute policy (H14/H14d). The dispatcher fills these backends in config order, then
  # overflows to "local". The budget ledger is now provider-cycle dollars, while per-task runtime
  # estimation remains a separate empirical model that is updated after each completed claim.
  # `estimated_dollars_per_runtime_second` is the pricing input used for reservation-time estimates
  # and Beam actual settlement. Modal attempts to settle from exported actual billing cost first and
  # falls back to the same runtime-rate estimate if billing lookup is unavailable. `reserve_dollars`
  # leaves a soft buffer near the provider reset boundary. `max_claims_per_run` caps NEW
  # transcriptions per worker invocation (already-done items this run merely adopt don't count);
  # deploy env may override it temporarily for canaries/manual optimization runs. `fixed_runtime_`
  # `seconds_per_run` captures provider startup/setup overhead that scales with invocation count
  # rather than claim count. `prefer_min_duration_hours` lets external workers skip short meetings
  # that the GitHub runner can handle, while still respecting the manifest's queue order for the
  # long-meeting backlog they do claim.
  compute_backends:
    github-actions:
      tasks:
        transcript-asr:
          # Seed only — same units as the modal/beam entries below (runtime seconds per audio
          # second), learned/overwritten per-completion by the runtime-estimate ledger
          # (`observe_runtime_estimate`, compute/budget.py) once real claims land. Was `1.8`, which
          # read as *slower* than real time and contradicted this file's own `asr_timeout_*`
          # telemetry a few lines up (ratio~0.503, i.e. faster than real time on this exact
          # runner/model) by ~3.6x — plausibly the reciprocal throughput framing ("~1.8x real-time
          # speed") entered directly instead of inverted. Reseeded from that same assumed base
          # ratio (0.5) with the existing `asr_timeout_safety_margin` (1.2) applied, so admission
          # starts conservative and the auto-adjust parameter takes it from there.
          estimated_runtime_seconds_per_audio_second: 0.6
          min_runtime_seconds: 180
          fixed_runtime_seconds_per_run: 0
          fixed_runtime_seconds_per_claim: 0
    modal:
      hardware:
        gpu_type: L4
      budget:
        monthly_dollars: 24.0           # conservatively below free credit to absorb CPU/RAM billing
        reserve_dollars: 0.8
        rollover_day_of_month: 1
        estimated_dollars_per_runtime_second: 0.000222
        unit_label: dollar
      dispatch:
        max_inflight: 8
        min_claims_per_run: 1
        max_claims_per_run: 24
        preferred_days: even
      tasks:
        transcript-asr:
          prefer_min_duration_hours: 4
          fresh_within_days: 7
          estimated_runtime_seconds_per_audio_second: 0.023
          min_runtime_seconds: 240
          fixed_runtime_seconds_per_run: 0
          fixed_runtime_seconds_per_claim: 0
    beam:
      hardware:
        gpu_type: RTX4090
      budget:
        monthly_dollars: 24.0           # conservatively below free credit to absorb CPU/RAM billing
        reserve_dollars: 0.7
        rollover_day_of_month: 18       # confirmed against Beam's actual free-credit reset date
        estimated_dollars_per_runtime_second: 0.000192
        unit_label: dollar
      dispatch:
        max_inflight: 8
        min_claims_per_run: 1
        max_claims_per_run: 32
        preferred_days: odd
      tasks:
        transcript-asr:
          prefer_min_duration_hours: 4
          fresh_within_days: 7
          estimated_runtime_seconds_per_audio_second: 0.0175
          min_runtime_seconds: 180
          fixed_runtime_seconds_per_run: 0
          fixed_runtime_seconds_per_claim: 0
  # Stage-2 work-lease reaper (H17 / review/18 §4.2). The per-item R2 lease ledger external pull
  # workers (H14b/H14c) claim against was DORMANT until those workers existed, so `compute reconcile`
  # skipped its sweep by default — otherwise it spends one R2 GET per pending transcript item only to
  # find every lease absent (cheap Class-B, but pointless and backlog-scaled). H14b (#807) and H14c
  # (#808) are merged and going live (pre-live checklist GH#706 §4): enabled so a crashed worker's
  # claim is reclaimed/requeued instead of the ledger going unswept.
  work_lease_reaper_enabled: true

# Audio materialization (CivicPlus always; Granicus when extract_audio).
# Set GitHub Actions secrets for the selected backend (S3-compatible, zero/free egress):
#   b2  -> B2_ENDPOINT, B2_KEY_ID, B2_APP_KEY, B2_BUCKET, B2_PUBLIC_BASE_URL
#          (B2_PUBLIC_BASE_URL = your Cloudflare-fronted domain for free egress)
#   r2  -> CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_BASE_URL
#   local -> audio written to docs/audio, served from Pages (small sets / dev only)
# If the selected cloud backend's creds are absent, hosting is skipped (HLS feeds stay empty).
