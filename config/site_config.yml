# Global site configuration. See PLAN.md "Configuration reference".
custom_domain: "www.citymeetings.fyi"   # blank = github.io URL
site_title: "City Meeting Podcasts"
site_description: "Subscribe to your local government."
site_author: ""
site_author_url: ""
github_repo: "BashfulBits/city-meeting-podcasts"   # "user/repo" for Issue links
# Optional banner shown on every page; clear it ("") to remove at launch.
site_notice: "Feed URLs and details may change before launch — don't rely on these feeds yet."
schedule_cron: "0 */4 * * *"             # production deploy cadence (also set in workflow)
request_delay_seconds: 0.1               # politeness sleep per worker thread
max_workers: 8
max_encodes_per_source: 1                # parallel episode workers within one source (silence + encode)

defaults:
  podcast_language: "en-us"
  podcast_category: "Government"
  max_episodes: 500                      # how many episodes a FEED renders (display cap)
  # Append-only archive retention (issue #109). The archive keeps every meeting we've ever seen
  # — even after it drops off the provider's window — so content + audio are never silently lost.
  # These caps bound that growth; set arbitrarily high so nothing is pruned today. Ratchet them
  # DOWN to reclaim storage (the admin/usage report shows the $/mo cost of keeping old audio).
  max_archive_items: 5000                # max records RETAINED per source (newest kept)
  max_archive_age_years: 1000            # drop records older than this many years
  extract_audio: true                    # re-host audio for direct (Granicus) sources as M4A
  audio_storage_backend: "b2"            # "local" | "b2" | "r2"  (override: AUDIO_STORAGE_BACKEND=local)
  # This bounds the HEAVY `citypods enrich` phase only (chapters + audio + later transcripts). The
  # fast `citypods build --phase render` runs first and the Pages deploy happens BEFORE enrich, so
  # the site is already live regardless of how long enrich runs — this window just caps how much
  # backfill one run attempts. Enrich processes recordings until its wall-clock window is spent OR a
  # newer run is queued behind it (graceful yield). No count budget / per-episode estimate: with
  # variable per-recording cost (encode, later transcription), wall-clock time is the honest bound.
  #
  # Size the window so enrich COMPLETES (incl. its tail: finishing the in-flight recording + pushing
  # state) inside ONE schedule_cron interval — otherwise it overruns and the next run preempts it
  # (it still yields gracefully). Window = run_time_budget_minutes × budget_safety; keep
  # run_time_budget_minutes == the cron interval and let budget_safety reserve the tail.
  run_time_budget_minutes: 240           # == schedule_cron interval (4h); 0 = no time cap (yield only)
  budget_safety: 0.85                    # window = 204m; leaves ~36m of the 240m cron tick for the tail
  # (Chapter scraping is bounded only by the wall-clock window in production; the PR preview passes
  # `citypods build --chapters-cap N` to keep its sanity-check fast — see .github/workflows/preview.yml.)
  audio_max_kbps: 96                     # re-host cap: copy audio if <= this, else re-encode to N kbps mono AAC
  audio_loudness_profile: "ebuR128:-16LUFS"  # EBU R128 loudness normalization (-16 LUFS is the
                                              # Apple Podcasts / Spotify speech standard). Re-encodes
                                              # the full catalog on first enable (spec hash change).
                                              # Clear to disable / revert.
  # Silence trimming via SilencePlanner (#111). Ships enabled; the re-encode backfill is gradual
  # (bounded by ~204 min run budget, spread across multiple cron ticks). To force a full catalog
  # re-trim after changing parameters, bump SilencePlanner.version in citypods/silence.py.
  # Per-feed opt-out: set extra: {trim_silence: false} in the feed YAML.
  trim_silence: true
  silence_noise_db: -40          # noise floor in dB for silence detection (negative value)
  silence_lead_trail_min_s: 1.0  # min leading/trailing silence to remove (seconds)
  silence_mid_min_s: 10          # min mid-meeting gap to remove (seconds); 10s cuts procedural
                                 # pauses and vote transitions for a tighter podcast edit
  audio_encode_timeout_minutes: 45       # hard cap per probe+encode; a stalled source can't pin a
                                         # worker (which stop() can't preempt) past this. 0 = no cap.
  audio_ffmpeg_threads: 1                # per-encode AAC threads; filter paths also pin
                                         # -filter_threads/-filter_complex_threads to this value.
                                         # Production enrich runs this as a one-core audio lane
                                         # beside ASR/resource-gated native work.
                                         # Clear to auto-calc cpu_count // max_encodes_per_source.
  audio_ffmpeg_memory_floor_mb: 1536     # terminate the active ffmpeg child if runner MemAvailable
                                         # drops below this floor; records a retryable audio error
                                         # instead of letting the Actions runner get killed.
  native_audio_max_active: 1             # global ffmpeg encode slots during time-bounded enrich.
                                         # Keep at 1 on 4-core Actions runners until H11 tuning has
                                         # enough green-run data to safely raise it.
  # Resource admission guard for GitHub Actions enrich runs. It waits before starting another
  # expensive ffmpeg/ASR item when the runner is near the memory/CPU cliff, preventing exit-143 /
  # lost-communication kills. Locally it is off unless resource_guard_enabled is set true.
  resource_guard_min_available_mb: 1536
  resource_guard_max_load_per_cpu: 1.0
  resource_guard_poll_seconds: 10
  min_meetings_per_body: 3               # generator: a body needs this many recent meetings to get a feed
  # Bodies whose name contains any of these (case-insensitive) are NOT turned into feeds by
  # the generator (procurement / public-info programs, not deliberative bodies). Override or
  # extend per city with a `body_exclude:` list in the city YAML.
  body_exclude: ["bid", "purchasing", "public education", "psa"]

  # ASR transcript generation (#110). Runs after audio is hosted; produces timed VTT for
  # <podcast:transcript> and downstream features (summaries, soundbites, search).
  # Two paths per episode:
  #   A. Forced alignment (stable-ts) when the provider has an untimed source transcript —
  #      preserves official wording, faster than full transcription.
  #   B. Fresh transcription (faster-whisper) when no source text is available.
  #
  # Model throughput on ubuntu-latest (4 vCPU, CPU int8, no GPU):
  #   large-v3-turbo  809 MB  ~15-20 min/hr audio  ~2-3% WER  ← default (best quality)
  #   small.en        244 MB  ~8-12 min/hr audio   ~5-7% WER  ← 2-3× more episodes/run
  #   base.en          74 MB  ~3-4 min/hr audio    ~8-10% WER ← max throughput
  # Run `citypods asr-bench` on 3-5 episodes with known transcripts to measure WER on this
  # corpus before changing the model. Per-feed override: set asr_model in the feed YAML.
  asr_enabled: true
  asr_model: "large-v3-turbo"           # preferred model; overridden at runtime by
                                        # ASR_MODEL_PATH (set by scripts/prepare_whisper.py)
                                        # which falls back to distil-large-v3 if large-v3-turbo
                                        # is unavailable from HuggingFace Hub or our B2 mirror
  asr_compute_type: "int8"              # int8 = fastest / most memory-efficient on CPU
  asr_language: "en"                    # Whisper language hint; clear for auto-detect
  asr_workers: 1                        # episode-level parallelism (1 model per worker);
                                        # 2 = ~1.7× throughput at 2× RAM; see models.py
  asr_beam_size: 5                      # beam search width; 1 = ~2× faster at quality cost
  # Temporarily defer forced alignment of untimed provider transcripts. stable-ts alignment loads a
  # separate model and has been the active exit-143 pressure point when overlapped with ffmpeg work.
  # H5/H6 will re-enable it as an align-only backlog/workflow lane with tighter resource isolation.
  asr_alignment_enabled: false
  # Bound one ASR item by wall-clock. If native inference stalls, abandon that item, skip
  # remaining ASR for this run, and persist completed enrich work instead of waiting for
  # GitHub Actions to terminate the whole process with exit 143.
  asr_timeout_base_minutes: 15
  asr_timeout_per_audio_hour_minutes: 30
  asr_timeout_budget_reserve_minutes: 1

# Audio materialization (CivicPlus always; Granicus when extract_audio).
# Set GitHub Actions secrets for the selected backend (S3-compatible, zero/free egress):
#   b2  -> B2_ENDPOINT, B2_KEY_ID, B2_APP_KEY, B2_BUCKET, B2_PUBLIC_BASE_URL
#          (B2_PUBLIC_BASE_URL = your Cloudflare-fronted domain for free egress)
#   r2  -> CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_BASE_URL
#   local -> audio written to docs/audio, served from Pages (small sets / dev only)
# If the selected cloud backend's creds are absent, hosting is skipped (HLS feeds stay empty).
