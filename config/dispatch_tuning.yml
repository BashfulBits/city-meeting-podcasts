# LLM Dispatch v2 Worker tuning (non-secret, not account- or URL-specific).
#
# Compiled to workers/llm-dispatch-v2/src/dispatch_tuning.json by scripts/compile_dispatch_tuning.py
# (drift-checked in llm-dispatch-v2-worker-deploy.yml), exactly like dispatch_limits.json and
# ingress_reservations.json. These used to be Cloudflare `vars` in wrangler.jsonc. Workers Free caps
# a Worker at 64 variables INCLUDING secrets, and this block alone used 37 of them; moving it here
# frees those slots and makes every change a reviewed PR instead of a dashboard edit.
#
# Precedence at runtime (src/tuning.js): a Cloudflare variable or secret of the same name still wins
# (a deliberate incident-time override), then this file, then the literal fallback at the read site.
# Account-, URL- and credential-specific values (AI_GATEWAY_ID, provider keys, B2 settings,
# the bearer token) are NOT here and never belong in the repository.
#
# Daily DO row-write thresholds (DO_ROWS_ENQUEUE_STOP 90000, DO_ROWS_CLAIM_STOP 97000,
# DO_ROWS_OPTIONAL_STOP 99000) remain code defaults on purpose (see write_budget.js);
# override only for a deliberate incident response. Keep them out of this file.
#
# Keep the values numeric; the Worker reads them with Number().

MAX_BUNDLE_JOBS: 6
# Match one bundle's allowance so a single healthy model can fill every slot. Non-ceiling
# models start with this many indexed entries; bounded extensions may read past blocked heads.
# The route-per-bundle and exact token/lane limits still apply to all selected jobs.
MAX_JOBS_PER_MODEL_CLAIM: 6
# When every route of a model that currently has capacity carries a hard_input_ceiling, the
# claim reads up to this many queue entries (oldest first) to find jobs small enough for one
# of them, instead of stopping at the first MAX_JOBS_PER_MODEL_CLAIM. Without it a handful of
# oversized queue-head jobs blocked every smaller job behind them. Bounded, covering-index
# read: at most ~2 x 32 rows per model per tick, and only for ceiling-bound models.
MAX_CANDIDATE_LOOKAHEAD: 32
# A route answering 410 Gone (retired model) is stood down this long. A 404 is treated as a
# transient upstream fault (escalating 15s-5min cooldown) -- see classify.js rule 8.
ROUTE_UNAVAILABLE_BLOCK_SECONDS: 21600
MAX_JOBS_PER_ROUTE_PER_BUNDLE: 1
MAX_CONCURRENT_ROUTE_LANES: 6
# Raised 25 -> 30 on 2026-09-23: the largest value validateConfig's lease identity allows
# (DISPATCH_WINDOW + MAX_RESPONSE 720 + FINALIZATION_RESERVE 90 <= LEASE_DURATION 840). The
# window bounds only when a call may START; a started call is bounded separately by
# MAX_RESPONSE_SECONDS, and waiting on a provider costs no Worker CPU time.
DISPATCH_WINDOW_SECONDS: 30
CRON_TICK_SECONDS: 60
# Raised from 2 on 2026-09-20, from 3 to 5 on 2026-10-17, and from 5 to 12 on 2026-11-05:
# slow bundles (Gemma taking 200-300s, JEV taking minutes) filled every slot and caused 54 empty
# claims in a single day under active_bundle_limit. This changes concurrency only; daily
# bundle/job/write caps remain unchanged, and MAX_IN_FLIGHT_LLM_CALLS plus the
# per-provider/per-route concurrency limits remain the admission safety boundaries.
MAX_ACTIVE_BUNDLES: 12
# Raised from 8 to 12 and from 12 to 20 to relieve in_flight_call_limit bottlenecks.
# Per-provider and per-route limits remain the admission safety boundaries.
MAX_IN_FLIGHT_LLM_CALLS: 20
# 1,400 of the 1,440 daily cron ticks may claim a bundle (validateConfig requires it stay
# under the tick count). Bundles are a concurrency/overlap knob; the daily dispatch limit is
# DO_ROWS_CLAIM_STOP below.
MAX_BUNDLES_PER_UTC_DAY: 1400
# ---------------------------------------------------------------------------------------
# ---- Daily DO row-write thresholds (runtime; see src/write_budget.js) ------------------
# The Workers Free plan allows 100,000 billed DO rows written per UTC day, account-wide.
# Coordinator admission reserves 10,000 rows for other account writers and counter drift,
# making 90,000 the hard safe stop for this Worker. New claims stop earlier when the sum of
# actual rows, all active-lease worst-case completion/retry costs, and the next bundle's cost
# would reach that safe stop. Enqueues, cleanup, route-probe reservations, acks, retires and
# cancels also stop by 90,000. In-flight completions, retries and safety pauses remain allowed;
# the active-lease reserve is what leaves them room to drain. Structured Worker logs record
# each RPC's billed-row delta and running total to compare this coordinator's counter with the
# account-wide limit.
#
# The configured defaults (`DO_ROWS_ENQUEUE_STOP` 90000, `DO_ROWS_CLAIM_STOP` 97000,
# `DO_ROWS_OPTIONAL_STOP` 99000) remain upper bounds and are deliberately NOT declared as
# vars: Workers Free allows 64 variables per Worker, secrets included, and declaring defaults
# pushed this Worker to 66, which rejected every deploy from #1846 on. The runtime clamps all
# three to the account safe stop; the claim gate can close earlier based on active work.
# Override only for a deliberate incident response; tests/test_llm_dispatch_worker_limits.py
# checks the deployed variable count.
# A blast-radius backstop, not the working limit: MAX_BUNDLES_PER_UTC_DAY x MAX_BUNDLE_JOBS.
MAX_LEASES_PER_UTC_DAY: 7000
# Shared free-tier ceilings, NOT an 800-meeting capacity commitment. The full planning scenario
# requires 20,800 new jobs/day (including enabled shadow and a three-judge/five-quote panel),
# before retries. Capacity evidence: review/evidence/2026-10-02-llm-800-meeting-capacity.md
# Reproduce with scripts/llm_capacity_plan.py.
# Keep the shared cap bounded near measured drain; raising it alone only grows the queue.
# Raised 4,000 -> 6,000 (2026-11-05) after the review/57 packed-state cutover: a full packed day
# (2026-11-04) wrote 24,269 billed rows for 1,370 jobs ingested and ~800 completed, against
# 51-72k rows/day under legacy tables. Worst case at the new caps: 6,000 jobs x ~6 enqueue rows
# (compact queue) = 36k, plus 2,000 drained jobs x 24 lifecycle rows = 48k, plus ~2.4k idle and
# operational rows, about 86k, under the 90,000-row safe stop. Real drain is ~800/day.
MAX_JOBS_PER_UTC_DAY: 6000
# Admission units cover enqueue indexes only, not completion/retry/retirement billed rows.
# This ceiling remains below the static enqueue-row bound and live row headroom gates ingress.
# Per-lane ceilings can exceed this envelope; their sum is demand, not guaranteed funding.
# Raised 25,600 -> 38,400 (2026-11-05, with MAX_JOBS_PER_UTC_DAY above). validateConfig
# assumes the legacy 2 rows/unit, so 38,400 x 2 = 76,800 stays under DO_ROWS_ENQUEUE_STOP
# (90,000) even after a rollback to legacy tables; 45,000 is the static ceiling.
MAX_INGRESS_WRITE_UNITS_PER_UTC_DAY: 38400
# Global cap on queued jobs (MAX_QUEUED_JOBS): past it new work waits in the producer, not in
# the DO. Left at the coordinator's default of 20,000 (`_maxQueuedJobs`), so not declared --
# see the variable-limit note above.
# Per-purpose ingress budgets now live in config/site_config.yml's `llm_lanes` block and are
# compiled into src/ingress_reservations.json by scripts/compile_llm_lanes.py (drift-checked
# in llm-dispatch-v2-worker-deploy.yml), so this var is gone. It had drifted to reserve
# capacity under keys -- "topic-tags", "moments" -- that no client purpose ever matched
# ("topic-tags:tagger", "topic-tags:prelabeler", "r6-moments", "r6-judge"), which withheld
# 10,000 of 30,000 daily write units from every real lane while being unusable by the lanes
# it named. Setting INGRESS_PURPOSE_RESERVATIONS here again is still honored, but only as a
# deliberate incident-time override of the compiled map.
ENQUEUE_BATCH_MAX: 1000
POLL_BATCH_MAX: 1000
MAX_RESPONSE_SECONDS: 720
FINALIZATION_RESERVE_SECONDS: 90
LEASE_DURATION_SECONDS: 840
CRON_EXECUTION_LIMIT_SECONDS: 900
MAX_429_RETRIES: 1
MAX_429_BACKOFF_SECONDS: 60
UPSTREAM_CAPACITY_COOLDOWN_SECONDS: 15
UPSTREAM_CAPACITY_MAX_COOLDOWN_SECONDS: 300
# A route whose provider keeps answering upstream_capacity (its pool is full) doubles its cooldown
# from 60 s up to one probe per day; its first success resets the ladder. Gateway limits and
# unusable replies keep the 15 s to 300 s ladder above.
UPSTREAM_CAPACITY_SATURATED_COOLDOWN_SECONDS: 60
UPSTREAM_CAPACITY_SATURATED_MAX_COOLDOWN_SECONDS: 86400
# Google Gemma has Gateway attempts=1 and a dedicated availability recovery ladder (review/56).
# Other generic 5xx errors get one durable fallback on a later cron. The route waits 60 seconds,
# growing to at most five minutes if this outer retry budget is raised.
MAX_UPSTREAM_CAPACITY_RETRIES: 8
# ---- Route health ladder (review/58 B3, WP3b; src/route_health.js) ---------------------------
# Failing routes were re-picked every tick: 58% of retries went back to the route that had just
# failed, and 45.5% of provider attempts failed (2026-11-04..11). A route now counts consecutive
# failures per class with no success in between -- response timeout (our deadline or a gateway
# 504/524), upstream capacity (upstream_capacity, final 5xx) and request defect (any 4xx
# request_defect, including BeatAPI's "model not available to this key" 400) -- and enters the
# ladder when one class reaches its threshold. Each rung is a route cooldown (blocked_until):
# jobs move to the model's other routes or stay queued; nothing fails because of it. When a
# cooldown ends the route takes ONE call (half-open); success clears the ladder, any tracked
# failure moves it a rung up, failures of calls already in flight while it cools do not.
# Set ROUTE_HEALTH_LADDER_ENABLED to 0 to switch it off without a code rollback (cooldowns
# already written run out on their own, at most RUNG_4 seconds); a threshold of 0 exempts a class.
ROUTE_HEALTH_LADDER_ENABLED: 1
# A timeout holds a slot for up to 720 s and rarely recovers on the same route (47 of 230 AI
# Studio Gemma jobs), so the first one starts the ladder.
ROUTE_HEALTH_TIMEOUT_THRESHOLD: 1
# About half of the jobs that hit a Gemma 503 later succeeded (693 of 1,473), so one 503 keeps
# the short class cooldowns above (Google: at most 5 s) and the second in a row starts the ladder.
# AI Gateway `citypods-dispatch` retries a failed upstream call itself (3 attempts, 5 s delay,
# exponential) unless a route sends cf-aig-max-attempts: AI Studio Gemma and SambaNova send 1, so
# one failure there is one provider answer; every other provider's is already three.
ROUTE_HEALTH_CAPACITY_THRESHOLD: 2
# A single request defect is the job's (it still fails that job only). Three in a row on one
# route with no success between are the route's: jev-1.13-free answered 717 x 400 because BeatAPI
# withdrew the model, and 0 of 882 such jobs recovered.
ROUTE_HEALTH_DEFECT_THRESHOLD: 3
# Rung cooldowns. 60 s is one cron tick; the top rung allows at most 24 probes a day on a route
# that never recovers. Rungs stop at the first 0.
ROUTE_HEALTH_RUNG_1_SECONDS: 60
ROUTE_HEALTH_RUNG_2_SECONDS: 300
ROUTE_HEALTH_RUNG_3_SECONDS: 900
ROUTE_HEALTH_RUNG_4_SECONDS: 3600
# ---- Early slot release (review/58 B1, WP4; src/early_release.js) -----------------------------
# A bundle used to commit once, when its slowest call ended, so a call that returned in 3 s held
# its in-flight slot and its route lease for up to 12 minutes (58% of held slot-time was this idle
# hold, 2026-11-04..11). The executor now commits settled calls early through a partial completion
# once at least one call has settled, another is still running, and DEBOUNCE seconds have passed
# since the bundle started or since its previous partial. MAX_COMMITS counts every commit of a
# bundle including the final one (ceiling 3), so 3 means at most two partials. Each partial costs
# one more DO RPC and one more billed row (the accounting row), two in packed mode when the
# partial and the final touch routes on the same telemetry shard (measured in
# test/row-accounting.test.js, see review/58 section 8). The DO refuses a partial (writing
# nothing; the final carries its results) once the day's partials have written DAILY_ROWS rows
# (charged at 2 each, prorated over the UTC day so they spread across it): a day therefore ends
# at most DAILY_ROWS above what its other work wrote. It also refuses while today's billed rows
# are ahead of ROW_PACE rows per day prorated to the time of day, so a heavy day falls back to one
# commit per bundle. Sizing DAILY_ROWS 3,000 (review/58 section 8):
# - Headroom: production wrote about 2,100 billed rows in the first 94 minutes of 2026-11-13 UTC
#   (about 32,000 rows/day at that pace), and idle hold was still 43-49% of held slot-time on
#   2026-11-12/13. The earlier 1,000 (about 500 partials) left most of that headroom unused.
# - Hard bound: a bundle makes at most one partial at MAX_COMMITS 2, charged 2 rows, and the claim
#   refuses past MAX_BUNDLES_PER_UTC_DAY (1,400, reset at UTC midnight). Up to MAX_ACTIVE_BUNDLES
#   (12) bundles claimed before midnight may also make their partial after it, so partials write
#   at most (1,400 + 12) x 2 = 2,824 rows a day. 3,000 therefore does not refuse for budget at any
#   volume (except perhaps a few partials just after midnight, where the prorated line is lowest)
#   and still bounds the day if MAX_COMMITS or the bundle cap is raised.
# - Trade at 6,000 results/day (other work about 84,000 rows): a uniformly heavy day sits on the
#   pace line, which refuses partials; a back-loaded day can spend up to 3,000, so it ends at or
#   under about 87,000 rows (simulated: at most 86,950), above the 85,000 target but under the
#   90,000 stop. If results/day approach 6,000, lower DAILY_ROWS back toward 1,000.
# Set EARLY_SLOT_RELEASE_ENABLED to 0 (or MAX_COMMITS to 1) to restore the single commit without a
# code rollback; the DO then refuses any partial it is sent.
EARLY_SLOT_RELEASE_ENABLED: 1
EARLY_SLOT_RELEASE_DEBOUNCE_SECONDS: 60
EARLY_SLOT_RELEASE_MAX_COMMITS: 2
EARLY_SLOT_RELEASE_ROW_PACE: 85000
EARLY_SLOT_RELEASE_DAILY_ROWS: 3000
# A reply cut off at its output limit on a job pinned to one model (per_model judge lanes) recurs
# on that model, so it gets this many retries, not the upstream budget, then fails to its producer.
MAX_SINGLE_MODEL_OUTPUT_BUDGET_RETRIES: 1
MAX_5XX_RETRIES: 1
# The detailed /v2/stats snapshot scans every retained and queued job (about 80,000 rows read in
# production). A copy younger than the cache window is served as is, and at most the daily count of
# fresh snapshots is computed. Use /v2/stats?routes=1 for route capacity.
DETAILED_STATS_CACHE_SECONDS: 300
DETAILED_STATS_MAX_PER_UTC_DAY: 24
MAX_5XX_BACKOFF_SECONDS: 300
MAX_ROUTE_BUFFER_SECONDS: 120
COMPLETED_RETENTION_DAYS: 38
# Retention for the DO's per-day telemetry cells, `attempt_usage` and `route_failures` (the
# per-attempt `attempts` journal they replaced, and the `bundles` table now held in the scheduler
# row, were retired on 2026-10-07). Neither has a B2 counterpart or a client-side reader, so both
# age out entirely inside the DO. Zero on the per-tick cap is an emergency pause.
ATTEMPT_RETENTION_DAYS: 7
MAX_ATTEMPT_PRUNE_PER_TICK: 50
# Terminal-job + B2 object cleanup (purgePendingBatch/confirmPurge). Runs on the cron tick
# whose UTC minute is a multiple of this, not every minute, since each purged job costs up to
# two B2 delete subrequests (payload + result keys). 15 costs up to 30, leaving headroom
# under the 50-subrequest-per-invocation Free ceiling alongside dispatch's own B2 traffic in
# the same invocation -- validateConfig enforces this bound against both knobs together.
#
# Every 10 minutes since 2026-09-24 (60 -> 12 on 2026-09-23, then 10): 6 runs/hour x
# PURGE_BATCH_LIMIT 14 = 2,016 jobs/day. Completed jobs the client retires by consumption
# never reach cleanup, so this drains failed jobs, ack fallbacks and the acked backlog; it
# pauses past DO_ROWS_ENQUEUE_STOP and resumes after the reset. The per-run limit cannot
# rise (subrequests), so the cadence does.
CLEANUP_INTERVAL_MINUTES: 10
PURGE_BATCH_LIMIT: 14
# review/58 WP6b kill switch for the cron's producer workflow triggers (src/producer_trigger.js,
# schedule in config/producer_triggers.yml, whose minutes may never be cleanup minutes). 1 = on
# once the GITHUB_DISPATCH_TOKEN secret exists; the trigger is a no-op without it. To stop it
# without a code change, `wrangler secret put PRODUCER_TRIGGER_ENABLED` with the value 0: a
# secret overrides this default and, unlike a dashboard variable, survives the next deploy.
PRODUCER_TRIGGER_ENABLED: 1
# Admission-time allowance subtracted from the dispatch window: a job is admitted only if its
# planned start + this value <= the window's end. Lowered 20 -> 2 on 2026-09-23. At 20 it
# left only the first 5s of the then 25s window usable (30s since the raise above), although nothing downstream needs the CALL to
# finish inside the window -- the executor defers a job only when its START would fall past
# the window (index.js dispatchOneJob), and a started call is already bounded by
# MAX_RESPONSE_SECONDS inside the lease. The remaining 2s absorbs claim-to-receipt skew so a
# job planned at the window's very edge is not routinely deferred_late.
ESTIMATED_CALL_DURATION_CEILING_SECONDS: 2
# Not secret -- a gateway slug, not a credential. Matched the retired v1 Worker's
# wrangler.jsonc exactly. gateway.js's resolveProviderCredentials() only routes a call through
# AI Gateway when both this and the CLOUDFLARE_ACCOUNT_ID secret are present; omitted, it
# falls back to calling each provider directly with no error, no log line, and no other
# visible symptom -- confirmed as this deployment's actual state until now: every call landed
# straight on the provider, never through the gateway, so nothing showed up in the AI Gateway
# dashboard even though dispatch itself was working (see "Why cron pull, not Queue" for why
# going through the gateway isn't optional here).
