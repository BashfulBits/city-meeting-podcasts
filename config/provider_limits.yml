  # ==========================================
  # NVIDIA BUILD ROUTES (build.nvidia.com / NIM hosted API catalog)
  # See the `nvidia` provider block above for the capacity caveats these routes share: a
  # self-imposed 0.5 RPM provider-wide pace. Measured 2026-08-29: NVIDIA locks these endpoints
  # out for ~22-49 minutes once roughly 30 successful requests land inside a rolling hour (three
  # lockouts began at 28, 37 and 31 successes/hr), and the lockouts appear to lengthen when we keep
  # exhausting it. 30/hr is 0.5/min, so that is the pace. It costs no throughput -- the hourly quota
  # caps us either way -- it just spends the quota evenly instead of burning it in half an hour and
  # then sitting locked out. Below 1 rpm is deliberate and supported; see _scale_rate_limit and
  # per-route 40k TPM self-imposed cap that is *not* summed across routes (no real provider-level
  # TPM ledger exists yet). No `rpd` -- NVIDIA publishes no daily cap. The provider-level
  # `structured_output_method: json_schema` is inherited, not verified: NVIDIA serves each model
  # through its own stack, and at least one (deepseek-v4.1-flash) answers json_schema with empty
  # content, so a route that has been checked carries its own verified method.
  #
  # Each route ALSO declares its own `rpm: 12`, matching the provider-wide cap, even though
  # Python's LLMBudget already enforces that cap correctly at the shared-provider level
  # (`provider_rpm`/`ProviderLedger`) regardless of any route-level value. This is a defense-in-
  # depth stopgap for `workers/llm-dispatch-v2`: unlike v1 (`llm-dispatch-proxy`, which ports
  # `providerRpm`/`providerAvailable`/`reserveProviderCapacity`), v2's pacing engine
  # (`workers/llm-dispatch-v2/src/pacing.js`) has no cross-route, provider-level concept at all --
  # `earliestSafeStart`/`routeHasCapacityFor` only see one route's own rpm/rpd/tpm. Without a
  # route-level rpm, v2 would treat these routes as unbounded, and v1/v2 are actively coexisting
  # right now (`split_cap_multiplier: 0.50` above), not a future migration. This does not restore
  # true shared pooling in v2 -- in the worst case (many different NVIDIA models dispatched
  # concurrently) v2's aggregate could still exceed the provider-wide rpm in total -- but it bounds each
  # individual route rather than leaving it uncapped. A real fix ports provider-level pacing into
  # v2's pacing.js/coordinator.js; that is a larger follow-up, not done here.
  #
  # Several of these pool with an existing route elsewhere in this file via `model_key`/`model` --
  # NVIDIA becomes an additional, independent free capacity source for that same logical model
  # rather than a new one, exactly like the existing SambaNova+SiliconFlow / OpenRouter+Kilo+
  # OpenCode poolings above.
  - route_id: nvidia_kimi_k3_free
    model: moonshotai/kimi-k3
    provider: nvidia
    upstream_model: moonshotai/kimi-k3
    # 2.8T MoE (104B active), 1,048,576-token context per NVIDIA's own model card
    # (docs.api.nvidia.com/nim/reference/moonshotai-kimi-k3). No comparable free frontier model
    # exists elsewhere in this pool.
    input_context_limit: 1048576
    output_context_limit: 65536
    account_id: primary
    # 4 rpm, NOT deepseek-v4-pro's 0.5: NVIDIA's quotas are per model, and this route has never
    # returned a 429. Briefly inheriting deepseek's quota-derived rate on 2026-08-29 throttled the
    # routes actually carrying overflow traffic to one request per four minutes per Worker, which
    # showed up immediately as a drop in dispatched jobs.
    rpm: 4
    # NOT raised to "fix" a hard_input_ceiling-vs-tpm tension (2026-09-12 self-correction): an
    # earlier version of this comment raised tpm to 60000 specifically to stop pacing.js's old
    # tpm*FULL_TOKEN_BUDGET_WINDOWS(5) admissibility gate from rejecting the measured
    # hard_input_ceiling on this route -- but that number was BACK-SOLVED from an unrelated
    # formula, not measured or published. Input-ceiling (max size of one request, measured
    # directly and reliably below) and TPM (sustained tokens/minute) are genuinely independent
    # axes that vary per route/provider; NVIDIA does not expose a rate-limit header (confirmed
    # live: a 200 OK response carries none) and does not publish a per-model TPM figure (its own
    # developer forums: "limits vary by model and are not published"). This tpm value remains
    # exactly what it was before this session -- an unverified inherited placeholder, not a
    # measurement -- pending an actual sustained-rate probe (a real Phase-1-style test, separate
    # from the ceiling search below). That old tpm*5 gate was retired outright (2026-09-13,
    # workers/llm-dispatch-v2/src/pacing.js): hard_input_ceiling is now the ONLY size-admissibility
    # check, and the TPM bucket refills with no upper cap, so a hard_input_ceiling well above tpm
    # is no longer inert -- pacing simply waits longer for the bucket to accrue enough for a
    # request this size, exactly the behavior this route's real ~6x ratio calls for.
    tpm: 40000
    hard_input_ceiling: 234437
    # Raised back to 4 on 2026-08-30. The ceiling of 1 was set the day before on the
    # theory that NVIDIA rejects any overlapping request with a fast ~8.3s 429. Gateway
    # logs since the routing fix landed at 14Z say otherwise: nemotron-3-super ran 39
    # calls with 39 successes and no 429 at all. The rejections were deepseek-v4-pro's
    # account-level lockout, which that route still carries its own ceiling for -- the
    # same over-generalisation that scoped its rate to all nine routes (PR #1336).
    #
    # Concurrency, not rpm/tpm, was the binding constraint: with a ceiling of 1 the
    # dispatcher never came close to either limit, because nothing was allowed in
    # flight to consume them.
    #
    # Lowered 4 -> 1 on 2026-09-23. This route carries only full-transcript overflow for the
    # locator/moments lanes, and those calls ran ~590s. NVIDIA's provider-wide concurrency is
    # shared with Nemotron 3 Ultra (the chapter-agenda lane's elastic route), so a few of these
    # overflow calls could otherwise hold every NVIDIA slot for ten minutes at a time.
    concurrency: 1
    free: true
    input_per_token: 0.0
    output_per_token: 0.0
    observed_on: "2026-09-12"
    observed_burst: 2
    observed_input_ceiling: 234437

  # NVIDIA retired both `deepseek-ai/deepseek-v4-pro-0813` and `deepseek-ai/deepseek-v4-flash-0731`
  # (HTTP 410 Gone; 22-28 locator/moments jobs a day failed terminally against the pro route on
  # 2026-09-21/22) and now serves `deepseek-ai/deepseek-v4.1-flash` in their place -- confirmed
  # in NVIDIA's /v1/models listing on 2026-09-23.
  #
  # One pool name per DeepSeek version (2026-09-24). Pooling v4 and v4.1 under one name hid
  # OrcaRouter's v4 (no lane used the shared name) and meant a job could be answered by either
  # version. Lanes now list the versions they want explicitly:
  #   deepseek/deepseek-v4.1-flash -> this route (AA 39.5): r6-moments overflow, tournament:tag
  #   deepseek/deepseek-v4-flash   -> OrcaRouter's v4 only (AA 34.3): chapter-locator overflow,
  #                                   tagger spill, its own tournament:tag contestant
  # The former `deepseek/deepseek-v4-pro` alias (which also pointed here) is retired.
  #
  # No `hard_input_ceiling` yet: NVIDIA was returning 503 "Service temporarily overloaded" for
  # every model when this route was added, so run the route probe (llm-rate-probe.yml) and author
  # a measured ceiling in a follow-up. Until then admission falls back to `input_context_limit`.
  - route_id: nvidia_deepseek_v4_1_flash_free
    model: nvidia/deepseek-v4.1-flash
    model_key: deepseek/deepseek-v4.1-flash
    provider: nvidia
    upstream_model: deepseek-ai/deepseek-v4.1-flash
    input_context_limit: 1000000
    output_context_limit: 384000
    account_id: primary
    # Carried over from the v4-flash-0731 route it replaces (never returned a 429 at 4 rpm).
    rpm: 4
    tpm: 40000
    # 1, not the old routes' 4: this route carries full-transcript overflow (multi-minute calls)
    # and must not crowd Nemotron 3 Ultra out of NVIDIA's shared provider concurrency.
    concurrency: 1
    free: true
    input_per_token: 0.0
    output_per_token: 0.0
    upstream_429_default: upstream_capacity
    # Verified 2026-09-24: json_schema and json_object both return a 200 with EMPTY content
    # (reasoning only); with no response_format the model returns valid JSON.
    structured_output_method: prompt_only
    structured_output_verified_on: "2026-09-24"
    # How this route turns thinking off when a lane asks for `reasoning: off` (verified
    # 2026-09-24: no reasoning tokens, valid JSON). Not applied by default: the model keeps its
    # default thinking unless a lane opts in for a job type (llm_lanes[...].reasoning).
    reasoning_controls:
      "off":  # quoted: bare `off` is YAML's boolean false
        chat_template_kwargs:
          enable_thinking: false

  - route_id: nvidia_gemma_4_31b_it_free
    model: google/gemma-4-31b-it
    # Pools with Google AI Studio's two direct accounts and OpenRouter's free leg -- a third
    # independent pool for the same logical model.
    provider: nvidia
    upstream_model: google/gemma-4-31b-it
    input_context_limit: 262144
    output_context_limit: 32768
    # Gemma tokenizer vs chars/4: p50 0.99 / p95 1.16 / max 1.48 over 675 paired jobs (2026-09-23).
    input_token_ratio: 1.2
    account_id: primary
    # 4 rpm, NOT deepseek-v4-pro's 0.5: NVIDIA's quotas are per model, and this route has never
    # returned a 429. Briefly inheriting deepseek's quota-derived rate on 2026-08-29 throttled the
    # routes actually carrying overflow traffic to one request per four minutes per Worker, which
    # showed up immediately as a drop in dispatched jobs.
    rpm: 4
    # Paused 2026-09-23 (temporary). Gemma calls here ran 172s median / 531s p90 and held
    # NVIDIA's shared provider concurrency that Nemotron 3 Ultra -- the chapter-agenda lane's
    # only elastic route -- needs. Gemma producers now size jobs to fit Google AI Studio's two
    # 14,400-RPD Gemma routes instead (see tags.py's prelabeler batching), so this leg is no
    # longer needed for capacity. rpd: 0 is the repository's paused-route convention.
    rpd: 0
