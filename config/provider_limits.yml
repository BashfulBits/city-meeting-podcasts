  # Gemma 4 Massive Free Quota Pools (14.4k RPD / 30 RPM each)
  #
  # Google quota probe (2026-09-12, secondary key): provider_reported_tpm 16000, with no observed
  # contention. This is an aggregate per-model input-token/minute quota, not a per-request size
  # boundary. Keep 10% headroom by setting hard_input_ceiling to 14400; the scheduler's rolling
  # TPM reservation accounts for aggregate input plus output use. This replaces the earlier
  # 10000 stopgap, which unnecessarily sent otherwise admissible jobs to fallback routes.
  # observed_input_ceiling below remains the historical probe observation; it is not promoted to
  # the new hard ceiling because this quota probe did not measure a per-request maximum.
  # hard_input_ceiling_tolerance 0.1 lets the Worker still try a job whose calibrated size is up
  # to 10% over 14400 (15840, still under the 16000 quota): the calibrated size is itself an
  # estimate (learned p95 x headroom), and refusing near-miss jobs outright left them queued with
  # no route once SambaNova's 20/day was spent (2026-09-25).
  - route_id: gemma_4_26b_primary
    model: google/gemma-4-26b-a4b-it
    provider: gemini
    upstream_model: gemma-4-26b-a4b-it
    input_context_limit: 262144
    output_context_limit: 32768
    # Gemma tokenizer vs chars/4: p50 0.99 / p95 1.16 / max 1.48 over 675 paired jobs (2026-09-23).
    # Prior covers the measured upper tail within the 10% TPM safety margin.
    input_token_ratio: 1.4
    account_id: project_primary
    rpm: 30
    rpd: 14400
    tpm: 16000
    hard_input_ceiling: 14400
    hard_input_ceiling_tolerance: 0.1
    free: true
    observed_on: "2026-09-12"
