  # ==========================================
  # NVIDIA BUILD ROUTES (build.nvidia.com / NIM hosted API catalog)
  # See the `nvidia` provider block above for the capacity caveats these routes share: a
  # self-imposed 0.5 RPM provider-wide pace. Measured 2026-08-29: NVIDIA locks these endpoints
  # out for ~22-49 minutes once roughly 30 successful requests land inside a rolling hour (three
  # lockouts began at 28, 37 and 31 successes/hr), and the lockouts appear to lengthen when we keep
  # exhausting it. 30/hr is 0.5/min, so that is the pace. It costs no throughput -- the hourly quota
  # caps us either way -- it just spends the quota evenly instead of burning it in half an hour and
  # then sitting locked out. Below 1 rpm is deliberate and supported; see _scale_rate_limit and
  # per-route 40k TPM self-imposed cap that is *not* summed across routes (no real provider-level
  # TPM ledger exists yet). No `rpd` -- NVIDIA publishes no daily cap. `structured_output_profile`
  # is left at the config default (`standard_json_schema`, via `instructor`) rather than guessing
  # this gateway's native JSON-mode behavior, which is unverified.
  #
  # Each route ALSO declares its own `rpm: 12`, matching the provider-wide cap, even though
  # Python's LLMBudget already enforces that cap correctly at the shared-provider level
  # (`provider_rpm`/`ProviderLedger`) regardless of any route-level value. This is a defense-in-
  # depth stopgap for `workers/llm-dispatch-v2`: unlike v1 (`llm-dispatch-proxy`, which ports
  # `providerRpm`/`providerAvailable`/`reserveProviderCapacity`), v2's pacing engine
  # (`workers/llm-dispatch-v2/src/pacing.js`) has no cross-route, provider-level concept at all --
  # `earliestSafeStart`/`routeHasCapacityFor` only see one route's own rpm/rpd/tpm. Without a
  # route-level rpm, v2 would treat these routes as unbounded, and v1/v2 are actively coexisting
  # right now (`split_cap_multiplier: 0.50` above), not a future migration. This does not restore
  # true shared pooling in v2 -- in the worst case (many different NVIDIA models dispatched
  # concurrently) v2's aggregate could still exceed the provider-wide rpm in total -- but it bounds each
  # individual route rather than leaving it uncapped. A real fix ports provider-level pacing into
  # v2's pacing.js/coordinator.js; that is a larger follow-up, not done here.
  #
  # Several of these pool with an existing route elsewhere in this file via `model_key`/`model` --
  # NVIDIA becomes an additional, independent free capacity source for that same logical model
  # rather than a new one, exactly like the existing SambaNova+SiliconFlow / OpenRouter+Kilo+
  # OpenCode poolings above.
  - route_id: nvidia_kimi_k3_free
    model: moonshotai/kimi-k3
    provider: nvidia
    upstream_model: moonshotai/kimi-k3
    # 2.8T MoE (104B active), 1,048,576-token context per NVIDIA's own model card
    # (docs.api.nvidia.com/nim/reference/moonshotai-kimi-k3). No comparable free frontier model
    # exists elsewhere in this pool.
    input_context_limit: 1048576
    output_context_limit: 65536
    account_id: primary
    # 4 rpm, NOT deepseek-v4-pro's 0.5: NVIDIA's quotas are per model, and this route has never
    # returned a 429. Briefly inheriting deepseek's quota-derived rate on 2026-08-29 throttled the
    # routes actually carrying overflow traffic to one request per four minutes per Worker, which
    # showed up immediately as a drop in dispatched jobs.
    rpm: 4
    tpm: 40000
    # Raised back to 4 on 2026-08-30. The ceiling of 1 was set the day before on the
    # theory that NVIDIA rejects any overlapping request with a fast ~8.3s 429. Gateway
    # logs since the routing fix landed at 14Z say otherwise: nemotron-3-super ran 39
    # calls with 39 successes and no 429 at all. The rejections were deepseek-v4-pro's
    # account-level lockout, which that route still carries its own ceiling for -- the
    # same over-generalisation that scoped its rate to all nine routes (PR #1336).
    #
    # Concurrency, not rpm/tpm, was the binding constraint: with a ceiling of 1 the
    # dispatcher never came close to either limit, because nothing was allowed in
    # flight to consume them. 4 here matches this route's rpm. It is per-Worker-ledger,
    # so v1 and v2 each keep their own -- up to 8 in flight while both transports are
    # live, the same coexistence caveat as split_cap_multiplier.
    concurrency: 4
    free: true
    input_per_token: 0.0
    output_per_token: 0.0

  # Both DeepSeek routes below were disabled 2026-08-29 on a misdiagnosis: their 404s were blamed
  # on a per-key NVIDIA "Public API Endpoints" entitlement gap. The real cause was this provider
  # block's `ai_gateway_chat_path` (see above) -- Cloudflare AI Gateway dropped the `/v1` from the
  # Custom Provider base URL, so every NVIDIA route, not just these two, was dispatching to
  # `https://integrate.api.nvidia.com/chat/completions` and getting NVIDIA's empty-body ELB 404.
  # With the path corrected, both models were re-verified through the gateway on 2026-08-29 and
  # returned HTTP 200 with real completions. No entitlement request was needed or filed.
  - route_id: nvidia_deepseek_v4_pro_0813_free
    model: deepseek/deepseek-v4-pro
    provider: nvidia
    upstream_model: deepseek-ai/deepseek-v4-pro-0813
    input_context_limit: 1000000
    output_context_limit: 384000
    account_id: primary
    # 0.5 rpm = 30/hr, applied ONLY to this route. NVIDIA's limits are per MODEL (see the provider
    # block), so this rate must not be generalised. Measured 2026-08-29: `deepseek-v4-pro` locks out
    # for 22+ minutes once ~30 successful calls for THIS model land inside a rolling hour (onsets at
    # 28 and 37), and a lockout beginning at 15:54 was still running 66 minutes later -- the penalty
    # appears to lengthen while we keep probing. Pacing to 30/hr costs no throughput here, since the
    # quota caps us either way. Sub-1 rpm is deliberate: `_scale_rate_limit` and `routeAvailable`'s
    # minute bucket both used to clamp a fractional rate UP to 1.
    rpm: 0.5
    tpm: 40000
    # NVIDIA rejects an overlapping request with a fast ~8.3s 429 rather than
    # queueing it. Successful calls on these models run 41s median / 77s p90 /
    # 399s max (measured 2026-08-29), so without a ceiling v1 (BATCH_CONCURRENCY=2)
    # and v2 (MAX_JOBS_PER_ROUTE_PER_BUNDLE=4) stack up to 6 in flight on one model
    # and most get rejected. 1 here is per-Worker-ledger, so v1 and v2 each keep
    # one -- up to 2 in flight while both transports are live, the same
    # coexistence caveat as split_cap_multiplier.
    concurrency: 1
    free: true
    input_per_token: 0.0
    output_per_token: 0.0

