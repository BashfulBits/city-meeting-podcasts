    upstream_model: gemini-3.5-flash-lite
    input_context_limit: 1048576
    output_context_limit: 65536
    # Gemini 3.5 Flash Lite vs chars/4: p50 1.70 / p95 2.15 over 106 paired jobs (2026-09-23).
    input_token_ratio: 2.15
    account_id: project_primary
    rpm: 15
    rpd: 500
    tpm: 250000
    hard_input_ceiling: 218875
    free: true
    observed_on: "2026-09-12"
    observed_burst: 10
    observed_input_ceiling: 218875

