# Centralized Provider & Model Rate Limits Configuration
# Replaces config/mistral_model_limits.yml.
# Used by scripts/compile_llm_limits.py to generate workers/llm-dispatch-v2/src/dispatch_limits.json
# and citypods/compute/llm_routes.json

source: Centralized provider limits registry
observed_on: 2026-08-29

# Global token estimate buffer multiplier applied to token budgets (TPM, monthly_tpm) during
# compilation to safeguard against token estimation drift and prevent 429 rate limit spikes.
token_estimate_buffer: 0.90

# Split-cap multiplier from the v1/v2 coexistence phase (review/44): scales RPM, RPD, TPM and
# monthly_tpm across all routes. The v1 Worker is retired, so v2 is the only dispatcher and this
# stays at 1.0 (full capacity).
split_cap_multiplier: 1.0

# Context ceilings are required on every physical route below. They are not provider defaults:
# model families differ, and a gateway/account can expose a lower ceiling than the native model.

# Structured-output METHODS (review/48 R10). Producers never choose how to ask for JSON: a
# durable v2 job carries only its response schema, and the v2 Worker shapes the request for the
# route it actually dispatches to (a pooled job can land on any route in the pool, so a format
# chosen at enqueue time for the pool's first model was wrong for the rest). Python's direct path
# applies the same shaping. The set is closed -- the compiler rejects any other name -- and every
# method is exercised by the shared fixture tests/fixtures/structured_output_shaping.json, which
# both the Python and the Worker suites assert.
#
# Resolution per route (compile_llm_limits.py): the route's own `structured_output_method` (with
# `structured_output_verified_on`, the date a live request proved it) -> a method verified for the
# same model on another route -> the provider's `structured_output_method` -> `prompt_only`, the
# one shape every chat endpoint accepts. Provider methods below are today's inherited
# configuration, not verifications; the provider-catalog canary (review/48 Slice 1) verifies them.
structured_output_methods:
  json_schema:
    response_format: json_schema
    include_schema_in_prompt: false
    strip_schema_keys: []
  json_schema_relaxed:
    # Google accepts the nested Pydantic schema, but rejects JSON Schema size/range keywords.
    response_format: json_schema
    include_schema_in_prompt: false
    strip_schema_keys:
      - minLength
      - maxLength
      - minimum
      - maximum
      - minItems
      - maxItems
  json_object:
    # JSON-object mode guarantees JSON syntax, not the schema, so the schema goes in the prompt.
    response_format: json_object
    include_schema_in_prompt: true
    strip_schema_keys: []
  prompt_only:
    # No response_format at all. NVIDIA's deepseek-v4.1-flash returns EMPTY content to both
    # json_schema and json_object (verified 2026-09-24) and valid JSON only without one.
    response_format: none
    include_schema_in_prompt: true
    strip_schema_keys: []

# Declared model aliases: a retired model ID that stays callable and resolves to a newer model
# that is legitimately as good or better, so jobs and lanes still naming it are served instead of
# failing as `route_retired` once its last route is gone. (A route's own `model` selector is
# already an alias of its `model_key`, but only for as long as that route exists.) Each entry needs
# `to` (a model with at least one route), `reason` (why the target is as good or better, with the
# evidence) and `decided_on`. The source must not still have routes. Example:
#
#   model_aliases:
#     old-vendor/model-1:
#       to: new-vendor/model-2
#       reason: "AA index 31.0 vs 29.4; same context window; verified JSON on all lanes"
#       decided_on: "2026-10-31"
model_aliases:
  openrouter/nvidia/nemotron-3-super-120b-a12b:free:
    to: openrouter/nvidia/nemotron-3.5-super-vl:free
    reason: "Upgraded to Nemotron 3.5 Super VL; legacy selector kept for compatibility"
    decided_on: "2026-10-17"
  nvidia/nemotron-3-super-120b-a12b:
    to: openrouter/nvidia/nemotron-3.5-super-vl:free
    reason: "Upgraded to Nemotron 3.5 Super VL; legacy selector kept for compatibility"
    decided_on: "2026-10-17"
  nvidia/nemotron-3.5-super-vl:free:
    to: openrouter/nvidia/nemotron-3.5-super-vl:free
    reason: "Direct NVIDIA model alias mapping to canonical 3.5 Super VL pool"
    decided_on: "2026-11-04"
  nvidia/nemotron-3.5-super-vl:
    to: openrouter/nvidia/nemotron-3.5-super-vl:free
    reason: "Direct NVIDIA model alias mapping to canonical 3.5 Super VL pool"
    decided_on: "2026-11-04"
  openrouter/nvidia/nemotron-3.5-super-vl:
    to: openrouter/nvidia/nemotron-3.5-super-vl:free
    reason: "OpenRouter model alias without :free tag mapping to canonical pool"
    decided_on: "2026-11-04"
  nvidia/deepseek-v4.1-flash:
    to: deepseek/deepseek-v4.1-flash
    reason: "Same model: NVIDIA's V4.1 leg reached end of life (HTTP 410) and was removed; the
      selector stays so stored judge identities and old jobs resolve to the BeatAPI V4.1 pool"
    decided_on: "2026-11-19"

# Optional cross-model overflow routing. A key names a model whose callers may also be satisfied
# by any of its listed target models once its own routes are exhausted/unavailable -- extra daily
# capacity for a job pinned to one model (`allowed_models=(source,)`), without editing the job or
# caller at all. The compiler resolves both sides through `model_aliases` the same way a route's
# own `model` selector does, and fails the compile if either side is unknown. Both the Python
# scheduler (`select_route`) and the `llm-dispatch-v2` Worker (`routes.js`) expand a
# request's allowed models with this map, so it takes effect for every transport uniformly.
model_routing:
  gemini/gemini-3.7-flash:
    - gemini/gemini-3.6-flash
    - gemini/gemini-3.8-flash
    - gemini/gemini-3.5-flash


# `api_base`/`chat_path` are the OpenAI-shaped upstream every account of that provider is called
# through -- required for every provider.
providers:
  # Airforce custom provider: provides free OpenAI-compatible endpoints.
  # At 1 RPM account-wide, more than one in-flight request cannot increase sustainable throughput
  # and can race the upstream limiter. Live 429 error responses report 1 RPM (plan_rpm: 1),
  # so rpm: 1 and concurrency: 1 are used here.
  airforce:
    structured_output_method: json_schema
    api_base: https://api.airforce/v1
    ai_gateway_slug: custom-airforce
    ai_gateway_chat_path: /chat/completions
    chat_path: /v1/chat/completions
    reset_timezone: UTC
    rpm: 1
    concurrency: 1
    ai_gateway_max_attempts: 1
    accounts:
      - id: primary
        api_key_env: AIRFORCE_API_KEY
  gemini:
    api_base: https://generativelanguage.googleapis.com/v1beta/openai
    ai_gateway_slug: google-ai-studio
    ai_gateway_chat_path: /v1beta/openai/chat/completions
    chat_path: /chat/completions
    reset_timezone: America/Los_Angeles
    structured_output_method: json_schema_relaxed
    accounts:
      - id: project_primary
        api_key_env: GEMINI_API_KEY
      - id: project_secondary
        api_key_env: GEMINI_API_KEY_SECONDARY
  deepseek:
    # LiteLLM's DeepSeek adapter posts below this OpenAI-compatible v1 base; the Worker appends
    # chat_path itself, so its path is intentionally relative to the same base.
    api_base: https://api.deepseek.com/v1
    ai_gateway_slug: deepseek
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    structured_output_method: json_object
    accounts:
      - id: primary
        api_key_env: DEEPSEEK_API_KEY
  beatapi:
    # BeatAPI (https://beatapi.io) resells many models for credits; only the `-free` ids cost
    # nothing. ALL of them share ONE account-wide free limit of 1 successful request per minute
    # ("before your first top-up, up to 10/min after", docs.beatapi.io/decisions), so the limit sits
    # on the provider, like airforce. Measured live 2026-10-07 (429 `rate_limit_exceeded`,
    # `Retry-After: 60`): a success on any one model blocks every other model for 60 s, across
    # families (DeepSeek <-> GPT) and across endpoints (`jev-1.13-free` via /v1/systemone <->
    # chat completions, both directions); a 429 does not consume the window; the same model again
    # is blocked too. Single-flight (measured 2026-10-08, three runs): while any BeatAPI call is
    # running, a call to another model gets 429, at 62-125 s into a long call as much as at 5 s.
    # Treat the account as one lane: one call at a time, then wait 60 s after a success before the
    # next. Steady state accepted a call every ~61 s. Right after a call longer than 60 s the next
    # call once succeeded at +9 s, but a 68 s call blocked callers at +17 s and +22 s, so do not
    # rely on an early start. Input is not the constraint: all five chat models accepted 234,437
    # tokens (no rejection; a lower bound, so no hard_input_ceiling). Output speed was 140-235
    # tokens/s, and a 64k-token request 524'd at 125 s while an 18k one finished at 128 s.
    # Do not top up: that moves the account off the deliberate free tier.
    # `jev-1.13-free` (the review/49 anchor judge) is on the same key and the same window, but is
    # called via POST /v1/systemone, not chat completions, so it has no route here; its transport
    # is specified in the P1 breakout, and its calls must be budgeted against these routes.
    # Streamed 2026-11-02: BeatAPI's Cloudflare edge ends a non-streaming call at ~125 s with a 524
    # (3/3 long calls failed), while streams kept data flowing (gaps <= 5 s) for 7+ minutes and one
    # 415 s reply completed. To go back to plain request/response, delete this line (or set it to
    # false) and run scripts/compile_llm_limits.py.
    # DISABLED 2026-11-02: assembling a 400 s stream used 2050 ms of Worker CPU and the cron
    # invocation was killed (exceededCpu) with its other jobs; the Worker budget is ~10 ms.
    stream_response: false
    api_base: https://api.beatapi.io/v1
    chat_path: /chat/completions
    # Registered AI Gateway custom provider (base URL https://api.beatapi.io/v1). The Worker calls
    # every provider through the gateway; with no slug it used `beatapi`, which the gateway
    # rejects as 400 "Invalid provider" (code 2008). Verified 2026-10-08: /models and a chat
    # completion both return 200 through this slug.
    ai_gateway_slug: custom-beatapi
    ai_gateway_chat_path: /chat/completions
    reset_timezone: UTC
    rpm: 1
    concurrency: 1
    structured_output_method: prompt_only
    accounts:
      - id: primary
        api_key_env: BEATAPI_API_KEY
  beatapi_secondary:
    # Second BeatAPI free account (2026-10-16, key BEATAPI_API_KEY_SECONDARY). The free limit is
    # per account (1 successful call/min, single-flight), and the Worker scopes provider-level
    # rpm/concurrency by provider NAME, so the second account is a separate provider block with the
    # same base URL, gateway slug and limits as `beatapi` above (read its comments for the
    # measurements). It carries the five chat routes only: JEV (`beatapi_jev_1_13_free`) stays on
    # the primary account because its route id is pinned by the judge and remedy code. Do not top up.
    # Streamed 2026-11-02: BeatAPI's Cloudflare edge ends a non-streaming call at ~125 s with a 524
    # (3/3 long calls failed), while streams kept data flowing (gaps <= 5 s) for 7+ minutes and one
    # 415 s reply completed. To go back to plain request/response, delete this line (or set it to
    # false) and run scripts/compile_llm_limits.py.
    # DISABLED 2026-11-02: assembling a 400 s stream used 2050 ms of Worker CPU and the cron
    # invocation was killed (exceededCpu) with its other jobs; the Worker budget is ~10 ms.
    stream_response: false
    api_base: https://api.beatapi.io/v1
    chat_path: /chat/completions
    ai_gateway_slug: custom-beatapi
    ai_gateway_chat_path: /chat/completions
    reset_timezone: UTC
    rpm: 1
    concurrency: 1
    structured_output_method: prompt_only
    accounts:
      - id: primary
        api_key_env: BEATAPI_API_KEY_SECONDARY
  siliconflow:
    structured_output_method: json_schema
    # The GLOBAL platform (`.com`), which is a different service from `siliconflow.cn` with its own
    # accounts -- a `.com` key is rejected by `.cn` with 401 "Api key is invalid". Only `.cn` offers
    # Free SiliconFlow models require Chinese real-name ID verification. Paid SiliconFlow routes
    # are intentionally absent from this catalog; retain the provider block for future re-probing.
    api_base: https://api.siliconflow.com/v1
    ai_gateway_slug: custom-siliconflow
    # The registered Base URL ends in `/v1`, and the gateway now honors that path. Keep the
    # caller path root-relative so it does not double the version segment.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: SILICONFLOW_API_KEY
  groq:
    api_base: https://api.groq.com/openai/v1
    ai_gateway_slug: groq
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    structured_output_method: json_object
    accounts:
      - id: primary
        api_key_env: GROQ_API_KEY
  sambanova:
    structured_output_method: json_schema
    api_base: https://api.sambanova.ai/v1
    ai_gateway_slug: custom-sambanova
    # The registered Base URL ends in `/v1`, and the gateway now honors that path. A root-relative
    # caller path therefore reaches `/v1/chat/completions` without a duplicated version segment.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    # SambaNova's documented Free-tier ceiling is 20 requests/minute. Keep this provider-wide
    # because both configured models share the same API key, and let the split-cap compiler divide
    # it between the v1/v2 dispatchers while they coexist. A single upstream 429 should not also
    # incur AI Gateway's five-attempt retry series: the dispatch Workers already apply a durable
    # route cooldown after the response arrives.
    rpm: 20
    ai_gateway_max_attempts: 1
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: SAMBANOVA_API_KEY
  zai:
    structured_output_method: json_schema
    api_base: https://api.z.ai/api/paas/v4
    ai_gateway_slug: custom-zai
    # Cloudflare AI Gateway Base URL for custom-zai is configured to `https://api.z.ai/api/paas`,
    # so the caller path must supply `/v4/chat/completions` (verified 2026-09-15: HTTP 200).
    ai_gateway_chat_path: /v4/chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: ZAI_API_KEY
  openrouter:
    structured_output_method: json_schema
    api_base: https://openrouter.ai/api/v1
    ai_gateway_slug: openrouter
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    # OpenRouter's free-model allowance is shared across the account: 20 RPM and 1,000 RPD
    # after the qualifying credit purchase (official docs checked 2026-11-19). Put the daily
    # allowance on the provider so all free-model routes share one local ledger.
    rpd: 1000
    discovery:
      endpoint: https://openrouter.ai/api/v1/models
    accounts:
      - id: primary
        api_key_env: OPENROUTER_API_KEY
  kilo:
    structured_output_method: json_schema
    api_base: https://api.kilo.ai/api/gateway
    ai_gateway_slug: custom-kilo
    # The registered Base URL is `https://api.kilo.ai/api/gateway/v1`, not api_base. Kilo serves
    # that path, so it remains correct under both the former forced-`v1` rewrite and the current
    # path-preserving join; no shim is needed.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: KILO_API_KEY

  # NVIDIA build.nvidia.com (API Catalog / NIM hosted endpoints). Unlike every other provider
  # above, NVIDIA publishes no rate-limit table at all -- the community-reported baseline is
  # ~40 RPM, account-wide, "dependent on model, use-case, and current overall traffic" per
  # NVIDIA's own developer-forum staff replies, and developers report 429s even under light load.
  # Treat this whole provider as best-effort capacity, never a committed SLA:
  #   - `rpm: 35` is a self-imposed provider-wide safety net, set above the actual sum of every
  #     route's own `rpm` below (8 routes at 4 + 1 at 0.5 = 32.5) so per-route pacing -- not this
  #     account-wide clock -- stays the binding constraint (see the comment on `rpm` itself below
  #     for the full reasoning; this is the one number this account actually enforces via the
  #     shared `ProviderLedger`, see `citypods/compute/llm_budget.py`), mirroring how the Mistral
  #     provider block already paces every Mistral model off one shared account limit.
  #   - No `tpm`, provider-wide or per route (removed 2026-11-19): NVIDIA publishes none and a
  #     1,034,675-token MiniMax request was admitted (see the provider block's comment below).
  #   - No `rpd` is set anywhere below: NVIDIA publishes no daily cap, so encoding one would be
  #     inventing a number we have no basis for.
  # No native LiteLLM adapter is assumed for this gateway; routes compile through the same
  # OpenAI-compatible direct-adapter path as Kilo/OpenCode/SiliconFlow (see `_direct_model` in
  # `scripts/compile_llm_limits.py`).
  # Removed 2026-11-02: z-ai/glm-5.3-flash. A one-token prompt returned 504 after 302 s (and 16 of
  # 16 production calls hit the Worker's 720 s timeout); google/gemma-4-31b-it answered "ok?" in
  # 217 s and deepseek-ai/deepseek-v4.1-flash did not answer in 45 s, while the nemotron and
  # diffusiongemma models answer in about 1 s. The GLM logical model is still served by others.
  nvidia:
    structured_output_method: json_schema
    api_base: https://integrate.api.nvidia.com/v1
    ai_gateway_slug: custom-nvidia
    # The registered Base URL ends in `/v1`, and the gateway now honors that path. Keep the
    # caller path root-relative so it reaches NVIDIA's `/v1/chat/completions` exactly once.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    # Provider-wide safety net only -- the REAL limit is per route. On 2026-08-29 8 of the then 9
    # routes were `rpm: 4` and the since-retired `deepseek-v4-pro` route was `rpm: 0.5`, a real
    # per-route sum of 32.5, not a flat "9 routes at the same rate". NVIDIA's quota is per MODEL,
    # not per account: on the same day, `deepseek-v4-pro`
    # returned 429 nine times out of nine while `nemotron-3-super` returned 200 three times, twice
    # inside the same minute (16:58:14 ok / 16:58:50 429). A tight provider-wide cap would
    # therefore be the wrong instrument -- it would make nine models share one model's budget.
    # This field only has to clear the real 32.5 per-route sum with margin while staying under the
    # ~40 RPM community-reported account baseline, leaving per-route pacing as the binding
    # constraint -- which a value below the real sum (the previous `rpm: 6`, itself inconsistent
    # with the stale "0.5 rpm each" arithmetic once written here) defeats by becoming the
    # accidental binding constraint instead.
    rpm: 35
    # No provider `tpm` (removed 2026-11-19). NVIDIA publishes no token-rate limit and enforces
    # none we can find: one MiniMax M3.1 Flash request of 1,034,675 provider tokens was admitted
    # and answered (direct probe 2026-11-19), and its only refusal was the model's context window.
    # A self-imposed 100k figure here became the Worker's `reservation_over_provider_tokens` gate
    # (tpm x 5 windows) and held every locator overflow packet above ~450k tokens forever.
    # Requests are paced by `rpm` and each route's `rpm`/`rpd`/`concurrency` only.
    # Raised 2 -> 3 on 2026-09-23 while Gemma was paused so Nemotron 3 Ultra could keep a slot
    # beside slow overflow work (kimi-k3 ~590s, deepseek-v4.1-flash), each capped at concurrency 1.
    # Raised 3 -> 4 on 2026-10-17 when Gemma 4 31B got a second slot (800 RPD, route concurrency 2):
    # Gemma takes at most two of the four, leaving two for Ultra, V4.1 and the overflow routes
    # (each capped at 1). Measured 2026-10-17: three overlapping requests (Gemma 4 31B x2 plus
    # Nemotron 3 Super) all returned 200 in four rounds, and three overlapping Gemma requests did
    # too, so the 2026-08-29 "overlap is rejected with a fast 429" finding no longer holds. NOT
    # verified: a fourth simultaneous call (no other served model was available to probe), and the
    # benefit of the second Gemma slot is under 2x -- two concurrent Gemma calls each ran at
    # 5-6 tokens/s against 19 alone. Watch `upstream_capacity` 429s on NVIDIA routes.
    concurrency: 4
    accounts:
      - id: primary
        api_key_env: NVIDIA_API_KEY
  orcarouter:
    api_base: https://api.orcarouter.ai/v1
    ai_gateway_slug: custom-orcarouter
    # The registered Base URL ends in `/v1`, and the gateway now honors that path. Keep the
    # caller path root-relative so it reaches `/v1/chat/completions` without a duplicated segment.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    # OrcaRouter publishes free-tier limits live at GET api.orcarouter.ai/api/free-package/public
    # (`free_tier.tiers`, per model): lifetime spend $0 -> 10 rpm / 50 rpd plus a small unpublished
    # per-request prompt cap; >= $20 -> 20 rpm / 800 rpd. This account is on the $20 tier (topped
    # up; confirmed by the maintainer 2026-09-25). No concurrency or in-flight limit is published
    # anywhere (docs, pricing, model pages, the endpoint), and free traffic carries no
    # X-RateLimit-* headers. rpm 10 and concurrency 2 are deliberate choices below the tier, not
    # provider limits.
    #
    # THE 800/day IS ONE POOL FOR ALL OF ORCAROUTER'S FREE MODELS, NOT 800 PER MODEL (the public
    # endpoint lists one account-level `free_tier.tiers`; the maintainer confirmed it 2026-11-09).
    # Evidence: that day at 15:53 UTC DeepSeek, HY3 and GLM each answered a one-token request with
    # the same 429 `free_rate_limited` and `retry-after: 29174` (the 00:00 UTC reset) while the
    # per-route ledger showed HY3 at 0 and GLM at 93 of 800 used. A provider-level `rpd` is that
    # shared pool: the Worker admits a request on any of the provider's routes only while the sum
    # of today's per-route request counts is below it. Route `rpd` values stay as per-route ceilings
    # (no route may exceed the pool); lanes can borrow the whole pool from each other.
    rpm: 10
    rpd: 800
    concurrency: 2
    structured_output_method: json_object
    accounts:
      - id: primary
        api_key_env: ORCAROUTER_API_KEY
routes:
  # ==========================================
  # GEMINI & GEMMA ROUTES (Google AI Studio)
  # ==========================================
  # High-Capacity Workhorses (500 RPD / 15 RPM each)
  - route_id: gemini_3_5_flash_lite_primary
    model: gemini/gemini-3.5-flash-lite
    provider: gemini
    upstream_model: gemini-3.5-flash-lite
    # review/58 B2 (2026-11-11): initial value for the Flash Lite family; 2,122 timeouts in 7 days
    # held 1.53M slot-seconds at 720 s. No per-route latency table yet: tune from bundle_completed.
    response_timeout_seconds: 300
    input_context_limit: 1048576
    output_context_limit: 65536
    # Gemini 3.5 Flash Lite vs chars/4: p50 1.70 / p95 2.15 over 106 paired jobs (2026-09-23).
    input_token_ratio: 2.15
    account_id: project_primary
    rpm: 15
    rpd: 500
    tpm: 250000
    hard_input_ceiling: 218875
    free: true
    observed_on: "2026-09-12"
    observed_burst: 10
    observed_input_ceiling: 218875

  - route_id: gemini_3_5_flash_lite_secondary
    model: gemini/gemini-3.5-flash-lite
    provider: gemini
    upstream_model: gemini-3.5-flash-lite
    # review/58 B2 (2026-11-11): initial value for the Flash Lite family; 2,122 timeouts in 7 days
    # held 1.53M slot-seconds at 720 s. No per-route latency table yet: tune from bundle_completed.
    response_timeout_seconds: 300
    input_context_limit: 1048576
    output_context_limit: 65536
    # Gemini 3.5 Flash Lite vs chars/4: p50 1.70 / p95 2.15 over 106 paired jobs (2026-09-23).
    input_token_ratio: 2.15
    account_id: project_secondary
    rpm: 15
    rpd: 500
    tpm: 250000
    hard_input_ceiling: 218875
    free: true
    observed_on: "2026-09-12"
    observed_burst: 10
    observed_input_ceiling: 218875

  - route_id: gemini_3_1_flash_lite_primary
    model: gemini/gemini-3.1-flash-lite
    provider: gemini
    upstream_model: gemini-3.1-flash-lite
    # review/58 B2 (2026-11-11): initial value for the Flash Lite family; 2,122 timeouts in 7 days
    # held 1.53M slot-seconds at 720 s. No per-route latency table yet: tune from bundle_completed.
    response_timeout_seconds: 300
    input_context_limit: 1048576
