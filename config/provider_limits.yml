# Centralized Provider & Model Rate Limits Configuration
# Replaces config/mistral_model_limits.yml.
# Used by scripts/compile_llm_limits.py to generate workers/llm-dispatch-proxy/src/dispatch_limits.json

source: Centralized provider limits registry
observed_on: 2026-08-29

# Global token estimate buffer multiplier applied to token budgets (TPM, monthly_tpm) during
# compilation to safeguard against token estimation drift and prevent 429 rate limit spikes.
token_estimate_buffer: 0.90

# Split-cap multiplier applied during Phase 2/3 coexistence (review/44) so that aggregate usage
# across both v1 and v2 dispatchers does not exceed 100% of underlying provider rate limits.
# Halves RPM, RPD, TPM, and monthly_tpm across all shared routes. Set to 1.0 (or omitted) to
# restore full 1x capacity once legacy v1 backlog is drained (Phase 3).
split_cap_multiplier: 1.0

# Context ceilings are required on every physical route below. They are not provider defaults:
# model families differ, and a gateway/account can expose a lower ceiling than the native model.

# Structured-output METHODS (review/48 R10). Producers never choose how to ask for JSON: a
# durable v2 job carries only its response schema, and the v2 Worker shapes the request for the
# route it actually dispatches to (a pooled job can land on any route in the pool, so a format
# chosen at enqueue time for the pool's first model was wrong for the rest). Python's direct path
# applies the same shaping. The set is closed -- the compiler rejects any other name -- and every
# method is exercised by the shared fixture tests/fixtures/structured_output_shaping.json, which
# both the Python and the Worker suites assert.
#
# Resolution per route (compile_llm_limits.py): the route's own `structured_output_method` (with
# `structured_output_verified_on`, the date a live request proved it) -> a method verified for the
# same model on another route -> the provider's `structured_output_method` -> `prompt_only`, the
# one shape every chat endpoint accepts. Provider methods below are today's inherited
# configuration, not verifications; the provider-catalog canary (review/48 Slice 1) verifies them.
structured_output_methods:
  json_schema:
    response_format: json_schema
    include_schema_in_prompt: false
    strip_schema_keys: []
  json_schema_relaxed:
    # Google accepts the nested Pydantic schema, but rejects JSON Schema size/range keywords.
    response_format: json_schema
    include_schema_in_prompt: false
    strip_schema_keys:
      - minLength
      - maxLength
      - minimum
      - maximum
      - minItems
      - maxItems
  json_object:
    # JSON-object mode guarantees JSON syntax, not the schema, so the schema goes in the prompt.
    response_format: json_object
    include_schema_in_prompt: true
    strip_schema_keys: []
  prompt_only:
    # No response_format at all. NVIDIA's deepseek-v4.1-flash returns EMPTY content to both
    # json_schema and json_object (verified 2026-09-24) and valid JSON only without one.
    response_format: none
    include_schema_in_prompt: true
    strip_schema_keys: []

# Optional cross-model overflow routing. A key names a model whose callers may also be satisfied
# by any of its listed target models once its own routes are exhausted/unavailable -- extra daily
# capacity for a job pinned to one model (`allowed_models=(source,)`), without editing the job or
# caller at all. The compiler resolves both sides through `model_aliases` the same way a route's
# own `model` selector does, and fails the compile if either side is unknown. Both the Python
# scheduler (`select_route`) and the `llm-dispatch-proxy` Worker (`normalizeChatRequest`) expand a
# request's allowed models with this map, so it takes effect for every transport uniformly.
#
# Mistral Medium jobs route strictly to native Mistral routes.
model_routing:
  gemini/gemini-3.7-flash:
    - gemini/gemini-3.6-flash
    - gemini/gemini-3.8-flash
    - gemini/gemini-3.5-flash


# `api_base`/`chat_path` are the OpenAI-shaped upstream every account of that provider is called
# through -- required for every provider, not just Mistral.
providers:
  mistral:
    structured_output_method: json_schema
    api_base: https://api.mistral.ai
    ai_gateway_slug: mistral
    ai_gateway_chat_path: /v1/chat/completions
    chat_path: /v1/chat/completions
    # Mistral's account-wide limit is 60 RPM (one submission per second), shared by every model.
    rpm: 60
    # Mistral meters tokens account-wide per month. The 2026-08-18 hotfix zeroed this to stop
    # consumption; that stopgap is reverted here (2026-09-09) because it never actually gated
    # anything -- `monthly_tpm` has no consumer in either the Worker or the Python scheduler, and
    # compile_llm_limits.py drops it from the compiled provider block entirely, so it only ever
    # scaled itself. What genuinely stops consumption is the billing-signal path: an "insufficient
    # budget"/"out of credits" response now classifies as `payment_required`
    # (workers/llm-dispatch-v2/src/classify.js, rule `insufficient-budget`), which drives
    # pacing.js's paymentRequiredBackoffUntil day -> week -> month cooldown ladder and pins the
    # route until the allowance actually rolls over. Restored to Mistral's published free-tier
    # monthly allowance, the pre-hotfix value.
    monthly_tpm: 1000000000
    reset_day: 1
    accounts:
      - id: primary
        api_key_env: MISTRAL_API_KEY
      - id: secondary
        api_key_env: MISTRAL_API_KEY_SECONDARY
  # Airforce custom provider: provides free OpenAI-compatible endpoints.
  # At 1 RPM account-wide, more than one in-flight request cannot increase sustainable throughput
  # and can race the upstream limiter. Live 429 error responses report 1 RPM (plan_rpm: 1),
  # so rpm: 1 and concurrency: 1 are used here.
  airforce:
    structured_output_method: json_schema
    api_base: https://api.airforce/v1
    ai_gateway_slug: custom-airforce
    ai_gateway_chat_path: /chat/completions
    chat_path: /v1/chat/completions
    reset_timezone: UTC
    rpm: 1
    concurrency: 1
    ai_gateway_max_attempts: 1
    accounts:
      - id: primary
        api_key_env: AIRFORCE_API_KEY
  gemini:
    api_base: https://generativelanguage.googleapis.com/v1beta/openai
    ai_gateway_slug: google-ai-studio
    ai_gateway_chat_path: /v1beta/openai/chat/completions
    chat_path: /chat/completions
    reset_timezone: America/Los_Angeles
    structured_output_method: json_schema_relaxed
    accounts:
      - id: project_primary
        api_key_env: GEMINI_API_KEY
      - id: project_secondary
        api_key_env: GEMINI_API_KEY_SECONDARY
  deepseek:
    # LiteLLM's DeepSeek adapter posts below this OpenAI-compatible v1 base; the Worker appends
    # chat_path itself, so its path is intentionally relative to the same base.
    api_base: https://api.deepseek.com/v1
    ai_gateway_slug: deepseek
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    structured_output_method: json_object
    accounts:
      - id: primary
        api_key_env: DEEPSEEK_API_KEY
  siliconflow:
    structured_output_method: json_schema
    # The GLOBAL platform (`.com`), which is a different service from `siliconflow.cn` with its own
    # accounts -- a `.com` key is rejected by `.cn` with 401 "Api key is invalid". Only `.cn` offers
    # Free SiliconFlow models require Chinese real-name ID verification. Paid SiliconFlow routes
    # are intentionally absent from this catalog; retain the provider block for future re-probing.
    api_base: https://api.siliconflow.com/v1
    ai_gateway_slug: custom-siliconflow
    # The registered Base URL ends in `/v1`, and the gateway now honors that path. Keep the
    # caller path root-relative so it does not double the version segment.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: SILICONFLOW_API_KEY
  groq:
    api_base: https://api.groq.com/openai/v1
    ai_gateway_slug: groq
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    structured_output_method: json_object
    accounts:
      - id: primary
        api_key_env: GROQ_API_KEY
  sambanova:
    structured_output_method: json_schema
    api_base: https://api.sambanova.ai/v1
    ai_gateway_slug: custom-sambanova
    # The registered Base URL ends in `/v1`, and the gateway now honors that path. A root-relative
    # caller path therefore reaches `/v1/chat/completions` without a duplicated version segment.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    # SambaNova's documented Free-tier ceiling is 20 requests/minute. Keep this provider-wide
    # because both configured models share the same API key, and let the split-cap compiler divide
    # it between the v1/v2 dispatchers while they coexist. A single upstream 429 should not also
    # incur AI Gateway's five-attempt retry series: the dispatch Workers already apply a durable
    # route cooldown after the response arrives.
    rpm: 20
    ai_gateway_max_attempts: 1
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: SAMBANOVA_API_KEY
  zai:
    structured_output_method: json_schema
    api_base: https://api.z.ai/api/paas/v4
    ai_gateway_slug: custom-zai
    # Cloudflare AI Gateway Base URL for custom-zai is configured to `https://api.z.ai/api/paas`,
    # so the caller path must supply `/v4/chat/completions` (verified 2026-09-15: HTTP 200).
    ai_gateway_chat_path: /v4/chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: ZAI_API_KEY
  openrouter:
    structured_output_method: json_schema
    api_base: https://openrouter.ai/api/v1
    ai_gateway_slug: openrouter
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    discovery:
      endpoint: https://openrouter.ai/api/v1/models
    accounts:
      - id: primary
        api_key_env: OPENROUTER_API_KEY
  kilo:
    structured_output_method: json_schema
    api_base: https://api.kilo.ai/api/gateway
    ai_gateway_slug: custom-kilo
    # The registered Base URL is `https://api.kilo.ai/api/gateway/v1`, not api_base. Kilo serves
    # that path, so it remains correct under both the former forced-`v1` rewrite and the current
    # path-preserving join; no shim is needed.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: KILO_API_KEY

  # NVIDIA build.nvidia.com (API Catalog / NIM hosted endpoints). Unlike every other provider
  # above, NVIDIA publishes no rate-limit table at all -- the community-reported baseline is
  # ~40 RPM, account-wide, "dependent on model, use-case, and current overall traffic" per
  # NVIDIA's own developer-forum staff replies, and developers report 429s even under light load.
  # Treat this whole provider as best-effort capacity, never a committed SLA:
  #   - `rpm: 35` is a self-imposed provider-wide safety net, set above the actual sum of every
  #     route's own `rpm` below (8 routes at 4 + 1 at 0.5 = 32.5) so per-route pacing -- not this
  #     account-wide clock -- stays the binding constraint (see the comment on `rpm` itself below
  #     for the full reasoning; this is the one number this account actually enforces via the
  #     shared `ProviderLedger`, see `citypods/compute/llm_budget.py`), mirroring how the Mistral
  #     provider block already paces every Mistral model off one shared account limit.
  #   - Every route below also declares `tpm: 100000` as a second, independent self-imposed cap.
  #     NOTE: this is an *approximation*, not a true provider-level TPM ledger -- the schema/code
  #     (`LLMBudget`/`ProviderLedger`) only actually enforces a shared limit for `rpm`
  #     (`route.provider_rpm`); there is no equivalent provider-wide token-rate ledger today, so
  #     each route's 40k TPM is checked independently rather than summed across the account. If
  #     several NVIDIA routes are dispatched concurrently at full token throughput, the account's
  #     *aggregate* token rate could exceed 40k TPM even though no single route did. Adding a real
  #     provider-level TPM ledger (parallel to `provider_rpm`) is a follow-up, not done here.
  #   - No `rpd` is set anywhere below: NVIDIA publishes no daily cap, so encoding one would be
  #     inventing a number we have no basis for.
  # No native LiteLLM adapter is assumed for this gateway; routes compile through the same
  # OpenAI-compatible direct-adapter path as Kilo/OpenCode/SiliconFlow (see `_direct_model` in
  # `scripts/compile_llm_limits.py`).
  nvidia:
    structured_output_method: json_schema
    api_base: https://integrate.api.nvidia.com/v1
    ai_gateway_slug: custom-nvidia
    # The registered Base URL ends in `/v1`, and the gateway now honors that path. Keep the
    # caller path root-relative so it reaches NVIDIA's `/v1/chat/completions` exactly once.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    # Provider-wide safety net only -- the REAL limit is per route. On 2026-08-29 8 of the then 9
    # routes were `rpm: 4` and the since-retired `deepseek-v4-pro` route was `rpm: 0.5`, a real
    # per-route sum of 32.5, not a flat "9 routes at the same rate". NVIDIA's quota is per MODEL,
    # not per account: on the same day, `deepseek-v4-pro`
    # returned 429 nine times out of nine while `nemotron-3-super` returned 200 three times, twice
    # inside the same minute (16:58:14 ok / 16:58:50 429). A tight provider-wide cap would
    # therefore be the wrong instrument -- it would make nine models share one model's budget.
    # This field only has to clear the real 32.5 per-route sum with margin while staying under the
    # ~40 RPM community-reported account baseline, leaving per-route pacing as the binding
    # constraint -- which a value below the real sum (the previous `rpm: 6`, itself inconsistent
    # with the stale "0.5 rpm each" arithmetic once written here) defeats by becoming the
    # accidental binding constraint instead.
    rpm: 35
    tpm: 100000
    # Raised 2 -> 3 on 2026-09-23 so Nemotron 3 Ultra -- the chapter-agenda lane's only route
    # with headroom beyond two 200-RPD pools -- always has a slot. The other NVIDIA routes that
    # carry slow overflow work (kimi-k3 ~590s, deepseek-v4.1-flash) are capped at concurrency 1
    # each, and the Gemma route (172s median) is paused, so at most two slots can be held by
    # non-Nemotron work. AI Gateway logs for 2026-09-21/22 put NVIDIA's average in-flight count
    # at 0.5-0.65, so 3 remains well inside what the account has absorbed.
    concurrency: 3
    accounts:
      - id: primary
        api_key_env: NVIDIA_API_KEY
  orcarouter:
    api_base: https://api.orcarouter.ai/v1
    ai_gateway_slug: custom-orcarouter
    # The registered Base URL ends in `/v1`, and the gateway now honors that path. Keep the
    # caller path root-relative so it reaches `/v1/chat/completions` without a duplicated segment.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    # OrcaRouter publishes free-tier limits live at GET api.orcarouter.ai/api/free-package/public
    # (`free_tier.tiers`, per model): lifetime spend $0 -> 10 rpm / 50 rpd plus a small unpublished
    # per-request prompt cap; >= $20 -> 20 rpm / 800 rpd. This account is on the $20 tier (topped
    # up; confirmed by the maintainer 2026-09-25). No concurrency or in-flight limit is published
    # anywhere (docs, pricing, model pages, the endpoint), and free traffic carries no
    # X-RateLimit-* headers. rpm 10 and concurrency 2 are deliberate choices below the tier, not
    # provider limits: at ~40 s (hy3), ~10 s (DeepSeek v4) and ~5 s (GLM 5.3) per call, three
    # models at 800/day use ~25% of two shared slots, so 800/day per model is reachable as is.
    rpm: 10
    concurrency: 2
    structured_output_method: json_object
    accounts:
      - id: primary
        api_key_env: ORCAROUTER_API_KEY
