# Centralized Provider & Model Rate Limits Configuration
# Replaces config/mistral_model_limits.yml.
# Used by scripts/compile_llm_limits.py to generate workers/llm-dispatch-proxy/src/dispatch_limits.json

source: Centralized provider limits registry
observed_on: 2026-08-29

# Global token estimate buffer multiplier applied to token budgets (TPM, monthly_tpm) during
# compilation to safeguard against token estimation drift and prevent 429 rate limit spikes.
token_estimate_buffer: 0.90

# Split-cap multiplier applied during Phase 2/3 coexistence (review/44) so that aggregate usage
# across both v1 and v2 dispatchers does not exceed 100% of underlying provider rate limits.
# Halves RPM, RPD, TPM, and monthly_tpm across all shared routes. Set to 1.0 (or omitted) to
# restore full 1x capacity once legacy v1 backlog is drained (Phase 3).
split_cap_multiplier: 1.0

# Context ceilings are required on every physical route below. They are not provider defaults:
# model families differ, and a gateway/account can expose a lower ceiling than the native model.

# Structured-output profiles are provider capabilities, not model-name conventions. A provider or
# individual route may select one; the compiler materializes the resolved behavior on every route
# consumed by Python and the dispatch Worker.
structured_output_profiles:
  standard_json_schema:
    response_format: json_schema
    direct_handler: instructor
    include_schema_in_prompt: false
    strip_schema_keys: []
  json_object:
    response_format: json_object
    direct_handler: native
    include_schema_in_prompt: true
    strip_schema_keys: []
  relaxed_json_schema:
    # Google accepts the nested Pydantic schema, but rejects JSON Schema size/range keywords.
    response_format: json_schema
    direct_handler: native
    include_schema_in_prompt: false
    strip_schema_keys:
      - minLength
      - maxLength
      - minimum
      - maximum
      - minItems
      - maxItems

# Optional cross-model overflow routing. A key names a model whose callers may also be satisfied
# by any of its listed target models once its own routes are exhausted/unavailable -- extra daily
# capacity for a job pinned to one model (`allowed_models=(source,)`), without editing the job or
# caller at all. The compiler resolves both sides through `model_aliases` the same way a route's
# own `model` selector does, and fails the compile if either side is unknown. Both the Python
# scheduler (`select_route`) and the `llm-dispatch-proxy` Worker (`normalizeChatRequest`) expand a
# request's allowed models with this map, so it takes effect for every transport uniformly.
#
# Mistral Medium jobs route strictly to native Mistral and Airforce Mistral routes.
model_routing: {}


# `api_base`/`chat_path` are the OpenAI-shaped upstream every account of that provider is called
# through -- required for every provider, not just Mistral.
providers:
  mistral:
    api_base: https://api.mistral.ai
    ai_gateway_slug: mistral
    ai_gateway_chat_path: /v1/chat/completions
    chat_path: /v1/chat/completions
    # Mistral's account-wide limit is 60 RPM (one submission per second), shared by every model.
    rpm: 60
    # HOTFIX (2026-08-18): Mistral switched to account-wide monthly token metering (effective
    # until the policy is re-evaluated after their next billing cycle reset on 2026-08-31).
    # Zeroed out as a stopgap to stop consumption until a real monthly allowance is sized -- see
    # AGENTS.md / review/11 for the follow-up to pick a real value.
    monthly_tpm: 0
    reset_day: 1
    accounts:
      - id: primary
        api_key_env: MISTRAL_API_KEY
      - id: secondary
        api_key_env: MISTRAL_API_KEY_SECONDARY
  # Airforce's custom provider exposes the same Mistral Medium family through its OpenAI-shaped
  # API. The account-wide 1,000 RPD allowance is the binding limit for this account; `rpm: 0.69`
  # paces the route to that daily ceiling (the split-cap compiler then divides it between the v1
  # and v2 dispatchers while both are live). No independent TPM ceiling was observed in the local
  # soak, so leave `tpm` unset rather than inventing a smaller cap. The provider's model metadata
  # reports `max_tokens: 4096`, which is an output budget, not the 256k input context window.
  airforce:
    api_base: https://api.airforce/v1
    ai_gateway_slug: custom-airforce
    # Registered at `https://api.airforce/v1`; AI Gateway's custom-provider rewrite therefore
    # requires the `/v1` prefix in the caller path, as verified by the live gateway smoke test.
    ai_gateway_chat_path: /v1/chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: AIRFORCE_API_KEY
  gemini:
    api_base: https://generativelanguage.googleapis.com/v1beta/openai
    ai_gateway_slug: google-ai-studio
    ai_gateway_chat_path: /v1beta/openai/chat/completions
    chat_path: /chat/completions
    reset_timezone: America/Los_Angeles
    structured_output_profile: relaxed_json_schema
    accounts:
      - id: project_primary
        api_key_env: GEMINI_API_KEY
      - id: project_secondary
        api_key_env: GEMINI_API_KEY_SECONDARY
  deepseek:
    # LiteLLM's DeepSeek adapter posts below this OpenAI-compatible v1 base; the Worker appends
    # chat_path itself, so its path is intentionally relative to the same base.
    api_base: https://api.deepseek.com/v1
    ai_gateway_slug: deepseek
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    structured_output_profile: json_object
    accounts:
      - id: primary
        api_key_env: DEEPSEEK_API_KEY
  siliconflow:
    # The GLOBAL platform (`.com`), which is a different service from `siliconflow.cn` with its own
    # accounts -- a `.com` key is rejected by `.cn` with 401 "Api key is invalid". Only `.cn` offers
    # free models, gated behind Chinese real-name ID verification, so nothing here is free: every
    # SiliconFlow route below is `free: false` and stops working at a zero account balance (402
    # code 30001 on every model, verified 2026-08-29). SiliconFlow is carried as the *cheapest paid*
    # leg of deepseek/deepseek-v4-flash ($0.049/M vs DeepSeek Direct's $0.14/M), not as capacity --
    # route selection tries every free leg first, so these are reached only by a job that sets
    # `allow_paid` once no free route has capacity.
    api_base: https://api.siliconflow.com/v1
    ai_gateway_slug: custom-siliconflow
    # Full path from the origin root (see the `nvidia` block). SiliconFlow serves the same
    # endpoint at both `/chat/completions` and `/v1/chat/completions`, which is the only reason
    # the old root-relative value worked; this states the intended URL explicitly.
    ai_gateway_chat_path: /v1/chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: SILICONFLOW_API_KEY
  groq:
    api_base: https://api.groq.com/openai/v1
    ai_gateway_slug: groq
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    structured_output_profile: json_object
    accounts:
      - id: primary
        api_key_env: GROQ_API_KEY
  sambanova:
    api_base: https://api.sambanova.ai/v1
    ai_gateway_slug: custom-sambanova
    # Full path from the origin root -- see the `nvidia` block below for why. Verified 2026-08-29:
    # `/chat/completions` through the gateway returns SambaNova's plain-text `404 page not found`,
    # `/v1/chat/completions` reaches the real API (a genuine 429 rate-limit JSON came back).
    ai_gateway_chat_path: /v1/chat/completions
    chat_path: /chat/completions
    # SambaNova's documented Free-tier ceiling is 20 requests/minute. Keep this provider-wide
    # because both configured models share the same API key, and let the split-cap compiler divide
    # it between the v1/v2 dispatchers while they coexist. A single upstream 429 should not also
    # incur AI Gateway's five-attempt retry series: the dispatch Workers already apply a durable
    # route cooldown after the response arrives.
    rpm: 20
    ai_gateway_max_attempts: 1
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: SAMBANOVA_API_KEY
  zai:
    api_base: https://api.z.ai/api/paas/v4
    ai_gateway_slug: custom-zai
    # Routed through `workers/llm-provider-shim`, not straight at api_base: AI Gateway rewrites the
    # last segment of a Custom Provider's Base URL to a hardcoded `v1`, which turns z.ai's
    # `/api/paas/v4` into `/api/paas/v1` (a real 404). No Base URL can express `/api/paas/v4`, so
    # the shim restores it. The registered Base URL is
    # `https://citypods-llm-provider-shim.citypods.workers.dev/<SHIM_TOKEN>/zai/x` -- the trailing
    # `x` is sacrificial (the gateway eats it and substitutes `v1`). Verified 2026-08-29: HTTP 200.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: ZAI_API_KEY
  openrouter:
    api_base: https://openrouter.ai/api/v1
    ai_gateway_slug: openrouter
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    discovery:
      endpoint: https://openrouter.ai/api/v1/models
    accounts:
      - id: primary
        api_key_env: OPENROUTER_API_KEY
  kilo:
    api_base: https://api.kilo.ai/api/gateway
    ai_gateway_slug: custom-kilo
    # The registered Base URL is `https://api.kilo.ai/api/gateway/v1`, not api_base: AI Gateway
    # rewrites a Custom Provider Base URL's last segment to a hardcoded `v1`, so registering
    # `/api/gateway` dispatched to `/api/v1` (a real 404). Kilo also serves `/api/gateway/v1`, so
    # registering that lands correctly and no shim is needed. Verified 2026-08-29: HTTP 200.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: KILO_API_KEY
  opencode:
    api_base: https://opencode.ai/zen/v1
    ai_gateway_slug: custom-opencode
    # Routed through `workers/llm-provider-shim` alongside z.ai. OpenCode's own prefix (`/zen/v1`)
    # survives the gateway's `v1` substitution unchanged, yet direct gateway calls still 404'd for a
    # cause never identified from outside -- replaying the gateway's full header set on a direct
    # call would not reproduce it. Going through the shim resolves it, which also ruled out the
    # leading theory that opencode.ai rejects Cloudflare-edge traffic (the shim is a Worker too).
    # Registered Base URL: `https://.../<SHIM_TOKEN>/opencode/x`. Verified 2026-08-29: a genuine
    # upstream 429 (free-tier quota) in place of the routing 404.
    ai_gateway_chat_path: /chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: OPENCODE_API_KEY
  # NVIDIA build.nvidia.com (API Catalog / NIM hosted endpoints). Unlike every other provider
  # above, NVIDIA publishes no rate-limit table at all -- the community-reported baseline is
  # ~40 RPM, account-wide, "dependent on model, use-case, and current overall traffic" per
  # NVIDIA's own developer-forum staff replies, and developers report 429s even under light load.
  # Treat this whole provider as best-effort capacity, never a committed SLA:
  #   - `rpm: 12` is a *self-imposed* 30% cap of the ~40 RPM community baseline (40 * 0.30 = 12),
  #     not a limit NVIDIA documents. This is the one number this account actually enforces via
  #     the shared `ProviderLedger` (see `citypods/compute/llm_budget.py`), pacing every model and
  #     route below off one account-wide clock -- mirroring how the Mistral provider block already
  #     paces every Mistral model off one shared account limit.
  #   - Every route below also declares `tpm: 100000` as a second, independent self-imposed cap.
  #     NOTE: this is an *approximation*, not a true provider-level TPM ledger -- the schema/code
  #     (`LLMBudget`/`ProviderLedger`) only actually enforces a shared limit for `rpm`
  #     (`route.provider_rpm`); there is no equivalent provider-wide token-rate ledger today, so
  #     each route's 40k TPM is checked independently rather than summed across the account. If
  #     several NVIDIA routes are dispatched concurrently at full token throughput, the account's
  #     *aggregate* token rate could exceed 40k TPM even though no single route did. Adding a real
  #     provider-level TPM ledger (parallel to `provider_rpm`) is a follow-up, not done here.
  #   - No `rpd` is set anywhere below: NVIDIA publishes no daily cap, so encoding one would be
  #     inventing a number we have no basis for.
  # No native LiteLLM adapter is assumed for this gateway; routes compile through the same
  # OpenAI-compatible direct-adapter path as Kilo/OpenCode/SiliconFlow (see `_direct_model` in
  # `scripts/compile_llm_limits.py`).
  nvidia:
    api_base: https://integrate.api.nvidia.com/v1
    ai_gateway_slug: custom-nvidia
    # Full path from the origin root, NOT just /chat/completions: Cloudflare AI Gateway ignores
    # the path component of a Custom Provider's registered Base URL and joins the caller-supplied
    # path at the origin root, so `https://integrate.api.nvidia.com/v1` + `/chat/completions`
    # dispatches to `https://integrate.api.nvidia.com/chat/completions` -- NVIDIA's ELB answers
    # that with an empty-body `text/plain` 404. Verified 2026-08-29 by curl. The other custom
    # providers keep `/chat/completions` only because their upstreams happen to serve the same
    # endpoint at the origin root too; NVIDIA's does not.
    ai_gateway_chat_path: /v1/chat/completions
    chat_path: /chat/completions
    reset_timezone: UTC
    # Provider-wide safety net only -- the REAL limit is per route (0.5 rpm each). NVIDIA's quota
    # is per MODEL, not per account: verified 2026-08-29 on one key, `deepseek-v4-pro` returned 429
    # nine times out of nine while `nemotron-3-super` returned 200 three times, twice inside the
    # same minute (16:58:14 ok / 16:58:50 429). A tight provider-wide cap would therefore be the
    # wrong instrument -- it would make nine models share one model's budget. This only has to sit
    # clear of the ~40 RPM community-reported account baseline while staying above the sum of the
    # route rates (9 x 0.5 = 4.5), leaving per-route pacing as the binding constraint.
    rpm: 6
    tpm: 100000
    concurrency: 2
    accounts:
      - id: primary
        api_key_env: NVIDIA_API_KEY
  airforce:
    api_base: https://api.airforce/v1
    ai_gateway_slug: custom-airforce
    ai_gateway_chat_path: /v1/chat/completions
    chat_path: /v1/chat/completions
    reset_timezone: UTC
    accounts:
      - id: primary
        api_key_env: AIRFORCE_API_KEY
