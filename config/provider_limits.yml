  # ==========================================
  # NVIDIA BUILD ROUTES (build.nvidia.com / NIM hosted API catalog)
  # See the `nvidia` provider block above for the capacity caveats these routes share: a
  # self-imposed 0.5 RPM provider-wide pace. Measured 2026-08-29: NVIDIA locks these endpoints
  # out for ~22-49 minutes once roughly 30 successful requests land inside a rolling hour (three
  # lockouts began at 28, 37 and 31 successes/hr), and the lockouts appear to lengthen when we keep
  # exhausting it. 30/hr is 0.5/min, so that is the pace. It costs no throughput -- the hourly quota
  # caps us either way -- it just spends the quota evenly instead of burning it in half an hour and
  # then sitting locked out. Below 1 rpm is deliberate and supported; see _scale_rate_limit.
  # No `tpm` (see the provider block). No `rpd` -- NVIDIA publishes no daily cap. The provider-level
  # `structured_output_method: json_schema` is inherited, not verified: NVIDIA serves each model
  # through its own stack, and at least one (the retired deepseek-v4.1-flash) answered json_schema with empty
  # content, so a route that has been checked carries its own verified method.
  #
  # Each route ALSO declares its own `rpm: 12`, matching the provider-wide cap, even though
  # Python's LLMBudget already enforces that cap correctly at the shared-provider level
  # (`provider_rpm`/`ProviderLedger`) regardless of any route-level value. This is a defense-in-
  # depth stopgap for `workers/llm-dispatch-v2`: unlike the retired v1 Worker
  # (`llm-dispatch-proxy`, which ported `providerRpm`/`providerAvailable`/
  # `reserveProviderCapacity`), v2's pacing engine
  # (`workers/llm-dispatch-v2/src/pacing.js`) has no cross-route, provider-level concept at all --
  # `earliestSafeStart`/`routeHasCapacityFor` only see one route's own rpm/rpd/tpm. Without a
  # route-level rpm, v2 would treat these routes as unbounded. This does not restore
  # true shared pooling in v2 -- in the worst case (many different NVIDIA models dispatched
  # concurrently) v2's aggregate could still exceed the provider-wide rpm in total -- but it bounds each
  # individual route rather than leaving it uncapped. A real fix ports provider-level pacing into
  # v2's pacing.js/coordinator.js; that is a larger follow-up, not done here.
  #
  # Several of these pool with an existing route elsewhere in this file via `model_key`/`model` --
  # NVIDIA becomes an additional, independent free capacity source for that same logical model
  # rather than a new one, exactly like the existing SambaNova+SiliconFlow / OpenRouter+Kilo+
  # OpenCode poolings above.

  # NVIDIA has retired every DeepSeek model it served: v4-pro-0813 and v4-flash-0731 (HTTP 410,
  # 2026-09-21/22), then deepseek-ai/deepseek-v4.1-flash (HTTP 410 "reached its end of life on
  # 2026-11-16T08:00:00Z", confirmed by a direct probe 2026-11-19). The route
  # `nvidia_deepseek_v4_1_flash_free` is removed; deepseek/deepseek-v4.1-flash stays served by
  # the two BeatAPI legs below.


  - route_id: nvidia_nemotron_3_ultra_550b_a55b_free
    model: nvidia/nemotron-3-ultra-550b-a55b
    # Reuses the existing cross-provider canonical key (OpenRouter/Kilo/OpenCode) so a job pinned
    # to this model can also land on this direct NVIDIA leg -- bypassing the broker hop entirely,
    # which is the whole point of adding it (see the 2026-08-29 conversation: OpenRouter's free
    # Nemotron slot returns 429/503 "upstream provider has no capacity" under load).
    model_key: nvidia/nemotron-3-ultra-550b-a55b:free
    provider: nvidia
    upstream_model: nvidia/nemotron-3-ultra-550b-a55b
    # review/58 §12.5 (R2-F): a slow reasoning route; uses the full 780 s ceiling.
    response_timeout_seconds: 780
    # Declared, not used: no lane sets a reasoning level for Nemotron 3 Ultra. Verified
    # 2026-11-14 (review/58 §12.5): this switch returns 0 reasoning tokens and finished 5 of 10
    # test requests against 1 of 10 for the default, but agenda recall fell on 2 of 3 comparable
    # requests, so chapter-agenda keeps the default. Turning it on is a one-line `llm_lanes`
    # change (#2689).
    reasoning_controls:
      "off":  # quoted: bare `off` is YAML's boolean false
        chat_template_kwargs:
          enable_thinking: false
    input_context_limit: 1000000
    output_context_limit: 65536
    # Nemotron tokenizer vs chars/4: p50 1.10 / p95 1.73 / max 3.29 over 412 paired jobs (2026-09-23).
    input_token_ratio: 1.75
    account_id: primary
    # 4 rpm, NOT deepseek-v4-pro's 0.5: NVIDIA's quotas are per model, and this route has never
    # returned a 429. Briefly inheriting deepseek's quota-derived rate on 2026-08-29 throttled the
    # routes actually carrying overflow traffic to one request per four minutes per Worker, which
    # showed up immediately as a drop in dispatched jobs.
    rpm: 4
    # No `tpm`: NVIDIA does not expose a rate-limit header or publish a per-model TPM figure, and
    # the 40000 that sat here was an unverified inherited placeholder (removed 2026-11-19; see the
    # provider block). hard_input_ceiling below is the only size-admission check.
    hard_input_ceiling: 934464
    # NVIDIA rejects an overlapping request with a fast ~8.3s 429 rather than
    # queueing it. Successful calls on these models run 41s median / 77s p90 /
    # 399s max (measured 2026-08-29), so without a ceiling v1 (BATCH_CONCURRENCY=2)
    # and v2 (MAX_JOBS_PER_ROUTE_PER_BUNDLE, 4 then; 1 since 2026-10-23) stack up to 6 in flight
    # on one model and most get rejected. 1 here is per-Worker-ledger, so v1 and v2 each keep
    # one -- up to 2 in flight while both transports are live, the same
    # coexistence caveat as split_cap_multiplier.
    concurrency: 4
    free: true
    input_per_token: 0.0
    output_per_token: 0.0
    observed_on: "2026-09-12"
    observed_burst: 0
    observed_input_ceiling: 246109
    upstream_429_default: upstream_capacity

