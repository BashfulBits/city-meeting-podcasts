<!doctype html>
<meta charset="utf-8">
<title>Agenda gold review</title>
<style>
body{font-family:system-ui,sans-serif;margin:1.2rem auto;max-width:1200px;color:#202124}header{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}button,input,textarea{font:inherit}button{padding:.35rem .6rem}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.9fr);gap:1rem;margin-top:1rem}section{border:1px solid #dadce0;border-radius:.5rem;padding:.8rem}.item{border-top:1px solid #e8eaed;padding:.7rem 0}.quote{background:#fff3b0;padding:.35rem;white-space:pre-wrap}.context{background:#f8f9fa;max-height:20rem;overflow:auto;padding:.45rem;white-space:pre-wrap}.active{font-weight:700;outline:3px solid #1a73e8}.keep{background:#d9ead3}.remove{background:#f4cccc}.unsure{background:#fff2cc}.progress{font-weight:600}label{display:block;margin-top:.35rem}input,textarea{box-sizing:border-box;width:100%;padding:.25rem}textarea{min-height:3rem}@media(max-width:760px){main{grid-template-columns:1fr}}
</style>
<header><button id="previous">Previous</button><strong id="position"></strong><button id="next">Next</button><a id="official" target="_blank" rel="noreferrer">Open official agenda viewer</a><span class="progress" id="progress"></span></header>
<main><section><h2 id="meeting"></h2><p>Keep actual agenda actions; remove headings, boilerplate, attachments, and duplicates. Add a missing action below.</p><div id="items"></div></section><section><h2>Highlighted source context</h2><div class="context" id="context">Select “Show context” for an item.</div><h2>Add missing agenda action</h2><label>Concise title<input id="added-title"></label><label>Source line start (optional)<input id="added-start" inputmode="numeric"></label><label>Source line end (optional)<input id="added-end" inputmode="numeric"></label><button id="add">Add item</button><div id="added"></div></section></main>
<script>
let review,decisions={},index=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const itemId=(m,i)=>`${m.adjudication_id}:candidate:${i}`;
function context(text,start,end){if(!text||!start||!end)return'<p>Source text or line range unavailable. Use the official agenda viewer.</p>';const lines=text.split('\n'),first=Math.max(0,start-3),last=Math.min(lines.length,end+2);return lines.slice(first,last).map((line,offset)=>{const n=first+offset+1;return`<div class="${n>=start&&n<=end?'quote':''}">${n}: ${esc(line)}</div>`}).join('')}
function save(payload){decisions[payload.decision_id]=payload;fetch('/api/decisions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(render)}
function render(){const m=review.meetings[index],rows=m.proposed_items,reviewed=rows.filter((_,i)=>decisions[itemId(m,i)]).length;document.querySelector('#position').textContent=`${index+1} / ${review.meetings.length}`;document.querySelector('#meeting').textContent=`${m.provider} · ${m.coverage_bucket} coverage · ${rows.length} proposed`;document.querySelector('#official').href=m.official_agenda_url||'#';document.querySelector('#progress').textContent=`${reviewed}/${rows.length} reviewed`;document.querySelector('#items').innerHTML=rows.map((item,i)=>{const id=itemId(m,i),feedbackId=`${id}:title-feedback`,state=decisions[id]?.decision||'',feedback=decisions[feedbackId]?.note||'',buttons=['keep','remove','unsure'].map(v=>`<button class="${state===v?`active ${v}`:v}" data-id="${id}" data-value="${v}">${v}</button>`).join(' ');return`<div class="item"><strong>${esc(item.title)}</strong><br><small>Lines ${item.line_start}–${item.line_end}</small><p class="quote">${esc(item.evidence_quote)}</p>${buttons} <button class="show" data-start="${item.line_start}" data-end="${item.line_end}">Show context</button><label>Title feedback (optional)<textarea data-feedback="${feedbackId}" placeholder="Explain a clearer or more faithful title">${esc(feedback)}</textarea></label><button class="save-feedback" data-feedback="${feedbackId}">Save title feedback</button></div>`}).join('');document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>save({decision_id:b.dataset.id,decision:b.dataset.value}));document.querySelectorAll('.show').forEach(b=>b.onclick=()=>document.querySelector('#context').innerHTML=context(m.agenda_text,Number(b.dataset.start),Number(b.dataset.end)));document.querySelectorAll('.save-feedback').forEach(b=>b.onclick=()=>save({decision_id:b.dataset.feedback,decision:'feedback',note:document.querySelector(`textarea[data-feedback="${b.dataset.feedback}"]`).value}));const added=Object.values(decisions).filter(v=>v.decision==='added'&&v.item?.meeting===m.adjudication_id).map(v=>`<li>${esc(v.item.title)} <small>lines ${esc(v.item.line_start||'?')}–${esc(v.item.line_end||'?')}</small></li>`).join('');document.querySelector('#added').innerHTML=added?`<h3>Added</h3><ul>${added}</ul>`:''}
document.querySelector('#add').onclick=()=>{const m=review.meetings[index],title=document.querySelector('#added-title').value.trim();if(!title)return;const line_start=Number(document.querySelector('#added-start').value)||null,line_end=Number(document.querySelector('#added-end').value)||null;save({decision_id:`${m.adjudication_id}:added:${crypto.randomUUID()}`,decision:'added',item:{meeting:m.adjudication_id,title,line_start,line_end}});document.querySelector('#added-title').value='';document.querySelector('#added-start').value='';document.querySelector('#added-end').value=''};
document.querySelector('#previous').onclick=()=>{index=Math.max(0,index-1);render()};document.querySelector('#next').onclick=()=>{index=Math.min(review.meetings.length-1,index+1);render()};Promise.all([fetch('/api/review').then(r=>r.json()),fetch('/api/decisions').then(r=>r.json())]).then(([data,stored])=>{review=data;decisions=stored;render()});
</script>
