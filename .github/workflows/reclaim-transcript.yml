name: Reclaim Transcript

# Manual-only recovery tool (GH#833/#834): re-adopts an ASR artifact already uploaded to storage
# whose record `transcript` block was lost, without re-transcribing. It also reopens terminal failed
# Stage-2 transcript leases after a transient provider incident, or requeues terminal LLM dispatch
# records for a selected model family. Dry-run unless `write` is explicitly set to "true" -- defaults
# to dry-run so an accidental manual trigger never writes.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Recovery operation"
        required: true
        type: choice
        options:
          - reclaim-transcript
          - requeue-failed-work-leases
          - requeue-failed-llm-dispatch
          - retire-legacy-prelabeler-dispatch
        default: reclaim-transcript
      source_key:
        description: "Source key owning the episode (e.g. 0134e94361a5)"
        required: false
      episode_uid:
        description: "Episode uid to reclaim"
        required: false
      work_class:
        description: "Transcript lease class to recover"
        required: false
        type: choice
        options:
          - transcript-asr
          - transcript-asr-comparison
          - transcript-align
          - provider-transcript-align
          - provider-transcript-diarize
        default: provider-transcript-align
      llm_model_prefix:
        description: "Comma-separated failed LLM model prefix(es) to requeue"
        required: false
        default: google/gemma-4-
      legacy_created_before:
        description: "Retire only legacy pre-labeler requests created before this RFC 3339 timestamp"
        required: false
        default: "2026-08-15T00:00:00Z"
      write:
        description: "Actually push the reclaimed record (anything other than 'true' stays dry-run)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  reclaim:
    runs-on: ubuntu-latest
    env:
      AUDIO_STORAGE_BACKEND: routing
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]"

      - name: Run transcript recovery
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_KEY: ${{ github.event.inputs.source_key }}
          EPISODE_UID: ${{ github.event.inputs.episode_uid }}
          WORK_CLASS: ${{ inputs.work_class }}
          LLM_MODEL_PREFIX: ${{ inputs.llm_model_prefix }}
          LEGACY_CREATED_BEFORE: ${{ inputs.legacy_created_before }}
          WRITE: ${{ github.event.inputs.write }}
          GIT_REF: ${{ github.ref }}
          R2_RECLAIM_ACCESS_KEY: ${{ secrets.R2_RECLAIM_ACCESS_KEY }}
          R2_RECLAIM_SECRET_ACCESS_KEY: ${{ secrets.R2_RECLAIM_SECRET_ACCESS_KEY }}
        run: |
          if [ "$OPERATION" = "requeue-failed-work-leases" ]; then
            args=(--work-class "$WORK_CLASS")
            if [ "$WRITE" = "true" ]; then
              # A mutating dispatch may only change production leases from main (MR-GH-01).
              if [ "$GIT_REF" != "refs/heads/main" ]; then
                echo "::error::write can only mutate leases from main"
                exit 1
              fi
              args+=(--write)
            fi
            python -m citypods.cli compute requeue-failed-work-leases "${args[@]}"
            exit 0
          fi

          if [ "$OPERATION" = "requeue-failed-llm-dispatch" ]; then
            args=(--bucket citypods-llm-dispatch --model-prefix "$LLM_MODEL_PREFIX" --workers 4)
            if [ "$WRITE" = "true" ]; then
              # A mutating dispatch may only change production queue records from main.
              if [ "$GIT_REF" != "refs/heads/main" ]; then
                echo "::error::write can only mutate LLM dispatch records from main"
                exit 1
              fi
            else
              args+=(--dry-run)
            fi
            python -u scripts/requeue_failed_llm_dispatch.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$OPERATION" = "retire-legacy-prelabeler-dispatch" ]; then
            args=(
              --bucket citypods-llm-dispatch
              --model-prefix "$LLM_MODEL_PREFIX"
              --created-before "$LEGACY_CREATED_BEFORE"
              --workers 4
            )
            if [ "$WRITE" = "true" ]; then
              # Retirement is a recoverable state transition, but it still changes production
              # queue state and must only run from main (MR-GH-01).
              if [ "$GIT_REF" != "refs/heads/main" ]; then
                echo "::error::write can only retire production LLM dispatch records from main"
                exit 1
              fi
            else
              args+=(--dry-run)
            fi
            python -u scripts/retire_legacy_prelabeler_dispatch.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$SOURCE_KEY" ] || [ -z "$EPISODE_UID" ]; then
            echo "::error::source_key and episode_uid are required for reclaim-transcript"
            exit 1
          fi
          args=(--source-key "$SOURCE_KEY" --episode-uid "$EPISODE_UID")
          if [ "$WRITE" = "true" ]; then
            # A mutating dispatch may only persist state from main (MR-GH-01): a feature-branch
            # dispatch could otherwise push a reclaimed production record with no review.
            if [ "$GIT_REF" != "refs/heads/main" ]; then
              echo "::error::write can only push state from main"
              exit 1
            fi
            args+=(--write)
          fi
          python -m citypods.cli compute reclaim-transcript "${args[@]}"
