name: Reclaim Transcript

# Manual-only recovery tool (GH#833/#834): re-adopts an ASR artifact already uploaded to storage
# whose record `transcript` block was lost, without re-transcribing. Dry-run unless `write` is
# explicitly set to "true" -- defaults to dry-run so an accidental manual trigger never writes.

on:
  workflow_dispatch:
    inputs:
      source_key:
        description: "Source key owning the episode (e.g. 0134e94361a5)"
        required: true
      episode_uid:
        description: "Episode uid to reclaim"
        required: true
      write:
        description: "Actually push the reclaimed record (anything other than 'true' stays dry-run)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  reclaim:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]"

      - name: Reclaim transcript
        env:
          SOURCE_KEY: ${{ github.event.inputs.source_key }}
          EPISODE_UID: ${{ github.event.inputs.episode_uid }}
          WRITE: ${{ github.event.inputs.write }}
        run: |
          args=(--source-key "$SOURCE_KEY" --episode-uid "$EPISODE_UID")
          if [ "$WRITE" = "true" ]; then
            args+=(--write)
          fi
          python -m citypods.cli compute reclaim-transcript "${args[@]}"
