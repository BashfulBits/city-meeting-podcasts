name: Chapter boundary locator

on:
  schedule:
    # Agenda extraction and deferred finalization are independent; this lane picks up completed
    # agenda artifacts one hour after the agenda lane and never waits synchronously for Gemini.
    # Run on odd UTC hours; chapter-agenda uses the alternating even-hour slots.
    - cron: "0 1-23/2 * * *"
  workflow_dispatch: {}

concurrency:
  group: chapter-locator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt

      - name: Locate agenda candidates in complete transcripts
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          # R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}  # uncomment for jurisdiction-specific buckets
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          CITYPODS_MAINTENANCE_LEASE_KEY: maintenance-leases/chapter-locator.json
          CITYPODS_MAINTENANCE_LEASE_OWNER: github-actions:${{ github.workflow }}:${{ github.run_id }}
          LLM_MODE: dispatch
          LLM_DISPATCH_URL: ${{ secrets.LLM_DISPATCH_URL }}
          LLM_DISPATCH_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_AUTH_TOKEN }}
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
        run: python -m citypods.cli enrich --lane chapter-locator
