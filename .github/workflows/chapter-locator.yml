name: Chapter boundary locator

on:
  schedule:
    # Agenda extraction and deferred finalization are independent; this lane picks up completed
    # agenda artifacts on the next tick and never waits synchronously for Gemini.
    - cron: "7-59/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: chapter-locator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt

      - name: Locate agenda candidates in complete transcripts
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          LLM_MODE: dispatch
          LLM_DISPATCH_URL: ${{ secrets.LLM_DISPATCH_URL }}
          LLM_DISPATCH_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_AUTH_TOKEN }}
        run: python -m citypods.cli enrich --lane chapter-locator
