name: CI

on:
  pull_request:
  push:
    branches: [main]

# MR-GH-05: this runs on every pull_request push (the highest-frequency trigger) with no
# concurrency group, so rapid pushes ran overlapping CI to completion instead of canceling the
# superseded run — mirrors preview.yml's equivalent group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Same checksum-pinned build audio.yml's host fallback uses (citypods-audio-runner:py312-
      # ffmpeg71-v1) -- NOT `apt-get install ffmpeg`, which on ubuntu-latest (24.04 "noble") resolves
      # to 6.1.1, a full major version behind the 7.1.5 production actually renders audio with.
      # Real-ffmpeg integration tests (shutil.which("ffmpeg")-gated) exist to prove behavior against
      # the binary that runs in production; testing a different major version would defeat that.
      FFMPEG_SHA256: 30d8f18138393081d7fdf95f7006fa132e7b063fd87c0e955652c64a4bc0d52d
      FFMPEG_DIR: /home/runner/.cache/citypods/ffmpeg-static-v1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,wer,llm]" -c constraints/dev.txt

      - name: Cache pinned ffmpeg
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-static-linux64-7.1.5-v2

      - name: Install pinned ffmpeg (matches production's audio.yml pin)
        # Self-built (scripts/build_ffmpeg_static.sh), vendored to our own B2 bucket -- not an
        # upstream/mirror host. FFMPEG_URL built from the B2 secret rather than hardcoded so it's
        # not duplicated across the 7 workflows that pin ffmpeg (review/22).
        env:
          FFMPEG_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}/deps/ffmpeg/7.1.5/ffmpeg-7.1.5-linux64-static.tar.xz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgnutls30 libopus0 libvpx9 libdav1d7 libmp3lame0
          python scripts/install_static_ffmpeg.py \
            --url "${FFMPEG_URL}" \
            --sha256 "${FFMPEG_SHA256}" \
            --install-dir "${FFMPEG_DIR}"
          "${FFMPEG_DIR}/bin/ffmpeg" -version
          "${FFMPEG_DIR}/bin/ffprobe" -version

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest)
        run: PATH="${FFMPEG_DIR}/bin:${PATH}" pytest -q

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Test Granicus Cloudflare Worker
        working-directory: workers/granicus-media-proxy
        run: npm test

  # Dependency-pinning policy enforcement (review/22). Keeps pins from rotting.
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Policy guard (pinned Actions + no re-declared external-worker deps)
        run: python scripts/check_dependency_policy.py

      - name: Constraints drift gate
        run: |
          if grep -q "NOT YET POPULATED" constraints/*.txt; then
            echo "::warning::constraints/*.txt not yet compiled — run the lock.yml workflow. Skipping drift gate (bootstrap)."
            exit 0
          fi
          # compile_constraints.sh resolves inside the pinned python:3.12 image via
          # Docker (available on ubuntu-latest), matching lock.yml exactly.
          scripts/compile_constraints.sh
          git diff --exit-code -- constraints/ || {
            echo "::error::constraints/*.txt are stale — run scripts/compile_constraints.sh and commit."
            exit 1
          }
