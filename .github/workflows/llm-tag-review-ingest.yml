name: LLM Tag Calibration Ingest

on:
  issues:
    types: [edited]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "30 11 * * 1"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to ingest manually"
        required: false
        default: ""

concurrency:
  # Shared with llm-tag-review.yml -- see that file's comment.
  group: llm-evaluation-state
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      numbers: ${{ steps.resolve.outputs.numbers }}
    steps:
      - name: Checkout setup-gh-cli action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-gh-cli
            constraints/gh-cli.txt
          sparse-checkout-cone-mode: false
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli
      - name: Resolve review issues
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git remote to infer the repo from; give it one
          # explicitly rather than relying on gh's (version-dependent) implicit repo resolution.
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER_INPUT: ${{ github.event.inputs.issue_number || '' }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          EVENT_ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          EVENT_ISSUE_STATE: ${{ github.event.issue.state || '' }}
          EVENT_ISSUE_LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
          EVENT_COMMENT_ISSUE_URL: ${{ github.event.comment.issue_url || '' }}
          EVENT_COMMENT_BODY: ${{ github.event.comment.body || '' }}
          EVENT_COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
        run: |
          # The dedicated label -- applied only by llm-tag-review.yml's own GITHUB_TOKEN, which
          # requires triage-or-above permission to replicate by hand -- is the trust boundary here,
          # not the title: a title string is guessable/settable by anyone who can open an issue on
          # a public repo, so title-only matching (the pre-fix behavior) let an unauthenticated
          # public issue get ingested as a genuine calibration decision by the scheduled sweep.
          #
          # EVENT_ISSUE_STATE gates both event-driven paths below: the ingest step closes an issue
          # right after its first accepted decision, and record_review() overwrites by candidate_id
          # with no immutability check, so a later re-edit or /llm-ingest comment on an
          # already-closed issue would otherwise silently replace that recorded decision. A
          # correction is intentionally still allowed for as long as the issue stays open (matches
          # the scheduled sweep's own long-standing `--state open` filter below); once closed, the
          # decision is final.
          numbers="[]"
          if [ -n "$ISSUE_NUMBER_INPUT" ]; then
            numbers=$(jq -nc --arg n "$ISSUE_NUMBER_INPUT" '[$n | tonumber]')
          elif [ "$EVENT_NAME" = "issues" ] && [ -n "$EVENT_ISSUE_NUMBER" ] \
            && [ "$EVENT_ISSUE_STATE" = "open" ] \
            && printf '%s\n' "$EVENT_ISSUE_TITLE" | grep -q '^R5 LLM tag sample ' \
            && printf '%s\n' "$EVENT_ISSUE_LABELS" | jq -e 'index("llm-calibration-review")' >/dev/null; then
            numbers=$(jq -nc --arg n "$EVENT_ISSUE_NUMBER" '[$n | tonumber]')
          elif [ -n "$EVENT_COMMENT_ISSUE_URL" ] \
            && [ "$EVENT_ISSUE_STATE" = "open" ] \
            && printf '%s\n' "$EVENT_COMMENT_BODY" | grep -qiE '^/llm-ingest([[:space:]]|$)' \
            && printf '%s\n' "$EVENT_COMMENT_AUTHOR_ASSOCIATION" | grep -qE '^(OWNER|MEMBER|COLLABORATOR)$' \
            && printf '%s\n' "$EVENT_ISSUE_TITLE" | grep -q '^R5 LLM tag sample ' \
            && printf '%s\n' "$EVENT_ISSUE_LABELS" | jq -e 'index("llm-calibration-review")' >/dev/null; then
            n=$(printf '%s' "$EVENT_COMMENT_ISSUE_URL" | awk -F/ '{print $NF}')
            numbers=$(jq -nc --arg n "$n" '[$n | tonumber]')
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            numbers=$(gh issue list --state open --label llm-calibration-review \
              --search 'in:title "R5 LLM tag sample "' --json number --jq '[.[].number]')
          fi
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

  ingest:
    needs: resolve
    if: needs.resolve.outputs.numbers != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Ingest decisions in a loop
        env:
          GH_TOKEN: ${{ github.token }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          NUMBERS: ${{ needs.resolve.outputs.numbers }}
        run: |
          failed=0
          for number in $(echo "$NUMBERS" | jq -r '.[]'); do
            tmp_dir=$(mktemp -d)
            (
              set -e
              echo "=================================================="
              echo "Processing issue #$number..."
              echo "=================================================="

              gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body,url,number,author > "$tmp_dir/issue.json"
              jq -r '.body' "$tmp_dir/issue.json" > "$tmp_dir/issue-body.md"

              set +e
              citypods llm-evaluation ingest \
                --issue-number "$number" \
                --issue-body-file "$tmp_dir/issue-body.md" \
                --issue-url "$(jq -r '.url' "$tmp_dir/issue.json")" \
                --actor "$(jq -r '.author.login // empty' "$tmp_dir/issue.json")" > "$tmp_dir/ingest.json" 2> "$tmp_dir/ingest.err"
              code=$?
              set -e
              if [ "$code" -ne 0 ]; then
                if grep -q "review issue must contain exactly one checked outcome box" "$tmp_dir/ingest.err"; then
                  echo "Issue #$number has no checked review decision yet — skipping"
                  exit 0
                fi
                cat "$tmp_dir/ingest.err" >&2
                echo "::error::Failed to process issue #$number"
                exit 1
              fi

              if jq -e '.stored == true' "$tmp_dir/ingest.json" > /dev/null 2>&1; then
                marker="<!-- llm-ingest:${number} -->"
                gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json state,comments > "$tmp_dir/issue-state.json"
                has_comment=$(jq -r --arg m "$marker" '[.comments[] | select((.author.login | test("^(github-actions(\\[bot\\])?|app/github-actions)$")) and (.body | startswith($m)))] | length > 0' "$tmp_dir/issue-state.json")
                if [ "$has_comment" = "false" ]; then
                  comment=$(jq -r '.comment' "$tmp_dir/ingest.json")
                  printf '%s\n%s\n' "$marker" "$comment" > "$tmp_dir/comment-body.md"
                  gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$tmp_dir/comment-body.md"
                fi
                is_open=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq '.state == "OPEN"')
                if [ "$is_open" = "true" ]; then
                  gh issue close "$number" --repo "$GITHUB_REPOSITORY"
                fi
                echo "Successfully ingested issue #$number"
              else
                echo "Skipping issue #$number: no decision stored"
              fi
            ) || {
              echo "::error::Failed to process issue #$number"
              failed=1
            }
            rm -rf "$tmp_dir"
          done
          exit "$failed"



  finalize:
    # Run once after the serialized child ingests so a completed native batch is closed before
    # the next weekly publisher creates a new parent. GitHub permits at most 100 sub-issues per
    # parent; retaining a single forever-open digest would eventually exhaust that limit.
    needs: [resolve, ingest]
    if: always() && needs.resolve.result != 'failure' && needs.resolve.outputs.numbers != '[]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout setup-gh-cli action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-gh-cli
            constraints/gh-cli.txt
          sparse-checkout-cone-mode: false
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli
      - name: Close cleared native review batches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          parents=$(gh issue list --state open --label llm-calibration-review \
            --search 'in:title "R5 LLM tag calibration digest"' --json number,title \
            --jq '[.[] | select(.title == "R5 LLM tag calibration digest")] | .[].number')
          for parent in $parents; do
            open_children=$(gh issue view "$parent" --repo "$GH_REPO" --json subIssues \
              --jq '[.subIssues.nodes[] | select(.state == "OPEN")] | length')
            if [ "$open_children" -eq 0 ]; then
              gh issue comment "$parent" --body "All native LLM calibration review sub-issues in this batch are resolved — closing."
              gh issue close "$parent"
            fi
          done
