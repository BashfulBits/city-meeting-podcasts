name: LLM Tag Calibration Ingest

on:
  issues:
    types: [edited]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "30 11 * * 1"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to ingest manually"
        required: false
        default: ""

concurrency:
  group: llm-tag-review-ingest
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      numbers: ${{ steps.resolve.outputs.numbers }}
    steps:
      - name: Resolve review issues
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER_INPUT: ${{ github.event.inputs.issue_number || '' }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          EVENT_ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          EVENT_COMMENT_ISSUE_URL: ${{ github.event.comment.issue_url || '' }}
          EVENT_COMMENT_BODY: ${{ github.event.comment.body || '' }}
          EVENT_COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
        run: |
          numbers="[]"
          if [ -n "$ISSUE_NUMBER_INPUT" ]; then
            numbers=$(jq -nc --arg n "$ISSUE_NUMBER_INPUT" '[$n | tonumber]')
          elif [ "$EVENT_NAME" = "issues" ] && [ -n "$EVENT_ISSUE_NUMBER" ]; then
            numbers=$(jq -nc --arg n "$EVENT_ISSUE_NUMBER" '[$n | tonumber]')
          elif [ -n "$EVENT_COMMENT_ISSUE_URL" ] \
            && printf '%s\n' "$EVENT_COMMENT_BODY" | grep -qiE '^/llm-ingest([[:space:]]|$)' \
            && printf '%s\n' "$EVENT_COMMENT_AUTHOR_ASSOCIATION" | grep -qE '^(OWNER|MEMBER|COLLABORATOR)$' \
            && printf '%s\n' "$EVENT_ISSUE_TITLE" | grep -q '^R5 LLM tag sample '; then
            n=$(printf '%s' "$EVENT_COMMENT_ISSUE_URL" | awk -F/ '{print $NF}')
            numbers=$(jq -nc --arg n "$n" '[$n | tonumber]')
          elif [ "$EVENT_NAME" = "schedule" ]; then
            numbers=$(gh issue list --state open --search 'in:title "R5 LLM tag sample "' \
              --json number --jq '[.[].number]')
          fi
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

  ingest:
    needs: resolve
    if: needs.resolve.outputs.numbers != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      # Each matrix job pull/mutate/pushes the *entire* shared calibration-state snapshot with no
      # merge on write; running more than one at a time lets the last push silently clobber every
      # other job's recorded review decision. max-parallel: 1 serializes them.
      max-parallel: 1
      matrix:
        issue_number: ${{ fromJson(needs.resolve.outputs.numbers) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Download issue body
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ matrix.issue_number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json body,url,number,author > issue.json
          jq -r '.body' issue.json > issue-body.md

      - name: Ingest decision
        id: ingest
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          ISSUE_NUMBER: ${{ matrix.issue_number }}
        run: |
          set +e
          citypods llm-evaluation ingest \
            --issue-number "$ISSUE_NUMBER" \
            --issue-body-file issue-body.md \
            --issue-url "$(jq -r '.url' issue.json)" \
            --actor "$(jq -r '.author.login // empty' issue.json)" > ingest.json
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "stored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stored=true" >> "$GITHUB_OUTPUT"
          echo "comment<<EOF" >> "$GITHUB_OUTPUT"
          jq -r '.comment' ingest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comment and close child issue
        if: steps.ingest.outputs.stored == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ matrix.issue_number }}
          COMMENT: ${{ steps.ingest.outputs.comment }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "$COMMENT"
          gh issue close "$ISSUE_NUMBER"

