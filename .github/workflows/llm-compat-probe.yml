name: LLM structured-output compatibility probe

# Diagnostic only: a fixed harmless prompt, four one-attempt calls, no catalog state or storage.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model to probe"
        required: true
        default: gemini-3.1-flash-lite
        type: choice
        options:
          - gemini-3.1-flash-lite
          - gemini-3-flash-preview

permissions:
  contents: read

concurrency:
  group: llm-compat-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[llm]" -c constraints/prod.txt
      - name: Probe fixed-prompt structured-output compatibility
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m citypods.llm_compat_probe --model "${{ inputs.model }}"
