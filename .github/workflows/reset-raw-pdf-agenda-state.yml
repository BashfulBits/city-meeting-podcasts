name: Reset raw-PDF-bytes agenda state

# One-time recovery for citypods/agenda_text.py's _extract_pdf ImportError-fallback bug: a handful
# of episodes' durable agenda_text_artifact held raw, undecoded PDF bytes instead of extracted
# text. scripts/audit_raw_pdf_agenda_artifacts.py surveyed production directly against B2 (never
# the rate/quota-limited public audio.citymeetings.fyi CF-worker domain) and found 67 corrupted
# objects across 70 episodes -- all in Austin, TX -- committed as
# scripts/fixtures/raw_pdf_agenda_hits_2026-09-13.json. This clears their derived agenda/chapter
# state so AgendaTextStage re-derives them under the now-fixed extractor. Start with apply
# unchecked to inspect the exact cohort, then run again with apply checked from main. The normal
# Audio and chapter workflows rebuild the cleared derived state afterward.
on:
  workflow_dispatch:
    inputs:
      hits_file:
        description: "Survey manifest (audit_raw_pdf_agenda_artifacts.py --json output)"
        required: true
        type: string
        default: "scripts/fixtures/raw_pdf_agenda_hits_2026-09-13.json"
      source:
        description: "Only this source key; blank = every source in the manifest"
        required: false
        type: string
        default: ""
      apply:
        description: "Actually clear and push state (unchecked = dry-run)"
        required: false
        type: boolean
        default: false

# Serialize with Audio. The script's own maintenance lease is the atomic correctness boundary for
# reset vs. chapter writes; this group avoids two resets or a reset-during-materialize race.
concurrency:
  group: audio
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Wait for active audio and chapter runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in audio.yml chapter-agenda.yml chapter-locator.yml; do
            for attempt in $(seq 1 40); do
              active=$(gh run list --workflow "$workflow" --status in_progress --json databaseId --limit 5 2>/dev/null || echo "[]")
              queued=$(gh run list --workflow "$workflow" --status queued --json databaseId --limit 5 2>/dev/null || echo "[]")
              active_count=$(printf '%s\n' "$active" | jq 'length')
              queued_count=$(printf '%s\n' "$queued" | jq 'length')
              if [ "$active_count" -eq 0 ] && [ "$queued_count" -eq 0 ]; then
                echo "$workflow is idle"
                break
              fi
              if [ "$attempt" -eq 40 ]; then
                echo "$workflow remained active for 20 minutes; refusing to reset state" >&2
                exit 1
              fi
              echo "$workflow is active; waiting 30 seconds ($attempt/40)"
              sleep 30
            done
          done

      - name: Reset raw-PDF-bytes agenda state
        env:
          HITS_FILE: ${{ inputs.hits_file }}
          SOURCE: ${{ inputs.source }}
          APPLY_INPUT: ${{ inputs.apply }}
          GIT_REF: ${{ github.ref }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          if [ "$APPLY_INPUT" = "true" ] && [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "apply is allowed only from the main branch (got $GIT_REF)" >&2
            exit 1
          fi
          # --sequential: push one source at a time rather than one call covering every source
          # (which would launch up to 16 concurrent uploads). This cohort mixes normal-sized and
          # very large (80-120MB) episodes.json files under one batch, and a failed source is
          # reported and skipped rather than aborting the run -- safe to just rerun for whatever
          # is left, since the script re-verifies current state before touching anything.
          args=(--hits-file "$HITS_FILE" --sequential)
          if [ -n "$SOURCE" ]; then args+=(--source "$SOURCE"); fi
          if [ "$APPLY_INPUT" = "true" ]; then args+=(--apply); fi
          PYTHONPATH=. python scripts/reset_raw_pdf_agenda_state.py "${args[@]}"
