name: Audit Work Leases (manual)

# One-off diagnostic for GH#706 §6(b) close-out: lists the raw work-leases/ ledger directly
# (bypassing compute reconcile's candidate-derived sweep) to confirm whether any lease is stuck
# leased+expired that the scheduled reaper isn't seeing. Not scheduled — dispatch manually only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Audit raw work-lease ledger
        run: python scripts/compute/audit_work_leases.py | tee "$GITHUB_STEP_SUMMARY"

      - name: Preview compute reconcile (dry run, writes nothing)
        run: citypods compute reconcile --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
