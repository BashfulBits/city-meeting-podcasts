name: Reset materialization backoff

# Manual recovery (#39/#120): clear the materialization backoff on un-hosted records so the next
# `Audio` run retries them immediately. Use this after a bug that made encodes fail (Granicus 403s
# #293/#297, Swagit truncation #274) has been fixed: those failures pushed records into the #120
# backoff (skipped for up to 30 days), and `clear-materialization.yml` can't reach them because they
# were never hosted (no `audio encode done` line). This scans the record store and resets the
# attempts/last_attempt/error of every record that is un-hosted AND in backoff.
#
# Dispatch from the Actions tab → "Reset materialization backoff" → Run workflow. Leave `apply`
# unchecked first for a dry-run (prints exactly what it would reset), then run with `apply` checked.
# Optionally scope to a provider (e.g. `granicus`) to verify one provider end-to-end first.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Only this provider (e.g. granicus); blank = all providers"
        required: false
        type: string
        default: ""
      source:
        description: "Only this source key (e.g. ecc3710ac47f); blank = all sources"
        required: false
        type: string
        default: ""
      uid:
        description: "Only this record UID; blank = all UIDs"
        required: false
        type: string
        default: ""
      error:
        description: "Only this materialize error code (e.g. timeline-degenerate); blank = any error"
        required: false
        type: string
        default: ""
      include_hosted:
        description: "Also reset hosted records (use only with narrow source/uid/error filters)"
        required: false
        type: boolean
        default: false
      apply:
        description: "Actually mutate state (unchecked = dry-run)"
        required: false
        type: boolean
        default: false

# Share the `audio` concurrency group so this never runs while an Audio run is materializing into the
# same records (which would race the state push). One at a time.
concurrency:
  group: audio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Reset materialization backoff
        env:
          PROVIDER: ${{ inputs.provider }}
          SOURCE: ${{ inputs.source }}
          # Named RECORD_UID, not UID: bash initializes its own readonly `UID` shell parameter
          # from the real process UID at shell startup, which silently shadows an env var of that
          # same name — an env var literally named `UID` here made `--uid` filtering never
          # actually apply the workflow input (CR2-GH-06/C2).
          RECORD_UID: ${{ inputs.uid }}
          ERROR_CODE: ${{ inputs.error }}
          GIT_REF: ${{ github.ref }}
          INCLUDE_HOSTED_INPUT: ${{ inputs.include_hosted }}
          APPLY_INPUT: ${{ inputs.apply }}
        run: |
          ARGS=()
          if [ -n "$PROVIDER" ]; then ARGS+=(--provider "$PROVIDER"); fi
          if [ -n "$SOURCE" ]; then ARGS+=(--source "$SOURCE"); fi
          if [ -n "$RECORD_UID" ]; then ARGS+=(--uid "$RECORD_UID"); fi
          if [ -n "$ERROR_CODE" ]; then ARGS+=(--error "$ERROR_CODE"); fi
          if [ "$INCLUDE_HOSTED_INPUT" = "true" ]; then ARGS+=(--include-hosted); fi
          if [ "$APPLY_INPUT" = "true" ]; then
            # A mutating dispatch may only persist state from main (MR-GH-01): a feature-branch
            # dispatch could otherwise reset production backoff state with no review.
            if [ "$GIT_REF" != "refs/heads/main" ]; then
              echo "::error::apply can only mutate state from main"
              exit 1
            fi
            ARGS+=(--apply)
          fi
          PYTHONPATH=. python scripts/reset_materialize_backoff.py "${ARGS[@]}"
