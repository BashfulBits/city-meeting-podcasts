name: R12 merged batch reconciliation

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  discussions: write
  issues: write

jobs:
  reconcile:
    if: >-
      ${{
        github.event.pull_request.merged &&
        github.event.pull_request.head.ref == 'automation/r12-city-batch'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli

      - name: Mark source issues applied
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CITY_REQUEST_STATUS_WEBHOOK_URL: ${{ secrets.CITY_REQUEST_STATUS_WEBHOOK_URL }}
        run: |
          issues=$(printf '%s\n' "$PR_BODY" | sed -n 's/.*<!-- citypods:r12-source-issues=\([0-9][0-9,]*\) -->.*/\1/p' | tr ',' '\n' | sort -u)
          if [ -z "$issues" ]; then exit 0; fi
          printf '%s\n' "$issues" | while read -r issue; do
            gh issue edit "$issue" --add-label add-city:applied --remove-label r12:approved \
              --remove-label r12:batched
            title=$(gh issue view "$issue" --json title --jq .title)
            if printf '%s\n' "$title" | grep -q '^Add city:'; then
              gh issue close "$issue" --comment \
                "Applied through merged R12 maintainer-review PR #$PR_NUMBER."
            else
              gh issue comment "$issue" --body \
                "Applied through merged R12 maintainer-review PR #$PR_NUMBER."
            fi
            gh issue view "$issue" --json number,url,body > notify-issue.json
            python scripts/r12_notify.py --issue notify-issue.json --status applied \
              --target-url "$PR_URL"
          done
