name: Feed health audit

# Daily feed-health audit. Files/updates/closes one GitHub issue per (city, check) so the
# tracker stays a live, deduplicated view of feed health. Runs independently of deploy.yml
# so an audit failure never blocks publishing. Free: Actions minutes are unlimited on public
# repos. (Scheduled workflows run only from the default branch and GitHub disables crons
# after 60 days of repo inactivity; the 4h deploy cron keeps the repo active.)

on:
  schedule:
    - cron: "0 12 * * *" # daily at 12:00 UTC
  workflow_dispatch:
    inputs:
      enclosures:
        description: "Also HEAD-probe enclosures (slower)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: feed-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: pip install -e ".[storage]"

      - name: Run audit
        env:
          GH_TOKEN: ${{ github.token }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
        # --meetings-urls runs every time: it's one HEAD per unique meetings_url (a handful),
        # so it's cheap enough for the daily cron (unlike --enclosures, which probes per-episode).
        run: >-
          PYTHONPATH=. python scripts/audit_feeds.py
          --meetings-urls
          --timeline-diagnostics audit-timeline-integrity.jsonl
          ${{ (github.event_name == 'workflow_dispatch' && inputs.enclosures) && '--enclosures' || '' }}

      - name: Upload timeline diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeline-audio-integrity
          path: audit-timeline-integrity.jsonl
          if-no-files-found: ignore
