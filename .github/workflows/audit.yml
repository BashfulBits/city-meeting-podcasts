name: Feed health audit

# Daily feed-health audit. Files/updates/closes one GitHub issue per (city, check) so the
# tracker stays a live, deduplicated view of feed health. Runs independently of deploy.yml
# so an audit failure never blocks publishing. Free: Actions minutes are unlimited on public
# repos. (Scheduled workflows run only from the default branch and GitHub disables crons
# after 60 days of repo inactivity; the 4h deploy cron keeps the repo active.)

on:
  schedule:
    - cron: "0 12 * * *" # daily at 12:00 UTC
  workflow_dispatch:
    inputs:
      enclosures:
        description: "Also HEAD-probe enclosures (slower)"
        type: boolean
        default: false
      timeline_repair:
        description: "Persist selected timeline/audio repair flags"
        type: boolean
        default: false
      timeline_repair_min_delta:
        description: "Minimum stream delta in seconds for selected repair rows"
        type: string
        default: "1.0"
      timeline_repair_cohort:
        description: "Cohort label stamped on selected repair rows"
        type: string
        default: ""
      timeline_diagnostics:
        description: "Write full timeline/audio diagnostics artifact (slow; for repair canaries)"
        type: boolean
        default: false
      timeline_finding_min_delta:
        description: "Minimum stream delta in seconds for rendered-mismatch issues"
        type: string
        default: "1.0"

permissions:
  contents: read
  issues: write
  # Scoped to exactly one use: `gh workflow run remedy-unexpected-bodies.yml` when this run creates
  # a consolidated unexpected-body issue or adds a new affected-feed row to one. This is the whole
  # reason that workflow doesn't need to listen for `issues: opened` -- only a token already
  # holding `actions: write` on this repo can dispatch it, so there is no externally reachable
  # trigger surface to spoof.
  actions: write

concurrency:
  group: feed-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Run audit
        env:
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
          SWAGIT_PROXY_BASE_URL: ${{ secrets.SWAGIT_PROXY_BASE_URL }}
          SWAGIT_PROXY_TOKEN: ${{ secrets.SWAGIT_PROXY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          TIMELINE_DIAGNOSTICS_INPUT: ${{ inputs.timeline_diagnostics }}
          ENCLOSURES_INPUT: ${{ inputs.enclosures }}
          TIMELINE_REPAIR_INPUT: ${{ inputs.timeline_repair }}
          # Free-form string inputs: pass through env, never inline them in `run:` shell text
          # (a branch-controllable/free-form value interpolated pre-shell could otherwise splice
          # arbitrary script text into this step — the same shape as the fixed CR2-GH-07/C1).
          TIMELINE_FINDING_MIN_DELTA: ${{ inputs.timeline_finding_min_delta }}
          TIMELINE_REPAIR_MIN_DELTA: ${{ inputs.timeline_repair_min_delta }}
          TIMELINE_REPAIR_COHORT: ${{ inputs.timeline_repair_cohort }}
        # --meetings-urls runs every time: it's one HEAD per unique meetings_url (a handful),
        # so it's cheap enough for the daily cron (unlike --enclosures, which probes per-episode).
        run: |
          args=(
            --meetings-urls
            --timeline-finding-min-delta "${TIMELINE_FINDING_MIN_DELTA:-1.0}"
          )
          timeline_diagnostics_requested=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TIMELINE_DIAGNOSTICS_INPUT" = "true" ]; then
            timeline_diagnostics_requested=true
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$ENCLOSURES_INPUT" = "true" ]; then
            args+=(--enclosures)
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TIMELINE_REPAIR_INPUT" = "true" ]; then
            timeline_diagnostics_requested=true
            if [ "$GIT_REF" != "refs/heads/main" ]; then
              echo "::error::timeline_repair can only persist durable state from main"
              exit 1
            fi
            args+=(
              --persist-timeline-integrity
              --timeline-repair-min-delta "$TIMELINE_REPAIR_MIN_DELTA"
            )
            if [ -z "$TIMELINE_REPAIR_COHORT" ]; then
              echo "::error::timeline_repair_cohort is required when timeline_repair is true"
              exit 1
            fi
            args+=(--timeline-repair-cohort "$TIMELINE_REPAIR_COHORT")
          fi
          if [ "$timeline_diagnostics_requested" = "true" ]; then
            args+=(--timeline-diagnostics audit-timeline-integrity.jsonl)
          fi
          PYTHONPATH=. python scripts/audit_feeds.py "${args[@]}"

      - name: Upload timeline diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeline-audio-integrity
          path: audit-timeline-integrity.jsonl
          if-no-files-found: ignore
