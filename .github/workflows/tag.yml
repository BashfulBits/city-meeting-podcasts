name: LLM topic tags

# R5's bounded producer.  This lane is deliberately separate from Audio and ASR: topic tags
# only read already-persisted meeting material, and a quota deferral is normal rather than a
# workflow failure. Flash-Lite is pinned in site_config.yml. The tag lane uses the asynchronous
# dispatch Worker, so this workflow enqueues work and a later deferred sweep consumes the result.
on:
  schedule:
    # Twelve producer passes (every two hours, review/58 section 12.1) give the tagger lane
    # repeated chances to spend its daily ingress allowance while the Worker still owns provider
    # pacing and quota admission (review/58 B5: GitHub drops a share of scheduled runs, so cadence
    # is over-provisioned). Minute 19 avoids the deploy (:26), audio (:47) and moments (:28) slots.
    - cron: "19 */2 * * *"
  workflow_dispatch: {}
  # review/58 WP6b: the dispatch Worker's cron fires this event (config/producer_triggers.yml);
  # the schedule above is the fallback. client_payload is untrusted and unused.
  repository_dispatch:
    types: [tag]

permissions:
  contents: read
  actions: read

concurrency:
  group: llm-topic-tags
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    # The producer is count-bounded and reads the restored records index without provider scrapes.
    # Retain a generous backstop for state transfer and an unusually large candidate traversal.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # review/58 WP6b: on a schedule run, skip the rest of the job (green) when a
      # repository_dispatch/workflow_dispatch run of this workflow succeeded and started
      # within the window, so the fallback schedule does not double runner time. Fail-open.
      - name: Skip scheduled run when the Worker trigger already ran
        id: schedule_guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: tag.yml
          WINDOW_MINUTES: "90"
        continue-on-error: true
        run: bash scripts/producer_schedule_guard.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.schedule_guard.outputs.skip != 'true'
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install
        if: steps.schedule_guard.outputs.skip != 'true'
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt

      - name: Capture starting LLM worker state
        if: steps.schedule_guard.outputs.skip != 'true'
        env:
          CITYPODS_LLM_SUBMISSION_TELEMETRY_FILE: ${{ runner.temp }}/llm-submission-telemetry.jsonl
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
        run: |
          echo "CITYPODS_LLM_SUBMISSION_TELEMETRY_FILE=$CITYPODS_LLM_SUBMISSION_TELEMETRY_FILE" >> "$GITHUB_ENV"
          python scripts/llm_submission_telemetry.py snapshot start

      - name: Produce bounded LLM topic-tag candidates
        if: steps.schedule_guard.outputs.skip != 'true'
        # Fail loudly instead of being cancelled. A JOB-level timeout cancels the run, which
        # GitHub reports as a grey "cancelled" -- indistinguishable at a glance from someone
        # cancelling it by hand, and it skips every later step so nothing is persisted or
        # reported. This lane hit exactly that on eight consecutive scheduled runs
        # (2026-08-26..09-02). A STEP-level timeout below the job's fails the step, so the run
        # goes red and the post-steps still execute. Record-first source preparation is what
        # should keep the lane well inside this; reaching it means something regressed.
        timeout-minutes: 165
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          SWAGIT_PROXY_BASE_URL: ${{ secrets.SWAGIT_PROXY_BASE_URL }}
          SWAGIT_PROXY_TOKEN: ${{ secrets.SWAGIT_PROXY_TOKEN }}
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
        run: python -m citypods.cli enrich --lane tag

      - name: Summarize LLM submission telemetry
        if: always() && steps.schedule_guard.outputs.skip != 'true'
        env:
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
        run: |
          python scripts/llm_submission_telemetry.py snapshot end
          python scripts/llm_submission_telemetry.py report

      - name: Upload LLM submission telemetry
        if: always() && steps.schedule_guard.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: llm-submission-telemetry-${{ github.run_id }}
          path: ${{ runner.temp }}/llm-submission-telemetry.jsonl
          if-no-files-found: ignore
          retention-days: 30
