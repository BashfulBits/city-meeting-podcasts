name: LLM topic tags

# R5's bounded producer.  This lane is deliberately separate from Audio and ASR: topic tags
# only read already-persisted meeting material, and a quota deferral is normal rather than a
# workflow failure.  Routes are pinned in site_config.yml's `tagging.llm_models` (currently two
# independent Flash-Lite free-tier pools); each route's real rpm/rpd/tpm ceiling lives in
# `ROUTES` (citypods/compute/llm_policy.py), which the scheduler paces within and drains across
# the run instead of bursting one window and stopping. Don't restate a specific attempts/day
# number here -- it drifts out of sync with those two files (this comment previously said "20
# provider attempts/day", true only of the original single-route rpd=20 safety ceiling before the
# real free-tier numbers and the second route were confirmed).
on:
  schedule:
    - cron: "15 18 * * *" # after Gemini's Pacific daily reset, allowing for cron jitter
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: llm-topic-tags
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt

      - name: Produce bounded LLM topic-tag candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: python -m citypods.cli enrich --lane tag
