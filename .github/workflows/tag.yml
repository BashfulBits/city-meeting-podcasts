name: LLM topic tags

# R5's bounded producer.  This lane is deliberately separate from Audio and ASR: topic tags
# only read already-persisted meeting material, and a quota deferral is normal rather than a
# workflow failure.  Flash-Lite is pinned in site_config.yml and the CAS scheduler limits it to
# 20 provider attempts per Pacific calendar day.
on:
  schedule:
    - cron: "15 18 * * *" # after Gemini's Pacific daily reset, allowing for cron jitter
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: llm-topic-tags
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    # Was 25m: still hard-cancelled runs (no persist, no summary) even after several rounds of
    # narrowing specific in-pass cost sinks (state restore, duration-heal gating, fingerprint
    # short-circuiting -- see CHANGELOG), because none of those touch _run_enrich_global_queue's
    # source-prepare pass (fetch_merge over every unique source in scope): it runs unconditionally
    # to completion before ctx.stop() is ever checked, so a slow-fetching backlog (many-committee
    # cities, a Cloudflare Worker fallback relay adding latency) can alone burn the whole job
    # before the tag-lane's own graceful budget below gets a chance to matter. Mirrors
    # llm-deferred-sweep.yml's headroom: give the job enough wall-clock room that prepare always
    # finishes, so tag_run_time_budget_minutes (site_config.yml) can then do its job -- stop
    # dispatching, persist what's done, and exit cleanly well before this outer limit.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt

      - name: Produce bounded LLM topic-tag candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          SWAGIT_PROXY_BASE_URL: ${{ secrets.SWAGIT_PROXY_BASE_URL }}
          SWAGIT_PROXY_TOKEN: ${{ secrets.SWAGIT_PROXY_TOKEN }}
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
        run: python -m citypods.cli enrich --lane tag
