name: Provider catalog commands

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: provider-catalog-writers
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      ${{ github.event.issue.pull_request == null && github.event.comment.body == '/apply' &&
        contains(github.event.issue.body, '<!-- citypods:provider-catalog v=') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: ./.github/actions/setup-gh-cli
      - run: pip install -e ".[dev,llm]" -c constraints/dev.txt
      - name: Apply authorized current selections
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPOSITORY: ${{ github.repository }}
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          # Exactly the keys the planner uses (test_workflows derives this set from config).
          AIRFORCE_API_KEY: ${{ secrets.AIRFORCE_API_KEY }}
          BEATAPI_API_KEY: ${{ secrets.BEATAPI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if ! gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" > actor-permission.json; then
            echo '{"permission":"none"}' > actor-permission.json
          fi
          gh auth setup-git
          set +e
          python scripts/provider_catalog_commands.py --event "$EVENT_PATH" \
            --permission actor-permission.json --out provider-catalog-command.json
          code=$?
          set -e
          jq -r '.comment' provider-catalog-command.json > provider-catalog-command.md
          gh issue comment "$ISSUE_NUMBER" --body-file provider-catalog-command.md
          exit "$code"
