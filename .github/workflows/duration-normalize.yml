name: Normalize durations

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Only this source key; blank = all sources"
        required: false
        type: string
        default: ""
      uid:
        description: "Only this record UID; blank = all UIDs"
        required: false
        type: string
        default: ""
      max_items:
        description: "Max records to process per run"
        required: false
        type: string
        default: "200"
      probe_existing:
        description: "Probe hosted audio via range reads when available"
        required: false
        type: boolean
        default: true
      apply:
        description: "Actually write normalized records (unchecked = dry-run)"
        required: false
        type: boolean
        default: false

concurrency:
  group: audio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    env:
      FFMPEG_URL: https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.1.5-amd64-static.tar.xz
      FFMPEG_SHA256: 16f2f146fe7eba1857f522619efa36babcbc500e9698ad72f0f30501acaa80bb
      FFMPEG_DIR: /home/runner/.cache/citypods/ffmpeg-static-v1
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Cache pinned ffmpeg
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-static-linux64-7.1.5-v1

      - name: Install pinned ffmpeg
        run: |
          python scripts/install_static_ffmpeg.py \
            --url "${FFMPEG_URL}" \
            --sha256 "${FFMPEG_SHA256}" \
            --install-dir "${FFMPEG_DIR}"
          "${FFMPEG_DIR}/bin/ffmpeg" -version >/dev/null
          "${FFMPEG_DIR}/bin/ffprobe" -version >/dev/null

      - name: Normalize durations
        env:
          SOURCE: ${{ inputs.source }}
          # Named RECORD_UID, not UID: bash initializes its own readonly `UID` shell parameter
          # from the real process UID at shell startup, which silently shadows an env var of that
          # same name — an env var literally named `UID` here would make `--uid` filtering never
          # actually apply the workflow input (same bug class as CR2-GH-06/C2).
          RECORD_UID: ${{ inputs.uid }}
          MAX_ITEMS: ${{ inputs.max_items }}
          PROBE_EXISTING_INPUT: ${{ inputs.probe_existing }}
          APPLY_INPUT: ${{ inputs.apply }}
          GIT_REF: ${{ github.ref }}
        run: |
          ARGS=(--max-items "$MAX_ITEMS")
          if [ -n "$SOURCE" ]; then ARGS+=(--source "$SOURCE"); fi
          if [ -n "$RECORD_UID" ]; then ARGS+=(--uid "$RECORD_UID"); fi
          if [ "$PROBE_EXISTING_INPUT" = "false" ]; then ARGS+=(--no-probe-existing); fi
          if [ "$APPLY_INPUT" = "true" ]; then
            # A mutating dispatch may only persist state from main (MR-GH-01): a feature-branch
            # dispatch could otherwise write normalized production records with no review.
            if [ "$GIT_REF" != "refs/heads/main" ]; then
              echo "::error::apply can only mutate state from main"
              exit 1
            fi
            ARGS+=(--apply)
          fi
          ARGS+=(--ffmpeg-binary "${FFMPEG_DIR}/bin/ffmpeg")
          PYTHONPATH=. python scripts/normalize_durations.py "${ARGS[@]}"

      - name: Publish summary
        if: always()
        run: cat duration-normalize/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duration-normalize
          path: |
            duration-normalize/normalize.jsonl
            duration-normalize/summary.json
            duration-normalize/summary.md
