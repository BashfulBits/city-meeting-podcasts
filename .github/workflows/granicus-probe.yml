name: Granicus probe

on:
  workflow_dispatch:
    inputs:
      probe_kind:
        description: "Low-volume transport discriminator or sustained pressure/cooldown matrix"
        type: choice
        options:
          - transport
          - worker
          - chunked-canary
          - sustained
        default: transport
      repeat_count:
        description: "Short serial requests per clip"
        type: number
        default: 8
      durations:
        description: "Progressive sample durations in seconds"
        type: string
        default: "30,120,600"
      cooldown_seconds:
        description: "Quiet interval before recovery checks"
        type: number
        default: 1800
      range_mib:
        description: "Maximum bytes per curl admission request (MiB)"
        type: number
        default: 16
      full_download_max_mib:
        description: "Maximum size of an end-to-end curl download (MiB)"
        type: number
        default: 512
      full_download_count:
        description: "Maximum objects to download fully and process locally"
        type: number
        default: 1
      production_encode_clip:
        description: "Optional full production-recipe encode through the direct-first Worker fallback"
        type: choice
        options:
          - none
          - arlington-audio40
          - pflugerville-audio40
        default: none
      canary_url:
        description: "Canonical Granicus archive object for the byte-accuracy canary"
        type: string
        default: "https://archive-video.granicus.com/fortworthgov/fortworthgov_e4cc067f-6b2d-11f1-9494-005056a89546.mp4"

permissions:
  contents: read
  actions: read

concurrency:
  # Share Audio's workflow-level queue so a probe cannot race a scheduled/manual Audio run after
  # its initial isolation check. cancel-in-progress=false makes the probe wait its turn.
  group: audio
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FFMPEG_SHA256: 30d8f18138393081d7fdf95f7006fa132e7b063fd87c0e955652c64a4bc0d52d
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e . -c constraints/prod.txt
      - name: Install pinned static ffmpeg
        # Self-built (scripts/build_ffmpeg_static.sh), vendored to our own B2 bucket -- not an
        # upstream/mirror host. FFMPEG_URL built from the B2 secret rather than hardcoded so it's
        # not duplicated across the 7 workflows that pin ffmpeg (review/22).
        env:
          FFMPEG_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}/deps/ffmpeg/7.1.5/ffmpeg-7.1.5-linux64-static.tar.xz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgnutls30 libopus0 libvpx9 libdav1d7 libmp3lame0
          python scripts/install_static_ffmpeg.py \
            --url "${FFMPEG_URL}" \
            --sha256 "${FFMPEG_SHA256}" \
            --install-dir "${RUNNER_TEMP}/ffmpeg-static"
      - name: Require isolated Audio state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTIVE=$(gh run list --workflow audio.yml --status in_progress --json databaseId --limit 5)
          QUEUED=$(gh run list --workflow audio.yml --status queued --json databaseId --limit 5)
          if [[ "${ACTIVE}" != "[]" || "${QUEUED}" != "[]" ]]; then
            echo "::error title=Probe isolation unavailable::Audio is active or queued."
            exit 1
          fi
          echo "No active or queued Audio run."
      - name: Run Granicus transport discriminator
        if: ${{ inputs.probe_kind == 'transport' }}
        run: |
          PYTHONPATH=. python scripts/probe_granicus_transport.py \
            --ffmpeg "${RUNNER_TEMP}/ffmpeg-static/bin/ffmpeg" \
            --ffprobe "${RUNNER_TEMP}/ffmpeg-static/bin/ffprobe" \
            --range-mib "${{ inputs.range_mib }}" \
            --full-download-max-mib "${{ inputs.full_download_max_mib }}" \
            --full-download-count "${{ inputs.full_download_count }}" \
            --output granicus-transport-results.json
      - name: Run Cloudflare Worker Granicus probe
        if: ${{ inputs.probe_kind == 'worker' }}
        env:
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
        run: |
          PYTHONPATH=. python scripts/probe_granicus_worker.py \
            --ffmpeg "${RUNNER_TEMP}/ffmpeg-static/bin/ffmpeg" \
            --ffprobe "${RUNNER_TEMP}/ffmpeg-static/bin/ffprobe" \
            --range-mib "${{ inputs.range_mib }}" \
            --full-download-max-mib "${{ inputs.full_download_max_mib }}" \
            --full-download-count "${{ inputs.full_download_count }}" \
            --production-encode-clip "${{ inputs.production_encode_clip }}" \
            --output granicus-worker-results.json
      - name: Run sustained Granicus matrix
        if: ${{ inputs.probe_kind == 'sustained' }}
        env:
          # durations is a free-form string input; pass through env rather than inlining it in
          # `run:` shell text (the other inputs on this step are GitHub-validated `number`s, so
          # they can't carry shell metacharacters the way a `string` input could).
          DURATIONS: ${{ inputs.durations }}
        run: |
          PYTHONPATH=. python scripts/probe_granicus_sustained.py \
            --ffmpeg "${RUNNER_TEMP}/ffmpeg-static/bin/ffmpeg" \
            --repeat-count "${{ inputs.repeat_count }}" \
            --durations "$DURATIONS" \
            --cooldown-seconds "${{ inputs.cooldown_seconds }}" \
            --output granicus-sustained-results.json
      - name: Run chunked Worker byte-accuracy canary
        if: ${{ inputs.probe_kind == 'chunked-canary' }}
        env:
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
          CANARY_URL: ${{ inputs.canary_url }}
        run: |
          PYTHONPATH=. python scripts/probe_granicus_chunked.py \
            --url "$CANARY_URL" \
            --chunk-mib "${{ inputs.range_mib }}" \
            --max-mib "${{ inputs.full_download_max_mib }}" \
            --output granicus-chunked-results.json
      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: granicus-probe-results
          path: granicus-*-results.json
          if-no-files-found: warn
