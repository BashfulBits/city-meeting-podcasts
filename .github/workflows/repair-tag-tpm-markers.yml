name: Repair audited tag TPM markers

# Explicit manual execution only. The script checks the twelve audited identities, verifies each
# marker under the normal coordination lock, and stores the original before changing anything.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the audited repairs (false reports eligibility only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: audited-tag-tpm-marker-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install storage dependencies
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt
      - name: Check or repair audited markers
        env:
          APPLY: ${{ inputs.apply }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          args=()
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python -m scripts.repair_tag_tpm_markers "${args[@]}" | tee "$RUNNER_TEMP/repair.txt"
          cat "$RUNNER_TEMP/repair.txt" >> "$GITHUB_STEP_SUMMARY"
