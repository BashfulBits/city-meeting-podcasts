name: Clear materialization

# Manual cleanup (#39): undo a bad `Audio` run wholesale. Given an Actions run ID, it parses that
# run's `audio encode done` lines and resets those records (and optionally deletes the B2 objects) so
# the next `audio.yml` re-encodes them correctly. Use it to nuke the truncated/empty audio the first
# sharded run hosted before the per-host cap + truncation guard landed.
#
# Dispatch from the Actions tab → "Clear materialization" → Run workflow → enter the run ID. Leave
# `apply` unchecked first for a dry-run (it prints exactly what it would clear), then run with
# `apply` checked to make the change.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run ID whose materializations to clear (e.g. 27497034389)"
        required: true
        type: string
      apply:
        description: "Actually mutate state (unchecked = dry-run)"
        required: false
        type: boolean
        default: false
      delete_objects:
        description: "Also delete the B2 audio objects (re-encode overwrites them either way)"
        required: false
        type: boolean
        default: false

# Share the `audio` concurrency group so this never runs while an Audio run is materializing into the
# same records (which would race the state push). One at a time.
concurrency:
  group: audio
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # `gh run view --log` reads the target run's logs

jobs:
  clear:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }} # lets `gh run view --log` fetch the target run
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Clear run materializations
        # Pass workflow context through env (never inline ${{ }} inside `run:` shell text): a
        # branch-controllable/free-form input interpolated pre-shell could otherwise splice
        # arbitrary script text into this step (CR2-GH-07/C1) rather than being treated as data.
        env:
          RUN_ID: ${{ inputs.run_id }}
          GIT_REF: ${{ github.ref }}
          APPLY_INPUT: ${{ inputs.apply }}
          DELETE_OBJECTS_INPUT: ${{ inputs.delete_objects }}
        run: |
          ARGS=("$RUN_ID")
          if [ "$APPLY_INPUT" = "true" ]; then
            # A mutating dispatch may only persist state from main (MR-GH-01): a feature-branch
            # dispatch could otherwise clear/delete production materializations with no review.
            if [ "$GIT_REF" != "refs/heads/main" ]; then
              echo "::error::apply can only mutate state from main"
              exit 1
            fi
            ARGS+=(--apply)
          fi
          if [ "$DELETE_OBJECTS_INPUT" = "true" ]; then
            ARGS+=(--delete-objects)
          fi
          PYTHONPATH=. python scripts/clear_run_materializations.py "${ARGS[@]}"
