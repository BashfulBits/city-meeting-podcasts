name: Worker package smoke

on:
  pull_request:
    paths:
      - "workers/**"
      - ".github/workflows/*worker*deploy.yml"
      - ".github/workflows/llm-provider-shim-deploy.yml"
      - ".github/workflows/worker-package-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker:
          - swagit-list-proxy
          - granicus-media-proxy
          - llm-provider-shim
          - llm-dispatch-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Test Worker
        working-directory: workers/${{ matrix.worker }}
        run: npm test
      - name: Package without deploying
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          # Deliberately fake credentials: this check must never authenticate to Cloudflare.
          apiToken: smoke-test-no-cloudflare-access
          accountId: "00000000000000000000000000000000"
          workingDirectory: workers/${{ matrix.worker }}
          wranglerVersion: "4.147.0"
          command: deploy --dry-run --outdir /tmp/worker-package
      - name: Verify bundle exists and exact Wrangler was installed
        working-directory: workers/${{ matrix.worker }}
        run: |
          test -s /tmp/worker-package/index.js
          test "$(node -p 'require("wrangler/package.json").version')" = "4.147.0"
