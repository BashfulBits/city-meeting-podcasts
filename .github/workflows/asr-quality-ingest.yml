name: ASR Quality Ingest

on:
  issues:
    types: [edited]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to ingest manually"
        required: false
        default: ""

concurrency:
  group: asr-quality-ingest
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Only reads issues (gh issue list) — no writes. The sparse checkout below uses the default
    # `github.token`, already scoped down to `issues: read` by this job's own `permissions:`
    # block below, with `persist-credentials: false` so nothing is written to disk/git config.
    permissions:
      issues: read
    outputs:
      numbers: ${{ steps.resolve.outputs.numbers }}
    steps:
      - name: Checkout setup-gh-cli action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-gh-cli
            constraints/gh-cli.txt
          sparse-checkout-cone-mode: false
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli
      - name: Resolve candidate issue(s)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git remote to infer the repo from; give it one
          # explicitly rather than relying on gh's (version-dependent) implicit repo resolution.
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER_INPUT: ${{ github.event.inputs.issue_number || '' }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          EVENT_COMMENT_ISSUE_URL: ${{ github.event.comment.issue_url || '' }}
          EVENT_COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          numbers="[]"
          if [ -n "$ISSUE_NUMBER_INPUT" ]; then
            numbers=$(jq -nc --arg n "$ISSUE_NUMBER_INPUT" '[$n | tonumber]')
          elif [ "$EVENT_NAME" = "issues" ] && [ -n "$EVENT_ISSUE_NUMBER" ]; then
            numbers=$(jq -nc --arg n "$EVENT_ISSUE_NUMBER" '[$n | tonumber]')
          elif [ -n "$EVENT_COMMENT_ISSUE_URL" ] && printf '%s\n' "$EVENT_COMMENT_BODY" | grep -qiE '^/h15-ingest([[:space:]]|$)'; then
            n=$(printf '%s' "$EVENT_COMMENT_ISSUE_URL" | awk -F/ '{print $NF}')
            numbers=$(jq -nc --arg n "$n" '[$n | tonumber]')
          elif [ "$EVENT_NAME" = "schedule" ]; then
            # Fallback safety net for missed issues.edited / issue_comment webhooks: scan every
            # open H15 child issue and let the ingest job below attempt ingestion on each one.
            # Issues without a checked primary box simply fail parse_issue_decision and are
            # skipped (matches the per-issue "stored=false -> no-op" behavior below).
            numbers=$(gh issue list --state open --search 'in:title "H15 sample "' \
              --json number --jq '[.[].number]')
          fi
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

  ingest:
    needs: resolve
    if: needs.resolve.outputs.numbers != '[]'
    runs-on: ubuntu-latest
    # Checks out code (contents: read) and comments/closes child issues (issues: write). A single
    # job processing the full resolved list sequentially, not a matrix leg per issue: a matrix
    # would give each leg the *complete* NUMBERS list (every leg reruns the whole loop below),
    # duplicating comments/closes/record writes across N concurrent legs for N resolved issues.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Ingest decisions in a loop
        env:
          GH_TOKEN: ${{ github.token }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          NUMBERS: ${{ needs.resolve.outputs.numbers }}
        run: |
          failed=0
          for number in $(echo "$NUMBERS" | jq -r '.[]'); do
            tmp_dir=$(mktemp -d)
            (
              set -e
              echo "=================================================="
              echo "Processing issue #$number..."
              echo "=================================================="

              gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body,url,number,author > "$tmp_dir/issue.json"
              jq -r '.body' "$tmp_dir/issue.json" > "$tmp_dir/issue-body.md"

              set +e
              citypods transcript-quality ingest-review \
                --issue-number "$number" \
                --issue-body-file "$tmp_dir/issue-body.md" \
                --issue-url "$(jq -r '.url' "$tmp_dir/issue.json")" \
                --actor "$(jq -r '.author.login // empty' "$tmp_dir/issue.json")" > "$tmp_dir/ingest.json" 2> "$tmp_dir/ingest.err"
              code=$?
              set -e
              if [ "$code" -ne 0 ]; then
                if grep -q "issue must have exactly one checked primary outcome" "$tmp_dir/ingest.err"; then
                  echo "Issue #$number has no checked review decision yet — skipping"
                  exit 0
                fi
                cat "$tmp_dir/ingest.err" >&2
                echo "::error::Failed to process issue #$number"
                exit 1
              fi

              if jq -e '.stored == true' "$tmp_dir/ingest.json" > /dev/null 2>&1; then
                marker="<!-- h15-ingest:${number} -->"
                gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json state,comments > "$tmp_dir/issue-state.json"
                has_comment=$(jq -r --arg m "$marker" '[.comments[] | select((.author.login | test("^(github-actions(\\[bot\\])?|app/github-actions)$")) and (.body | startswith($m)))] | length > 0' "$tmp_dir/issue-state.json")
                if [ "$has_comment" = "false" ]; then
                  comment=$(jq -r '.comment' "$tmp_dir/ingest.json")
                  printf '%s\n%s\n' "$marker" "$comment" > "$tmp_dir/comment-body.md"
                  gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$tmp_dir/comment-body.md"
                fi
                is_open=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq '.state == "OPEN"')
                if [ "$is_open" = "true" ]; then
                  gh issue close "$number" --repo "$GITHUB_REPOSITORY"
                fi
                echo "Successfully ingested issue #$number"
              else
                echo "Skipping issue #$number: no decision stored"
              fi
            ) || {
              echo "::error::Failed to process issue #$number"
              failed=1
            }
            rm -rf "$tmp_dir"
          done
          exit "$failed"



  finalize:
    # Runs once per workflow run (not once per matrix leg) so N children closing in the same
    # run can't race each other into double-commenting/closing the same parent.
    needs: [resolve, ingest]
    if: always() && needs.resolve.result != 'failure' && needs.resolve.outputs.numbers != '[]'
    runs-on: ubuntu-latest
    # Comments/closes parent issues. The sparse checkout below uses the default `github.token`,
    # already scoped down to `issues: write` by this job's own `permissions:` block below, with
    # `persist-credentials: false` so nothing is written to disk/git config.
    permissions:
      issues: write
    steps:
      - name: Checkout setup-gh-cli action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-gh-cli
            constraints/gh-cli.txt
          sparse-checkout-cone-mode: false
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli
      - name: Close parent issues when their batch is clear
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          parents=$(gh issue list --state open \
            --search 'in:title "H15 transcript quality review"' --json number,title \
            --jq '[.[] | select(.title == "H15 transcript quality review")] | .[].number')
          for parent in $parents; do
            # The native relation avoids both title/body spoofing and the previous pagination cap.
            # A review batch is at most 10 children today, but query the relation itself so a future
            # batch-size increase cannot make us close the parent while a child is still open.
            open_children=$(gh issue view "$parent" --repo "$GH_REPO" --json subIssues \
              --jq '[.subIssues.nodes[] | select(.state == "OPEN")] | length')
            if [ "$open_children" -eq 0 ]; then
              gh issue comment "$parent" --body "All child H15 review issues in this batch are resolved — closing."
              gh issue close "$parent"
            fi
          done
