name: Shared weekly review resolution

on:
  issues:
    types: [edited]
  issue_comment:
    types: [created]
  schedule:
    - cron: "30 14 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-review-resolution
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-gh-cli
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[storage,wer,llm]" -c constraints/prod.txt
      - name: Resolve managed review children
        env:
          GH_TOKEN: ${{ github.token }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number || '' }}
          EVENT_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issues=$(gh issue list --state open --label agent:weekly-review --limit 500 --json number --jq '.[].number')
          else
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$EVENT_ACTOR/permission" --jq .permission)
            case "$permission" in
              admin|maintain|write) issues="$EVENT_ISSUE" ;;
              *) echo "Ignoring untrusted review editor: $EVENT_ACTOR ($permission)"; exit 0 ;;
            esac
          fi
          for issue in $issues; do
            gh issue view "$issue" --json body,url > issue.json
            body=$(jq -r .body issue.json)
            if ! grep -q '<!-- citypods-review:' <<<"$body"; then
              continue
            fi
            printf '%s\n' "$body" > issue.md
            actor="$EVENT_ACTOR"
            if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              actor="github-actions"
            fi
            rm -f result.log
            python scripts/resolve_review_issue.py --issue-number "$issue" \
              --issue-url "$(jq -r .url issue.json)" --actor "$actor" --body-file issue.md > result.log
            if tail -1 result.log | jq -e '.stored == true' >/dev/null; then
              gh issue close "$issue" --comment "Stored managed review decision."
            fi
          done
      - name: Finalize cleared batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/finalize_review_batches.py
