name: Remedy feedback

# Review/51 P4: what a person does to a remedy PR or issue (merge, close, reopen) becomes an
# immutable P2 decision event, so a rejected change cannot regenerate and a refinement issue can
# answer it. Written to be safe on `pull_request_target`: it checks out `main`, never the PR head,
# runs no fork-controlled code, holds no model provider keys, and only appends to the remedy
# ledger under its maintenance lease. A daily reconciliation recovers any event it missed.

on:
  pull_request_target:
    types: [closed, reopened]
  issues:
    types: [closed, reopened]
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions: {}

# One writer of the remedy ledger and the remedy PR/issue set at a time, across every workflow.
# The group is on the jobs, not the workflow, so an unrelated PR event (which skips the job) never
# enters it, and `queue: max` keeps every waiting remedy run instead of replacing the pending one.
jobs:
  feedback:
    name: Record feedback
    concurrency:
      group: remedy-taxonomy-writes
      cancel-in-progress: false
      queue: max
    if: >-
      ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' &&
        github.event.sender.type != 'Bot' &&
        (github.event.pull_request.user.login == 'github-actions[bot]' ||
          github.event.issue.user.login == 'github-actions[bot]') &&
        (github.event.pull_request == null ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
        (contains(github.event.pull_request.body, '<!-- citypods:remedy:v1:') ||
          contains(github.event.issue.body, '<!-- citypods:remedy:v1:')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install storage and policy dependencies
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt
      - name: Check the actor's current repository permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          if ! gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" > actor-permission.json; then
            echo '{"permission":"none"}' > actor-permission.json
          fi
      - name: Record the event in the remedy ledger
        env:
          AUDIO_STORAGE_BACKEND: routing
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/remedy_feedback.py event \
            --event-name "$EVENT_NAME" --event "$GITHUB_EVENT_PATH" \
            --permission actor-permission.json --repository "$REPOSITORY" \
            --result feedback-result.json | tee -a "$GITHUB_STEP_SUMMARY"

  reconcile:
    name: Reconcile missed events
    concurrency:
      group: remedy-taxonomy-writes
      cancel-in-progress: false
      queue: max
    if: >-
      ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install storage and policy dependencies
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt
      - name: Reconcile settled remedy artifacts with the ledger
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIO_STORAGE_BACKEND: routing
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/remedy_feedback.py reconcile \
            --repository "$REPOSITORY" --result reconcile-result.json | tee -a "$GITHUB_STEP_SUMMARY"
