name: LLM endpoint rate-limit probe

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to probe (optional; empty probes all)"
        required: false
        default: ""
        type: string
      phases:
        description: "Phases to run (comma-separated, e.g. 0,4 or 0,1,1b,2,3)"
        required: false
        default: "0"
        type: string
      apply:
        description: "Issue live requests (defaults to false for dry-run)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: llm-rate-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[llm]" -c constraints/prod.txt
      - name: Run LLM rate probe
        env:
          INPUT_APPLY: ${{ inputs.apply }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_PHASES: ${{ inputs.phases }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AIRFORCE_API_KEY: ${{ secrets.AIRFORCE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          ARGS=""
          if [ "$INPUT_APPLY" = "true" ]; then
            ARGS="$ARGS --apply"
          fi
          if [ -n "$INPUT_PROVIDER" ]; then
            ARGS="$ARGS --provider $INPUT_PROVIDER"
          fi
          IFS=',' read -ra PHASE_LIST <<< "$INPUT_PHASES"
          for p in "${PHASE_LIST[@]}"; do
            p_trimmed="$(echo "$p" | tr -d ' ')"
            if [ -n "$p_trimmed" ]; then
              ARGS="$ARGS --phase $p_trimmed"
            fi
          done
          python -m citypods.llm_rate_probe $ARGS --out llm_route_characterization.json
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-rate-probe-report
          path: llm_route_characterization.json
          if-no-files-found: ignore
