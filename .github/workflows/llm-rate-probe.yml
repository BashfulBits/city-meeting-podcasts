name: LLM endpoint rate-limit probe

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to probe (optional; empty probes all)"
        required: false
        default: ""
        type: string
      route:
        description: "Route ID to probe (optional; e.g. nvidia_minimaxai_minimax_m3_1_flash)"
        required: false
        default: ""
        type: string
      max_search_tokens:
        description: "Phase 2 upper bound in chars/4 tokens (default 1000000)"
        required: false
        default: "1000000"
        type: string
      phases:
        description: "Phases to run (comma-separated, e.g. 0,4 or 0,1,1b,2,3)"
        required: false
        default: "0"
        type: string
      apply:
        description: "Issue live requests (defaults to false for dry-run)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: llm-rate-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -e ".[llm]" -c constraints/prod.txt
      - name: Run LLM rate probe
        env:
          INPUT_APPLY: ${{ inputs.apply }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_ROUTE: ${{ inputs.route }}
          INPUT_MAX_SEARCH_TOKENS: ${{ inputs.max_search_tokens }}
          INPUT_PHASES: ${{ inputs.phases }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
          AIRFORCE_API_KEY: ${{ secrets.AIRFORCE_API_KEY }}
          BEATAPI_API_KEY: ${{ secrets.BEATAPI_API_KEY }}
          BEATAPI_API_KEY_SECONDARY: ${{ secrets.BEATAPI_API_KEY_SECONDARY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
        run: |
          # One array element per value: a dispatch input must never be able to add arguments
          # (for example "1000000 --apply" turning a dry run live).
          ARGS=()
          if [ "$INPUT_APPLY" = "true" ]; then
            ARGS+=(--apply)
          fi
          if [ -n "$INPUT_PROVIDER" ]; then
            ARGS+=(--provider "$INPUT_PROVIDER")
          fi
          if [ -n "$INPUT_ROUTE" ]; then
            ARGS+=(--route "$INPUT_ROUTE")
          fi
          if [ -n "$INPUT_MAX_SEARCH_TOKENS" ]; then
            if ! [[ "$INPUT_MAX_SEARCH_TOKENS" =~ ^[0-9]+$ ]]; then
              echo "max_search_tokens must be a whole number" >&2
              exit 1
            fi
            ARGS+=(--max-search-tokens "$INPUT_MAX_SEARCH_TOKENS")
          fi
          IFS=',' read -ra PHASE_LIST <<< "$INPUT_PHASES"
          for p in "${PHASE_LIST[@]}"; do
            p_trimmed="$(echo "$p" | tr -d ' ')"
            if [ -n "$p_trimmed" ]; then
              ARGS+=(--phase "$p_trimmed")
            fi
          done
          # 25 minutes of probing inside the job's 30-minute timeout; the 900s default cannot cover
          # several routes' large-size ceiling searches.
          python -m citypods.llm_rate_probe "${ARGS[@]}" --max-wall-seconds 1500 \
            --out llm_route_characterization.json
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: llm-rate-probe-report
          path: llm_route_characterization.json
          if-no-files-found: ignore
