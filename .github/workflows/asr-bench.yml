name: ASR benchmark

# Manual H6a benchmark for comparing ASR model speed/quality before catalog backfill.
# Each case is `city-slug:episode-uid` for an episode with hosted audio and a stored
# reference transcript in restored state.

on:
  workflow_dispatch:
    inputs:
      case_1:
        description: "Required benchmark case: city-slug:episode-uid"
        required: true
        type: string
      case_2:
        description: "Optional benchmark case: city-slug:episode-uid"
        required: false
        type: string
      case_3:
        description: "Optional benchmark case: city-slug:episode-uid"
        required: false
        type: string
      case_4:
        description: "Optional benchmark case: city-slug:episode-uid"
        required: false
        type: string
      case_5:
        description: "Optional benchmark case: city-slug:episode-uid"
        required: false
        type: string
      models:
        description: "Three comma-separated models for max,med,min profiles"
        required: true
        default: "large-v3-turbo,small.en,base.en"
        type: string
      beam_sizes:
        description: "Three comma-separated beam sizes for max,med,min profiles"
        required: true
        default: "5,3,1"
        type: string
      cpu_threads:
        description: "Three comma-separated CPU thread counts for max,med,min profiles"
        required: true
        default: "4,2,1"
        type: string
      max_minutes:
        description: "Stop starting new benchmark profiles after this many minutes"
        required: true
        default: "330"
        type: string
      profile_timeout_minutes:
        description: "Per city/profile timeout, leaving headroom before the 6-hour job cap"
        required: true
        default: "110"
        type: string

permissions:
  contents: read

concurrency:
  group: asr-bench
  cancel-in-progress: false

jobs:
  asr-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FFMPEG_SHA256: 30d8f18138393081d7fdf95f7006fa132e7b063fd87c0e955652c64a4bc0d52d
      FFMPEG_DIR: /home/runner/.cache/citypods/ffmpeg-static-v1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        # prepare_whisper.py's B2 mirror needs boto3 from the storage extra.
        run: pip install -e ".[asr-bench,storage]" -c constraints/asr.txt

      - name: Restore build state
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .citypods-state
            docs
          key: build-state-${{ github.run_id }}
          restore-keys: |
            build-state-

      - name: Cache static ffmpeg
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-static-linux64-7.1.5-v2

      - name: Install verified static ffmpeg
        # Self-built (scripts/build_ffmpeg_static.sh), vendored to our own B2 bucket -- not an
        # upstream/mirror host. FFMPEG_URL built from the B2 secret rather than hardcoded so it's
        # not duplicated across the workflows that pin ffmpeg (review/22).
        env:
          FFMPEG_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}/deps/ffmpeg/7.1.5/ffmpeg-7.1.5-linux64-static.tar.xz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgnutls30 libopus0 libvpx9 libdav1d7 libmp3lame0
          timeout 300 python scripts/install_static_ffmpeg.py \
            --url "${FFMPEG_URL}" \
            --sha256 "${FFMPEG_SHA256}" \
            --install-dir "${FFMPEG_DIR}"
          "${FFMPEG_DIR}/bin/ffmpeg" -version >/dev/null
          "${FFMPEG_DIR}/bin/ffprobe" -version >/dev/null
          echo "${FFMPEG_DIR}/bin" >> "$GITHUB_PATH"

      - name: Cache ASR models
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/faster-whisper-large-v3-turbo
          key: asr-bench-models-${{ runner.os }}-v1
          restore-keys: |
            asr-bench-models-${{ runner.os }}-

      - name: Prepare Whisper model
        # B2 credentials may only execute the canonical main workflow. A manually selected
        # feature ref can still run the benchmark without the mirror-preparation optimization.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: python scripts/prepare_whisper.py

      - name: Run ASR benchmark
        env:
          # The benchmark may need authenticated public-model downloads, but no earlier action
          # receives this token. An empty ASR_MODEL_PATH keeps each --models value authoritative.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          ASR_MODEL_PATH: ""
          CASE_1: ${{ inputs.case_1 }}
          CASE_2: ${{ inputs.case_2 }}
          CASE_3: ${{ inputs.case_3 }}
          CASE_4: ${{ inputs.case_4 }}
          CASE_5: ${{ inputs.case_5 }}
          MODELS: ${{ inputs.models }}
          BEAM_SIZES: ${{ inputs.beam_sizes }}
          CPU_THREADS: ${{ inputs.cpu_threads }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          PROFILE_TIMEOUT_MINUTES: ${{ inputs.profile_timeout_minutes }}
        run: |
          set -o pipefail

          mkdir -p artifacts
          log="artifacts/asr-bench.txt"
          status=0
          budget_exhausted=0
          labels=(max med min)
          started=$SECONDS
          max_seconds=$((MAX_MINUTES * 60))
          profile_timeout_seconds=$((PROFILE_TIMEOUT_MINUTES * 60))

          IFS=',' read -r -a models <<< "$MODELS"
          IFS=',' read -r -a beam_sizes <<< "$BEAM_SIZES"
          IFS=',' read -r -a cpu_threads <<< "$CPU_THREADS"

          if [ "${#models[@]}" -ne 3 ] || [ "${#beam_sizes[@]}" -ne 3 ] || [ "${#cpu_threads[@]}" -ne 3 ]; then
            echo "::error title=Invalid benchmark profiles::models, beam_sizes, and cpu_threads must each contain exactly three comma-separated values for max,med,min."
            exit 1
          fi

          {
            echo "# ASR benchmark"
            echo
            echo "- Profiles: max, med, min"
            echo "- Models: ${MODELS}"
            echo "- Beam sizes: ${BEAM_SIZES}"
            echo "- CPU threads: ${CPU_THREADS}"
            echo "- New-profile budget: ${MAX_MINUTES} minutes"
            echo "- Per-profile timeout: ${PROFILE_TIMEOUT_MINUTES} minutes"
            echo "- Runner timeout: 350 minutes"
            echo
          } > "$log"

          for case in "$CASE_1" "$CASE_2" "$CASE_3" "$CASE_4" "$CASE_5"; do
            if [ -z "$case" ]; then
              continue
            fi

            city="${case%%:*}"
            uid="${case#*:}"
            if [ -z "$city" ] || [ -z "$uid" ] || [ "$city" = "$uid" ]; then
              echo "::error title=Invalid benchmark case::Expected city-slug:episode-uid, got '${case}'"
              status=1
              continue
            fi

            for i in 0 1 2; do
              label="${labels[$i]}"
              elapsed=$((SECONDS - started))
              remaining=$((max_seconds - elapsed))
              if [ "$remaining" -lt "$profile_timeout_seconds" ]; then
                echo "::warning title=ASR benchmark budget exhausted::Skipping ${case} ${label}; ${remaining}s remain, below the ${profile_timeout_seconds}s per-profile timeout."
                status=1
                budget_exhausted=1
                break
              fi

              model="$(echo "${models[$i]}" | xargs)"
              beam="$(echo "${beam_sizes[$i]}" | xargs)"
              threads="$(echo "${cpu_threads[$i]}" | xargs)"

              {
                echo
                echo "## ${city} / ${uid} (${label})"
                echo
                echo "- Model: ${model}"
                echo "- Beam size: ${beam}"
                echo "- CPU threads: ${threads}"
                echo
              } | tee -a "$log"

              if ! timeout "${PROFILE_TIMEOUT_MINUTES}m" python -m citypods.cli asr-bench \
                --city "$city" \
                --uid "$uid" \
                --models "$model" \
                --beam-size "$beam" \
                --cpu-threads "$threads" 2>&1 | tee -a "$log"; then
                status=1
              fi
            done
            if [ "$budget_exhausted" -eq 1 ]; then
              break
            fi
          done

          cat "$log" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asr-bench-report
          path: artifacts/asr-bench.txt
