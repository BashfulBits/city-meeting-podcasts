name: Audio

# Audio materialization lane (H6b): download → ffmpeg encode → upload to object storage, sharded
# by source_key so concurrent shards own disjoint record files (scoped push_state, no clobber).
# Split out of the combined enrich so it runs on its own concurrency group — never blocking or
# reddening the Pages deploy (deploy.yml), and never sharing a runner with ASR.

on:
  schedule:
    # Offset from the deploy cron (deploy at :00) so audio backfill trails each render.
    - cron: "30 */4 * * *"
  workflow_dispatch:

# Own concurrency group, distinct from `pages` and `asr`: one audio run at a time (its shards run
# in parallel), and a deploy is never canceled by it. Let a running one finish — shards yield
# gracefully when a newer audio run is queued behind them (citypods/run.py _newer_run_queued).
concurrency:
  group: audio
  cancel-in-progress: false

# `actions: read` lets each shard poll the Actions API for a newer queued audio run and yield
# gracefully (issue #63). Asserted statically in tests/test_workflows.py.
permissions:
  contents: read
  actions: read
  packages: read

jobs:
  # Ensure the weekly endpoint-contracts check (contracts.yml) is never racing an active audio
  # run. contracts.yml already waits for audio to finish before probing; this job is the reverse
  # guard: if contracts is mid-run when a new audio cycle starts, audio defers so contracts can
  # complete its Granicus media-fetch without competing for CDN slots (GH#300).
  # Polls for up to 20 minutes; always exits 0 so a stuck contracts run never permanently blocks
  # audio. The matrix shards depend on this job so they don't start until the coast is clear.
  wait-for-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for active endpoint contract runs to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            ACTIVE=$(gh run list --workflow contracts.yml --status in_progress --json databaseId --limit 5 2>/dev/null || echo "[]")
            if [ "$ACTIVE" = "[]" ]; then
              echo "No active contracts runs. Proceeding."
              exit 0
            fi
            echo "[$i/40] contracts.yml is running. Waiting 30 seconds..."
            sleep 30
          done
          echo "Timed out after 20 minutes. Proceeding anyway."

  audio:
    needs: wait-for-contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4 shards by source_key. Disjoint + exhaustive — keep in sync with the `/4` below.
        shard: [0, 1, 2, 3]
    env:
      AUDIO_RUNNER_IMAGE: ghcr.io/bashfulbits/citypods-audio-runner:py312-ffmpeg71-v1
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-18-14-21/ffmpeg-n7.1.4-39-ga5faeca88f-linux64-lgpl-7.1.tar.xz
      FFMPEG_SHA256: bf89442300107bc9c73d4ffb80c1e4482bbde205903fe0f9e3d1de55e6d1140e
      FFMPEG_FALLBACK_DIR: /home/runner/.cache/citypods/ffmpeg-static-v1
      # Lets the shard poll the Actions API and yield gracefully when a newer run is queued behind
      # it. Not auto-exported by Actions, so pass it explicitly. (Guarded by test_workflows.)
      GITHUB_TOKEN: ${{ github.token }}
      # Audio hosting. Set the secrets for whichever backend
      # site_config.defaults.audio_storage_backend selects.
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      # Native Granicus archive media is attempted directly first. An immediate HTTP 403 gets one
      # authenticated retry through the closed Cloudflare Worker while the same provider lease is
      # held. Unset both secrets below to roll back to direct-only (config-only rollback, GH#353).
      GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
      GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      # Latency optimization only: the object bucket is the source of truth for build state
      # (citypods/statesync.py pulls it at start, scoped-pushes owned records at the end), so an
      # evicted cache self-heals from the bucket. Per-shard key so shards don't fight over one entry.
      - name: Restore build state
        uses: actions/cache@v5
        with:
          path: .citypods-state
          key: build-state-audio-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            build-state-

      # The host fallback is cached independently of the GHCR image. It is restored before the pull
      # attempt so a registry outage does not turn into an apt mirror dependency.
      - name: Cache static ffmpeg fallback
        uses: actions/cache@v5
        with:
          path: ${{ env.FFMPEG_FALLBACK_DIR }}
          key: ffmpeg-static-linux64-7.1.4-v1

      - name: Select audio runtime
        id: runtime
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          timeout 30 docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin <<<"${GHCR_TOKEN}" || true
          if timeout 300 docker pull "${AUDIO_RUNNER_IMAGE}" \
            && docker run --rm --entrypoint sh "${AUDIO_RUNNER_IMAGE}" -c \
              'ffmpeg -version >/dev/null && ffprobe -version >/dev/null && python -c "import boto3, citypods"'; then
            echo "mode=container" >> "$GITHUB_OUTPUT"
            echo "Using prebuilt audio runtime ${AUDIO_RUNNER_IMAGE}"
          else
            echo "::warning title=Audio runner image unavailable::Using checksum-pinned static ffmpeg fallback on the host runner."
            timeout 300 python scripts/install_static_ffmpeg.py \
              --url "${FFMPEG_URL}" \
              --sha256 "${FFMPEG_SHA256}" \
              --install-dir "${FFMPEG_FALLBACK_DIR}"
            "${FFMPEG_FALLBACK_DIR}/bin/ffmpeg" -version >/dev/null
            "${FFMPEG_FALLBACK_DIR}/bin/ffprobe" -version >/dev/null
            echo "mode=host" >> "$GITHUB_OUTPUT"
          fi

      # The audio lane never runs ASR. Python installation is needed only on the host fallback;
      # the normal GHCR runtime already contains the storage dependencies.
      - name: Install host fallback
        if: steps.runtime.outputs.mode == 'host'
        run: pip install -e ".[storage]"

      # Materialize audio for this shard's sources only. Bounded by the wall-clock window; yields
      # gracefully (exit 143 after the stop signal) when a newer audio run is queued behind it.
      - name: Audio (shard ${{ matrix.shard }}/4)
        id: audio
        run: |
          # Contract marker for workflow tests: citypods enrich --lane audio --shard ${{ matrix.shard }}/4
          set +e
          mkdir -p h16-evidence
          log="${GITHUB_WORKSPACE}/h16-evidence/audio-${{ matrix.shard }}.log"
          if [ "${{ steps.runtime.outputs.mode }}" = "container" ]; then
            docker run --rm --init \
              --user "$(id -u):$(id -g)" \
              --volume "${GITHUB_WORKSPACE}:/workspace" \
              --workdir /workspace \
              --env HOME=/tmp/citypods-home \
              --env GITHUB_ACTIONS \
              --env GITHUB_ACTOR \
              --env GITHUB_JOB \
              --env GITHUB_REPOSITORY \
              --env GITHUB_RUN_ATTEMPT \
              --env GITHUB_RUN_ID \
              --env GITHUB_RUN_NUMBER \
              --env GITHUB_TOKEN \
              --env GITHUB_WORKFLOW_REF \
              --env B2_ENDPOINT \
              --env B2_KEY_ID \
              --env B2_APP_KEY \
              --env B2_BUCKET \
              --env B2_PUBLIC_BASE_URL \
              --env CLOUDFLARE_ACCOUNT_ID \
              --env R2_ACCESS_KEY_ID \
              --env R2_SECRET_ACCESS_KEY \
              --env R2_BUCKET \
              --env R2_PUBLIC_BASE_URL \
              --env GRANICUS_PROXY_BASE_URL \
              --env GRANICUS_PROXY_TOKEN \
              "${AUDIO_RUNNER_IMAGE}" \
              enrich --lane audio --shard ${{ matrix.shard }}/4 2>&1 | tee "$log"
          else
            PATH="${FFMPEG_FALLBACK_DIR}/bin:${PATH}" \
              python -m citypods.cli enrich --lane audio --shard ${{ matrix.shard }}/4 \
              2>&1 | tee "$log"
          fi
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 143 ] && grep -q "stop: newer build queued behind this run" "$log"; then
            echo "::warning title=Audio yielded to newer run::Shard ${{ matrix.shard }} exited 143 after the graceful-yield stop signal. The queued run will resume."
            exit 0
          fi
          exit "$code"

      - name: Collect H16 run event
        if: always()
        run: |
          mkdir -p h16-evidence
          PYTHONPATH=. python scripts/scan_h16_log.py \
            --log "h16-evidence/audio-${{ matrix.shard }}.log" \
            --output "h16-evidence/secret-scan-${{ matrix.shard }}.json"
          find .citypods-state/run_events -type f \
            -name "*-${GITHUB_RUN_ID}-enrich-audio-${{ matrix.shard }}_4.json" \
            -exec cp {} h16-evidence/ \; 2>/dev/null || true

      - name: Upload H16 shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audio-h16-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: h16-evidence/*.json
          if-no-files-found: warn
          retention-days: 14

  validate-h16:
    if: always()
    needs: audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install report dependencies
        run: pip install -e .

      - name: Download H16 shard evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: audio-h16-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: h16-input
          merge-multiple: true

      - name: Build H16 acceptance report
        run: |
          mkdir -p h16-input
          citypods h16-report \
            --input-dir h16-input \
            --output-dir h16-report \
            --run-id "${GITHUB_RUN_ID}" \
            --expected-shards 4 \
            --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload H16 acceptance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audio-h16-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: h16-report
          if-no-files-found: error
          retention-days: 30
