name: Remedy-unexpected-bodies commands

# `/remedy`, commented on the feed-health audit's own consolidated `unexpected-body` issue,
# re-dispatches remedy-unexpected-bodies.yml for it. audit.yml already dispatches that workflow
# automatically when it creates the issue or adds a new affected-feed row -- see the creation and
# new-row hooks in scripts/audit_feeds.py. It deliberately does not run again for cosmetic refreshes
# or changed detail on an existing row. This command remains available when a maintainer wants to
# force another pass.
#
# Mirrors stale-commands.yml's shape and its permission gate (`citypods.github_permissions`,
# not the possibly-stale `author_association` alone). No pip install needed here --
# `citypods/github_permissions.py` has zero third-party imports.

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: remedy-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  disposition:
    if: >-
      ${{ github.event.issue.pull_request == null &&
        startsWith(github.event.comment.body, '/body-disposition') &&
        github.event.issue.user.login == 'github-actions[bot]' &&
        contains(github.event.issue.body, '<!-- citypods:remedy-p3:binding=') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install storage dependencies
        run: pip install -e ".[storage]" -c constraints/prod.txt
      - name: Check current repository write permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          if ! gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" > actor-permission.json; then
            echo '{"permission":"none"}' > actor-permission.json
          fi
      - name: Record checked P3 disposition under the remedy lease
        id: decision
        env:
          AUDIO_STORAGE_BACKEND: routing
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          PYTHONPATH=. python scripts/remedy_disposition_command.py \
            --event "$GITHUB_EVENT_PATH" \
            --permission actor-permission.json \
            --result disposition-result.json
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "message=✅ Human disposition appended to the remedy ledger." >> "$GITHUB_OUTPUT"
            echo "close_issue=$(jq -r '.close_issue // false' disposition-result.json)" \
              >> "$GITHUB_OUTPUT"
          else
            message=$(jq -r '.error // "decision rejected"' disposition-result.json)
            delimiter=$(uuidgen)
            {
              echo "message<<$delimiter"
              printf '❌ %s\n' "$message"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
            echo "close_issue=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reply with disposition result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.decision.outputs.message }}
        run: gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"

      - name: Close completed disposition issue
        if: steps.decision.outputs.close_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER"

  remedy:
    if: >-
      ${{ github.event.issue.pull_request == null &&
        (github.event.comment.body == '/remedy' || startsWith(github.event.comment.body, '/remedy ')) &&
        contains(github.event.issue.body, '<!-- citypods:feed-health:key=unexpected-body -->') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli

      - name: Validate command
        id: command
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" > actor-permission.json; then
            echo '{"permission":"none"}' > actor-permission.json
          fi
          set +e
          PYTHONPATH=. python scripts/remedy_commands.py --event "$EVENT_PATH" \
            --permission actor-permission.json --out remedy-command.json
          code=$?
          set -e
          jq -r '.comment' remedy-command.json > remedy-command-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file remedy-command-comment.md
          if [ "$code" -ne 0 ]; then
            echo "accepted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "accepted=true" >> "$GITHUB_OUTPUT"

      # The command's own job only needs to re-trigger the real remedy run, not do its work --
      # remedy-unexpected-bodies.yml posts its own full classification-and-PR-link comment on
      # completion, same as the automatic dispatch from audit.yml does.
      - name: Dispatch remedy-unexpected-bodies.yml
        if: steps.command.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh workflow run remedy-unexpected-bodies.yml --repo "$GITHUB_REPOSITORY" \
            -f issue="$ISSUE_NUMBER" -f apply=true

  reopen:
    # `/remedy reopen <decision_id>` on a remedy PR or issue: a maintainer asks for a settled or
    # rejected decision to be reconsidered. It records a P2 `proposed` event with the decision's own
    # hashes; it cannot change policy, evidence or an alias grant, and the next publication pass
    # reopens or updates the artifact within the weekly budget.
    if: >-
      ${{ startsWith(github.event.comment.body, '/remedy reopen ') &&
        github.event.issue.user.login == 'github-actions[bot]' &&
        contains(github.event.issue.body, '<!-- citypods:remedy:v1:') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    concurrency:
      group: remedy-taxonomy-writes
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install storage dependencies
        run: pip install -e ".[storage]" -c constraints/prod.txt
      - name: Fetch the actor's permission and the artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          if ! gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" > actor-permission.json; then
            echo '{"permission":"none"}' > actor-permission.json
          fi
          if [ "$IS_PR" = "true" ]; then
            gh api "repos/$REPOSITORY/pulls/$ISSUE_NUMBER" > artifact.json
          fi
      - name: Record the reopening
        id: reopen
        env:
          AUDIO_STORAGE_BACKEND: routing
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPOSITORY: ${{ github.repository }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          set +e
          artifact=()
          if [ "$IS_PR" = "true" ]; then artifact=(--artifact artifact.json); fi
          PYTHONPATH=. python scripts/remedy_feedback.py reopen             --event "$GITHUB_EVENT_PATH" --permission actor-permission.json             --repository "$REPOSITORY" "${artifact[@]}" --result reopen-result.json
          code=$?
          set -e
          if [ "$(jq -r '.accepted' reopen-result.json)" = "true" ]; then
            echo "message=✅ Reopening recorded. The next publication pass will reopen or update this within the weekly budget." >> "$GITHUB_OUTPUT"
          else
            delimiter=$(uuidgen)
            {
              echo "message<<$delimiter"
              printf '❌ %s\n' "$(jq -r '.error // "reopen rejected"' reopen-result.json)"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi
          exit "$code"
      - name: Reply with the result
        if: always() && steps.reopen.outputs.message != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.reopen.outputs.message }}
        run: gh issue comment "$ISSUE_NUMBER" --body "$MESSAGE"
