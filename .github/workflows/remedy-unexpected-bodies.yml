name: Remedy unexpected bodies

# Dispatched automatically by audit.yml the moment it *creates* a new consolidated
# `unexpected-body` issue (not on later updates to an already-open one -- see
# `on_issue_created` in scripts/audit_feeds.py), and can also be run manually. Collects the rows
# behind the finding (one provider fetch, reusing the audit's own detection), asks an LLM to
# classify each label, re-validates every proposal against that evidence, applies what survives,
# and reports back on the issue with a link to the opened PR.
#
# Deliberately *not* part of audit.yml: this job needs LLM provider credentials and write access,
# neither of which the read-only daily audit should carry.
#
# SECURITY: this stays `workflow_dispatch`-only rather than also listening for `issues: opened`.
# The latter fires for every issue opened by anyone with issue-create rights on this repo -- i.e.
# any GitHub user, on a public repo -- with an entirely attacker-controlled body, which would need
# the workflow itself to re-verify the triggering issue's author and content before trusting it.
# `workflow_dispatch` has no such surface: it can only be invoked by something already holding
# `actions: write` on this repo (a human maintainer, or audit.yml's own job using its own
# `GH_TOKEN` -- see the `gh workflow run` call in `_dispatch_remedy_workflow()`), so there is
# nothing here to spoof.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Feed-health issue number to comment on / resolve"
        type: string
        default: ""
      apply:
        description: "Apply accepted proposals, verify, and open a PR (otherwise report only)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: remedy-unexpected-bodies-${{ inputs.issue || github.run_id }}
  cancel-in-progress: true

jobs:
  remedy:
    timeout-minutes: 58
    runs-on: ubuntu-latest
    env:
      FFMPEG_SHA256: 30d8f18138393081d7fdf95f7006fa132e7b063fd87c0e955652c64a4bc0d52d
      FFMPEG_DIR: /home/runner/.cache/citypods/ffmpeg-static-v1
    # GitHub Actions requires literal permission values. This workflow accepts an apply request,
    # which pushes a branch and opens a PR, so it keeps the required static write scopes. The
    # script itself only mutates when `--apply` is passed, and dispatch is limited to writers.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Set response deadline
        run: echo "REMEDY_DEADLINE_EPOCH=$(( $(date +%s) + 3300 ))" >> "$GITHUB_ENV"

      # workflow_dispatch lets the caller pick any branch, tag, or commit, and this job runs the
      # checked-out code with provider, storage, and LLM credentials. Refuse anything but main
      # rather than executing branch-controlled code against those secrets.
      - name: Require main
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "::error::this workflow may only be dispatched from main (got $GIT_REF)"
            exit 1
          fi

      # `persist-credentials: false` is repo-wide policy: every job runs `pip install -e .`, so a
      # compromised setup/package script must never find a token in the git config. The apply path
      # authenticates with `gh auth setup-git` immediately before its push instead.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        timeout-minutes: 8
        run: |
          pip install -e ".[dev,storage,wer,llm]" -c constraints/dev.txt
          pip install "scikit-learn>=1.5" -c constraints/chapter-research.txt

      - name: Cache pinned ffmpeg
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-static-linux64-7.1.5-v2

      - name: Install pinned ffmpeg (matches production's audio.yml pin)
        timeout-minutes: 4
        # Self-built (scripts/build_ffmpeg_static.sh), vendored to our own B2 bucket -- not an
        # upstream/mirror host. FFMPEG_URL built from the B2 secret rather than hardcoded so it's
        # not duplicated across the 7 workflows that pin ffmpeg (review/22).
        env:
          FFMPEG_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}/deps/ffmpeg/7.1.5/ffmpeg-7.1.5-linux64-static.tar.xz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgnutls30 libopus0 libvpx9 libdav1d7 libmp3lame0
          python scripts/install_static_ffmpeg.py \
            --url "${FFMPEG_URL}" \
            --sha256 "${FFMPEG_SHA256}" \
            --install-dir "${FFMPEG_DIR}"
          "${FFMPEG_DIR}/bin/ffmpeg" -version
          "${FFMPEG_DIR}/bin/ffprobe" -version

      - name: Install OCR runtime
        timeout-minutes: 4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils tesseract-ocr
          pdftocairo -v
          tesseract --version

      # Read-only: the same fetch and the same detection the daily audit runs, with the rows
      # behind each unexpected-body finding written out instead of discarded.
      - name: Collect unexpected-body evidence
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
          SWAGIT_PROXY_BASE_URL: ${{ secrets.SWAGIT_PROXY_BASE_URL }}
          SWAGIT_PROXY_TOKEN: ${{ secrets.SWAGIT_PROXY_TOKEN }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ISSUE_INPUT: ${{ inputs.issue }}
        run: |
          args=(--dry-run --unexpected-body-evidence unexpected-body-evidence.json)
          if [ -n "$ISSUE_INPUT" ]; then
            args+=(--issue "$ISSUE_INPUT")
          fi
          PYTHONPATH=. python scripts/audit_feeds.py "${args[@]}"

      - name: Classify and report
        id: classify
        timeout-minutes: 40
        env:
          # Direct provider HTTP may use AI Gateway analytics, never the dispatch Worker.
          LLM_SAFE_DIAGNOSTICS: "1"
          GH_TOKEN: ${{ github.token }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID || 'citypods-dispatch' }}
          AI_GATEWAY_AUTH_TOKEN: ${{ secrets.AI_GATEWAY_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_API_KEY_SECONDARY: ${{ secrets.MISTRAL_API_KEY_SECONDARY }}
          # Free-form dispatch inputs: pass through env, never inline them into `run:` shell text.
          ISSUE_INPUT: ${{ inputs.issue }}
          APPLY_INPUT: ${{ inputs.apply }}
        run: |
          args=(--evidence-file unexpected-body-evidence.json --output remedy-report.md)
          if [ -n "$ISSUE_INPUT" ]; then
            args+=(--issue "$ISSUE_INPUT")
          fi
          if [ "$APPLY_INPUT" = "true" ]; then
            args+=(--apply)
          fi
          remaining=$(( REMEDY_DEADLINE_EPOCH - $(date +%s) ))
          if [ "$remaining" -le 0 ]; then exit 1; fi
          export PATH="${FFMPEG_DIR}/bin:${PATH}" PYTHONPATH=.
          timeout --signal=TERM --kill-after=10 "${remaining}s" \
            python scripts/remedy_unexpected_bodies.py "${args[@]}"

      - name: Report interrupted or failed execution
        if: always() && inputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_INPUT: ${{ inputs.issue }}
        run: |
          [[ "$ISSUE_INPUT" =~ ^[0-9]+$ ]] || exit 1
          if [ ! -f remedy-comment-posted ]; then
            python - <<'PYREPORT'
          import os
          from pathlib import Path
          report = Path("remedy-report.md")
          text = report.read_text()[:45000] if report.exists() else "No classifications completed."
          run = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
          run += os.environ['GITHUB_RUN_ID']
          Path("remedy-fallback.md").write_text(
              "### Automated remedy did not finish\n\n"
              "The run failed or reached its time limit before confirming a final result. "
              "See the partial report below and the run log for verification/PR errors.\n\n"
              + text + f"\n\n[Run and full evidence]({run})"
          )
          PYREPORT
            gh issue comment "$ISSUE_INPUT" --body-file remedy-fallback.md
          fi

      - name: Publish report to the job summary
        if: always()
        run: |
          if [ -f remedy-report.md ]; then
            cat remedy-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unexpected-body-remedy
          path: |
            unexpected-body-evidence.json
            remedy-report.md
          if-no-files-found: ignore
