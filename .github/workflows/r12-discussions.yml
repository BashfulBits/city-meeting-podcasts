name: City request Discussions intake

on:
  discussion:
    types: [created]

permissions:
  contents: read
  discussions: write
  issues: write

jobs:
  intake:
    if: ${{ github.event.discussion.category.name == 'City requests' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Create canonical add-city issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/r12_discussion_intake.py --event "$GITHUB_EVENT_PATH" --out issue-payload.json
          gh api --method POST "repos/${{ github.repository }}/issues" \
            --input issue-payload.json > issue.json
          issue_url=$(jq -r .html_url issue.json)
          discussion_id=$(jq -r .discussion.node_id "$GITHUB_EVENT_PATH")
          gh api graphql \
            -f query='mutation($discussionId:ID!,$body:String!){addDiscussionComment(input:{discussionId:$discussionId,body:$body}){comment{id}}}' \
            -f discussionId="$discussion_id" \
            -f body="Your request is now tracked in the canonical GitHub issue: $issue_url"
