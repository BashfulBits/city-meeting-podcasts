name: LLM Tag Calibration Review

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

concurrency:
  # Shared with llm-tag-review-ingest.yml: both workflows do a full pull/mutate/push of the same
  # state/llm_evaluation.json snapshot with no merge-on-write, so any overlap between them can
  # silently drop a recorded review decision. One group serializes every writer.
  group: llm-evaluation-state
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Package R5 unified tag calibration issues
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: citypods llm-evaluation package --config-dir config --out-dir llm-review

      - name: Upload calibration report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llm-tag-calibration-${{ github.run_id }}
          path: llm-review
          retention-days: 90

      - name: Publish R5 review batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/publish_review_batch.py \
            --manifest llm-review/review-batch.json \
            --family r5 --label llm-calibration-review \
            --parent-title "R5 unified tag calibration digest" \
            --child-title "R5 unified tag sample {candidate_id}" | tee -a "$GITHUB_STEP_SUMMARY"
