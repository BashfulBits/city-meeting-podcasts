name: LLM Tag Calibration Review

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

concurrency:
  group: llm-tag-review
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Package R5 LLM tag calibration issues
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: citypods llm-evaluation package --config-dir config --out-dir llm-review

      - name: Upload calibration report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llm-tag-calibration-${{ github.run_id }}
          path: llm-review
          retention-days: 90

      - name: Open or update digest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="R5 LLM tag calibration digest"
          existing=$(gh issue list --state open --search "in:title $title" --json number,title \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)] | .[0].number // empty')
          if [ -z "$existing" ]; then
            parent_url=$(gh issue create --title "$title" --body-file llm-review/parent.md)
            parent=$(printf '%s' "$parent_url" | awk -F/ '{print $NF}')
          else
            parent="$existing"
            gh issue edit "$parent" --body-file llm-review/parent.md
          fi
          jq -c '.children[]?' llm-review/review-batch.json | while read -r row; do
            candidate_id=$(printf '%s' "$row" | jq -r '.candidate_id')
            body_file=$(printf '%s' "$row" | jq -r '.body_file')
            title="R5 LLM tag sample $candidate_id"
            existing_child=$(gh issue list --state open --search "in:title $title" --json number,title \
              | jq -r --arg title "$title" '[.[] | select(.title == $title)] | .[0].number // empty')
            printf '\n\nParent issue: #%s\n' "$parent" >> "$body_file"
            if [ -n "$existing_child" ]; then
              gh issue edit "$existing_child" --body-file "$body_file"
            else
              gh issue create --title "$title" --body-file "$body_file" >/dev/null
            fi
          done
