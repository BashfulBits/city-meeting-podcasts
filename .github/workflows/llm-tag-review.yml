name: LLM Tag Calibration Review

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

concurrency:
  # Shared with llm-tag-review-ingest.yml: both workflows do a full pull/mutate/push of the same
  # state/llm_evaluation.json snapshot with no merge-on-write, so any overlap between them can
  # silently drop a recorded review decision. One group serializes every writer.
  group: llm-evaluation-state
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Install pinned gh CLI
        uses: ${{ github.repository }}/.github/actions/setup-gh-cli@${{ github.sha }}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Package R5 LLM tag calibration issues
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: citypods llm-evaluation package --config-dir config --out-dir llm-review

      - name: Upload calibration report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llm-tag-calibration-${{ github.run_id }}
          path: llm-review
          retention-days: 90

      - name: Ensure the calibration-review label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create llm-calibration-review --color 5319e7 --force \
            --description "Bot-managed R5 LLM tag calibration review issue (do not apply manually)"

      - name: Open or update digest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The label -- not the title -- is this workflow's trust boundary: applying a label
          # requires triage-or-above repo permission, so an arbitrary public issue can never be
          # picked up here or by llm-tag-review-ingest.yml's scheduled sweep merely by matching a
          # guessable title string.
          title="R5 LLM tag calibration digest"
          existing=$(gh issue list --state open --label llm-calibration-review \
            --search "in:title $title" --json number,title \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)] | .[0].number // empty')
          if [ -z "$existing" ]; then
            parent_url=$(gh issue create --title "$title" --label llm-calibration-review \
              --body-file llm-review/parent.md)
            parent=$(printf '%s' "$parent_url" | awk -F/ '{print $NF}')
          else
            parent="$existing"
            gh issue edit "$parent" --body-file llm-review/parent.md
          fi
          # Native sub-issues (rather than a body-text convention) make the review batch
          # visible in GitHub's issue hierarchy and Project progress fields.  Keep this
          # idempotent because the same unreviewed candidate is re-packaged weekly.
          native_children=$(gh issue view "$parent" --json subIssues --jq '[.subIssues.nodes[].number]')
          attach_child() {
            child="$1"
            if ! jq -e --argjson child "$child" 'index($child) != null' \
              <<<"$native_children" >/dev/null; then
              gh issue edit "$parent" --add-sub-issue "$child"
              native_children=$(jq --argjson child "$child" '. + [$child]' <<<"$native_children")
            fi
          }
          jq -c '.children[]?' llm-review/review-batch.json | while read -r row; do
            candidate_id=$(printf '%s' "$row" | jq -r '.candidate_id')
            body_file=$(printf '%s' "$row" | jq -r '.body_file')
            title="R5 LLM tag sample $candidate_id"
            existing_child=$(gh issue list --state open --label llm-calibration-review \
              --search "in:title $title" --json number,title \
              | jq -r --arg title "$title" '[.[] | select(.title == $title)] | .[0].number // empty')
            if [ -n "$existing_child" ]; then
              child="$existing_child"
              gh issue edit "$existing_child" --body-file "$body_file"
            else
              child_url=$(gh issue create --title "$title" --label llm-calibration-review \
                --body-file "$body_file")
              child=$(printf '%s' "$child_url" | awk -F/ '{print $NF}')
            fi
            attach_child "$child"
          done
