name: Reconcile orphaned v1 LLM jobs

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply B2 writes and purge obsolete R2 records (unchecked = dry-run)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: llm-deferred-sweep
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_RECLAIM_ACCESS_KEY: ${{ secrets.R2_RECLAIM_ACCESS_KEY }}
      R2_RECLAIM_SECRET_ACCESS_KEY: ${{ secrets.R2_RECLAIM_SECRET_ACCESS_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_API_KEY_SECONDARY: ${{ secrets.MISTRAL_API_KEY_SECONDARY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_DISPATCH_URL: ${{ secrets.LLM_DISPATCH_URL }}
      LLM_DISPATCH_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_AUTH_TOKEN }}
      LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
      LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt

      - name: Run reconciliation
        run: |
          FLAGS="--apply"
          if [ "${{ inputs.apply }}" != "true" ]; then
            FLAGS="--dry-run"
          fi
          python scripts/reconcile_v1_llm_jobs.py $FLAGS --bucket citypods-llm-dispatch
