name: PR Preview

# Builds the site for a pull request so reviewers can inspect generated output
# before merge. GitHub Pages has no native per-PR URL, so the built docs/ is
# uploaded as a downloadable artifact and linked in a PR comment. (A live preview
# URL would require a third-party host such as Cloudflare Pages / Netlify.)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Rapid pushes to the same PR would otherwise run overlapping preview jobs that race on
# artifact upload / PR comment update.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -e . -c constraints/prod.txt

      # Read-only restore of the record store the production deploy caches on `main`
      # (`build-state-*`, ~8 MiB). No B2 creds needed — a PR workflow can read its base branch's
      # Actions caches. This gives `--no-refresh` real records to render; on a cache miss (first run
      # / eviction) the render is empty-but-valid (it still verifies the build/render flow).
      - name: Restore build state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Match the path set deploy.yml caches under, so a restore-keys hit extracts cleanly.
          # (docs/ is harmless here — the render below overwrites it.)
          path: |
            .citypods-state
            docs
          key: build-state-preview-${{ github.run_id }}
          restore-keys: |
            build-state-

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        continue-on-error: true

      - name: Build feeds
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url || 'https://preview.example' }}
        # Render-only AND --no-refresh: render feeds + pages purely from the restored record store,
        # making NO provider connections. The preview verifies the build/render flow against the
        # last-known state; it does not validate live provider URLs (that's contracts.yml). This keeps
        # the preview fast and immune to provider outages — live fetching only ever timed out and
        # failed it (e.g. granicus connection timeouts), without adding value.
        run: citypods build --phase render --no-refresh

      - name: Upload preview artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-preview
          path: docs

      - name: Comment with preview link
        # Fork PRs get a read-only GITHUB_TOKEN regardless of the permissions block above, so
        # posting the comment fails with "Resource not accessible by integration". The preview
        # itself still built and uploaded — don't fail the check over the cosmetic comment.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const body = [
              '📦 **Site preview built**',
              '',
              `Download the generated \`docs/\` from the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) (artifact: \`site-preview\`).`,
              'Unzip and run `python -m http.server` inside it to browse locally.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.user.type === 'Bot' && c.body.includes('Site preview built'));
            if (prev) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
