name: Availability digest

# Weekly review digest for empty-recording candidates (H16 PR3b, GH#353). PR3a durably classifies a
# meeting's source media as suspected/confirmed empty and withholds it from the feeds; this job turns
# those withheld empties into a bounded, low-bitrate review bundle (untrimmed + silence-trimmed audio
# proxies + evidence JSON) and opens/updates ONE rolling digest issue — only when new/changed
# candidates exist. Network-touching (it re-fetches sources to encode the proxies), so it is its own
# scheduled job, not part of PR CI.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC (after the weekly endpoint-contracts probe at 06:30)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: availability-digest
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    # A stuck proxy re-fetch/encode must not hold the `availability-digest` concurrency slot
    # indefinitely (CR2-GH-05).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The proxy encode opens Granicus/Swagit media connections; running it alongside an active
      # audio.yml OR granicus-probe.yml cycle (they share the `group: audio` concurrency slot,
      # CR2-GH-19) is the primary cause of HTTP 403 throttling (GH#300). Poll for up to an hour,
      # then proceed anyway so a stuck run never permanently blocks the weekly digest. Mirrors
      # contracts.yml's equivalent wait loop.
      - name: Wait for active audio runs to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            busy=false
            failed=false
            for workflow in audio.yml granicus-probe.yml; do
              for status in in_progress queued; do
                # A gh API/auth/network error must not be masked as "no active runs" (CR2-GH-08) --
                # that would let the loop fall through to the proxy re-fetch while a run might
                # still be active. Retry instead of treating a failed check as empty.
                if ! RESULT=$(gh run list --workflow "$workflow" --status "$status" \
                    --json databaseId --limit 5 2>/tmp/gh-run-list.err); then
                  echo "[$i/30] gh run list ($workflow $status) failed, will retry: $(cat /tmp/gh-run-list.err)"
                  failed=true
                elif [ "$RESULT" != "[]" ]; then
                  busy=true
                fi
              done
            done
            if [ "$failed" = "false" ] && [ "$busy" = "false" ]; then
              echo "No active or queued audio/granicus-probe runs. Proceeding."
              exit 0
            fi
            echo "[$i/30] waiting on audio.yml/granicus-probe.yml (busy=$busy failed=$failed). Waiting 2 minutes..."
            sleep 120
          done
          echo "Timed out after 60 minutes. Proceeding anyway."

      - name: Build availability digest
        id: digest
        env:
          # Durable state lives in the object bucket (state-as-truth); the script pulls it to
          # read the persisted media-availability verdicts. Set the secrets for whichever
          # backend site_config.defaults.audio_storage_backend selects. Scoped to this step, not
          # job-level (CR2-GH-16/MR-GH-02) -- checkout/setup-python/install/ffmpeg/the wait loop
          # never touch storage or the Granicus proxy.
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          # The proxy re-fetch hits native Granicus media, so it gets the same authenticated
          # Worker fallback the audio lane uses to recover an HTTP 403.
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
          SWAGIT_PROXY_BASE_URL: ${{ secrets.SWAGIT_PROXY_BASE_URL }}
          SWAGIT_PROXY_TOKEN: ${{ secrets.SWAGIT_PROXY_TOKEN }}
        run: |
          python scripts/availability_digest.py \
            --pull \
            --out availability-digest \
            --limit 8
          echo "has_candidates=$(cat availability-digest/has_candidates 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload evidence bundle
        if: steps.digest.outputs.has_candidates == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: availability-evidence-${{ github.run_id }}
          path: availability-digest/availability-evidence.zip
          if-no-files-found: warn

      # Open or update ONE rolling digest issue. The artifact URL is appended so reviewers can grab
      # the proxies; the body itself never contains a signed/credential-bearing URL (the evidence
      # only carries the redacted source identity + the public canonical watch page).
      - name: Open or update digest issue
        if: steps.digest.outputs.has_candidates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="H16 empty-recording review digest"
          ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '\n\n> Evidence artifact: %s\n' "$ARTIFACT_URL" >> availability-digest/issue-body.md
          EXISTING=$(gh issue list --state open --search "in:title $TITLE" --json number,title 2>/dev/null \
            | jq -r --arg title "$TITLE" '[.[] | select(.title == $title)] | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file availability-digest/issue-body.md
            echo "Updated digest issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file availability-digest/issue-body.md
            echo "Opened a new digest issue"
          fi

      # Only mark candidates as digested once the issue publish above has actually succeeded
      # (this step doesn't run at all if it failed), so a publish failure can't silently mark
      # evidence as digested with nothing published for reviewers to see.
      - name: Push digest state
        if: steps.digest.outputs.has_candidates == 'true'
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: python scripts/availability_digest.py --push-only --out availability-digest
