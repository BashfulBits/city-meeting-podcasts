name: ASR Worker Report

on:
  schedule:
    - cron: "42 14 * * *"
  workflow_dispatch:
    inputs:
      recent:
        description: "Also list this many recent raw telemetry samples (source/uid/duration/outcome), for identifying which episode a manual canary claimed"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]"

      - name: Build ASR worker report
        env:
          RECENT: ${{ github.event.inputs.recent || '0' }}
        run: python scripts/compute/report_workers.py --markdown --recent "$RECENT" | tee "$GITHUB_STEP_SUMMARY"
