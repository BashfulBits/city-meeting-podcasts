name: LLM deferred sweep

# R13's deferred-request registry (citypods/compute/llm_deferred.py) holds deferred-direct and
# genuine dispatch handles. V2 reads and legacy queue-only submissions are bulked; v1 remains on
# its existing temporary singleton reap path while it drains. The job persists completed results
# and prunes expired registry records; each run is a short observation/retry pass.
#
# Scheduled hourly (review/58 B4/WP5). The six-hourly cadence ran only 21 of 28 scheduled times
# with a median start delay of 201 minutes, so results were collected about three times a day and
# waited 6-12 h before a later lane could use them. Hourly gives GitHub more chances to start
# runs and caps collection lag near one interval. Cost: about 20 more terminal-feed/poll
# calls a day. Minute :57 is unused by every other scheduled workflow.
#
# Wall-clock budget is 45 minutes so a run does not crowd the next hour's: the sweep's own
# --run-time-budget-minutes (32) < step timeout (41) < job timeout (45). The 9-minute gap covers
# an in-flight chunk plus final index writes (deadline checks run between chunks); the job's spare
# 4 minutes cover setup before and telemetry after the sweep step. Reaching the budget is a
# clean exit 0 with work left deferred (deferred is not failed); the concurrency group below never
# cancels a running sweep, so a late-starting run simply queues behind it.
# DeepSeek's off-peak window (16:30 UTC, review/27 section 5.3) is covered by the 17:57 run.

on:
  schedule:
    - cron: "57 * * * *" # hourly; WP5 of review/58
  workflow_dispatch:
    inputs:
      pending_audit_limit:
        description: "Pending recipes to verify; 1000 normally, up to 20000 for catch-up"
        required: false
        type: number
        default: 1000
      repair_index:
        description: "Rebuild B2 pointer index (--repair-index)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: llm-deferred-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # 45-minute wall-clock budget: sweep budget 32 < step timeout 41 < job timeout 45.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt

      - name: Capture starting LLM worker state
        env:
          CITYPODS_LLM_SUBMISSION_TELEMETRY_FILE: ${{ runner.temp }}/llm-submission-telemetry.jsonl
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
        run: |
          echo "CITYPODS_LLM_SUBMISSION_TELEMETRY_FILE=$CITYPODS_LLM_SUBMISSION_TELEMETRY_FILE" >> "$GITHUB_ENV"
          python scripts/llm_submission_telemetry.py snapshot start

      - name: Reconcile pending deferred/dispatched LLM requests
        # Fail loudly instead of being cancelled. A JOB-level timeout cancels the run, which
        # GitHub reports as a grey "cancelled" -- skipping the summary report where submit_failed
        # surfaces. A STEP-level timeout below the job's fails the step, so the run goes red and
        # post-steps still execute.
        timeout-minutes: 41
        env:
          # Surface phase telemetry even when GitHub cancels the job during a storage read.
          PYTHONUNBUFFERED: "1"
          PENDING_AUDIT_LIMIT: ${{ inputs.pending_audit_limit || 1000 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Direct provider calls route via the AI Gateway for observability; without this
          # token an authenticated gateway rejects them (see citypods/compute/llm.py).
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID || 'citypods-dispatch' }}
          AI_GATEWAY_AUTH_TOKEN: ${{ secrets.AI_GATEWAY_AUTH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          if [ "${{ inputs.repair_index }}" = "true" ]; then
            python scripts/llm_deferred_sweep.py --repair-index
          else
            python scripts/llm_deferred_sweep.py --run-time-budget-minutes 32 \
              --pending-audit-limit "$PENDING_AUDIT_LIMIT"
          fi

      - name: Summarize LLM submission telemetry
        if: always()
        env:
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
        run: |
          python scripts/llm_submission_telemetry.py snapshot end
          python scripts/llm_submission_telemetry.py report

      - name: Upload LLM submission telemetry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: llm-submission-telemetry-${{ github.run_id }}
          path: ${{ runner.temp }}/llm-submission-telemetry.jsonl
          if-no-files-found: ignore
          retention-days: 30
