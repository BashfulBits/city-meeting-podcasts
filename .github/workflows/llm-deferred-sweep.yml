name: LLM deferred sweep

# R13's deferred-request registry (citypods/compute/llm_deferred.py) holds deferred-direct and
# genuine dispatch handles. V2 reads and legacy queue-only submissions are bulked; v1 remains on
# its existing temporary singleton reap path while it drains. The job persists completed results
# and prunes expired registry records, but its normal six-hour run is a short observation/retry pass.
#
# Scheduled every six hours, anchored so one run still lands at 17:30 UTC -- an hour after
# DeepSeek's 16:30 off-peak window opens (review/27 §5.3), which the previous once-daily cron
# existed to catch. That off-peak run is preserved exactly; the other three are what shortened the
# observation lag.
#
# Raised from once daily on 2026-08-27. A v2 job completes within minutes of dispatch but was only
# *observed* by this sweep, so a daily cadence left completions pending for up to ~23h. That is a
# compounding cost, not just latency: the deferred registry this sweep must list, and the
# coordinator's `jobs` table, both stay near their maximum between runs. Six-hourly keeps both
# small, which makes each run cheaper -- and it compounds with the consumption ack (review/44),
# since a job's DO row and B2 objects are only released once a sweep has actually observed it.
# If a future route's discount/quota window can't be caught on this cadence, add another cron entry
# timed to that window rather than tightening this one for everything.

on:
  schedule:
    - cron: "30 5,11,17,23 * * *" # every 6h; the 17:30 run is 1h into DeepSeek's off-peak window
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: llm-deferred-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # The v1 registry is temporary but has a large legacy tail. Keep 15 minutes for Actions
    # teardown after the 90-minute reap pass rather than cancelling a verified B2 completion.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt

      - name: Reconcile pending deferred/dispatched LLM requests
        env:
          # Surface phase telemetry even when GitHub cancels the job during a storage read.
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_API_KEY_SECONDARY: ${{ secrets.MISTRAL_API_KEY_SECONDARY }}
          LLM_DISPATCH_URL: ${{ secrets.LLM_DISPATCH_URL }}
          LLM_DISPATCH_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_AUTH_TOKEN }}
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Direct provider calls route via the AI Gateway for observability; without this
          # token an authenticated gateway rejects them (see citypods/compute/llm.py).
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID || 'citypods-dispatch' }}
          AI_GATEWAY_AUTH_TOKEN: ${{ secrets.AI_GATEWAY_AUTH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: python scripts/llm_deferred_sweep.py --run-time-budget-minutes 90
