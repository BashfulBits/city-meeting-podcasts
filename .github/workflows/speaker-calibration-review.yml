name: R7 Speaker Calibration Review

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

concurrency:
  group: r7-speaker-evaluation-state
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt
      - name: Package bounded R7 speaker review issues
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: python -m citypods.cli speaker-review package --out-dir speaker-review
      - name: Publish R7 review batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_review_batch.py \
            --manifest speaker-review/review-batch.json \
            --family r7 --label speaker-calibration-review \
            --parent-title "R7 speaker calibration digest" \
            --child-title "R7 speaker review {candidate_id}" | tee -a "$GITHUB_STEP_SUMMARY"
