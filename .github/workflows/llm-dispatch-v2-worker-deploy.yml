name: Deploy LLM dispatch v2 Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/llm-dispatch-v2/src/**"
      - "workers/llm-dispatch-v2/wrangler.jsonc"
      - "workers/llm-dispatch-v2/package.json"
      - "workers/llm-dispatch-v2/package-lock.json"
      - "config/provider_limits.yml"
      - "config/site_config.yml"
      - "scripts/compile_llm_limits.py"
      - "scripts/compile_llm_lanes.py"
      - ".github/workflows/llm-dispatch-v2-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-dispatch-v2-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pyyaml -c constraints/prod.txt

      - name: Compile LLM limits
        run: python scripts/compile_llm_limits.py

      - name: Check for dispatch_limits.json drift
        run: |
          if ! git diff --exit-code workers/llm-dispatch-v2/src/dispatch_limits.json; then
            echo "::error::dispatch_limits.json is out of date — recompile with 'python scripts/compile_llm_limits.py' and commit both the YAML and the JSON together."
            exit 1
          fi

      # The per-purpose ingress reservation map is compiled from site_config.yml's `llm_lanes`
      # block rather than hand-maintained as a wrangler var. The hand-maintained version had
      # drifted to reserve capacity under purposes no client sends, silently starving the real
      # lanes; this gate is what keeps the two halves of that contract in step.
      - name: Compile ingress purpose reservations
        run: python scripts/compile_llm_lanes.py --check

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Test Worker
        working-directory: workers/llm-dispatch-v2
        run: npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_LLM_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/llm-dispatch-v2
          wranglerVersion: "4.129.0"
