name: ASR Quality Eval

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      sample_limit:
        description: "Maximum H15 samples to evaluate"
        required: false
        default: "8"

concurrency:
  group: asr-quality-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      # H15 sample/evaluate clips candidate audio with ffmpeg before scoring -- without this the
      # job silently "succeeds" while every sample fails with FileNotFoundError: 'ffmpeg' and
      # evaluate_samples() catches it per-sample (by design, so one bad sample can't sink a whole
      # batch), leaving the rollups ledger empty and the weekly review issue with nothing to
      # show. That's exactly what happened here for 3 consecutive weeks (2026-07-13/20/27) before
      # anyone noticed, since the job's own exit code stayed green throughout. Same
      # checksum-pinned static ffmpeg as asr.yml/audio.yml, not the Ubuntu package mirror.
      FFMPEG_SHA256: 30d8f18138393081d7fdf95f7006fa132e7b063fd87c0e955652c64a4bc0d52d
      FFMPEG_DIR: /home/runner/.cache/citypods/ffmpeg-static-v1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # asr-align2 (H15 L2's independent CTC judge) folds into the same asr.txt lock as `asr` --
        # torch/torchaudio are already a transitive pin there via WhisperX, so torchcodec is
        # the only incremental download this adds.
        run: pip install -e ".[asr,asr-align2,storage]" -c constraints/asr.txt

      - name: Cache static ffmpeg
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-static-linux64-7.1.5-v2

      - name: Install verified static ffmpeg
        # Self-built (scripts/build_ffmpeg_static.sh), vendored to our own B2 bucket -- not an
        # upstream/mirror host. FFMPEG_URL built from the B2 secret rather than hardcoded so it's
        # not duplicated across the workflows that pin ffmpeg (review/22).
        env:
          FFMPEG_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}/deps/ffmpeg/7.1.5/ffmpeg-7.1.5-linux64-static.tar.xz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgnutls30 libopus0 libvpx9 libdav1d7 libmp3lame0
          timeout 300 python scripts/install_static_ffmpeg.py \
            --url "${FFMPEG_URL}" \
            --sha256 "${FFMPEG_SHA256}" \
            --install-dir "${FFMPEG_DIR}"
          "${FFMPEG_DIR}/bin/ffmpeg" -version >/dev/null
          "${FFMPEG_DIR}/bin/ffprobe" -version >/dev/null
          echo "${FFMPEG_DIR}/bin" >> "$GITHUB_PATH"

      - name: Cache L2 CTC aligner model (MMS_FA)
        # ~1.2 GB wav2vec2 checkpoint, downloaded once via torch.hub on first ctc_fit() call.
        # Fixed key (not content-hashed): the checkpoint URL is stable; bump the -vN suffix only
        # if citypods/ctc_align.py switches bundles.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: mms-fa-checkpoint-v1

      - name: Sample and evaluate H15 candidates
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          SAMPLE_LIMIT: ${{ github.event.inputs.sample_limit || '8' }}
        run: |
          mkdir -p h15-eval
          citypods transcript-quality sample --out h15-eval/samples.json --limit "$SAMPLE_LIMIT"
          citypods transcript-quality evaluate \
            --config-dir config \
            --manifest h15-eval/samples.json \
            --out-dir h15-eval/artifacts

      - name: Sanity-check reviewer-typed gold corrections
        # H15 Layer 3: scores any not-yet-checked "Neither usable" corrections against their
        # audio with the same independent CTC aligner used above — deliberately placed here
        # (not the cheap weekly review workflow) since it needs the same torch/torchaudio stack
        # and audio download this job already pays for.
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: citypods transcript-quality check-gold-corrections --config-dir config

      - name: Upload H15 evaluation artifacts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: h15-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: h15-eval
          retention-days: 14
