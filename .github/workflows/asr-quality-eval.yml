name: ASR Quality Eval

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      sample_limit:
        description: "Maximum H15 samples to evaluate"
        required: false
        default: "8"

concurrency:
  group: asr-quality-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # asr-align2 (H15 L2's independent CTC judge) folds into the same asr.txt lock as `asr` --
        # torch/torchaudio are already a transitive pin there via stable-ts[fw], so torchcodec is
        # the only incremental download this adds.
        run: pip install -e ".[asr,asr-align2,storage]" -c constraints/asr.txt

      - name: Cache L2 CTC aligner model (MMS_FA)
        # ~1.2 GB wav2vec2 checkpoint, downloaded once via torch.hub on first ctc_fit() call.
        # Fixed key (not content-hashed): the checkpoint URL is stable; bump the -vN suffix only
        # if citypods/ctc_align.py switches bundles.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: mms-fa-checkpoint-v1

      - name: Sample and evaluate H15 candidates
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          SAMPLE_LIMIT: ${{ github.event.inputs.sample_limit || '8' }}
        run: |
          mkdir -p h15-eval
          citypods transcript-quality sample --out h15-eval/samples.json --limit "$SAMPLE_LIMIT"
          citypods transcript-quality evaluate \
            --config-dir config \
            --manifest h15-eval/samples.json \
            --out-dir h15-eval/artifacts

      - name: Upload H15 evaluation artifacts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: h15-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: h15-eval
          retention-days: 14
