name: ASR

# Transcription lane: identical pull workers claim transcript work from the shared Stage-2 lease
# ledger until their stop budget, so GitHub Actions is "just another worker" instead of the static
# shard-plan owner. stable-ts alignment remains a separate, currently-unscheduled lane so the two
# ASR models never co-load on one runner (review/18 §4.3 / H19).

on:
  schedule:
    # Every 5 hours: transcription uses a 285m start cutoff and 350m backstop, so a run may
    # intentionally make the next scheduled run wait briefly while the current transcript finishes.
    - cron: "0 */5 * * *"
  workflow_dispatch:

# Own concurrency group, distinct from `pages` and `audio`: a deploy is never canceled by ASR, and
# a running ASR run finishes (its shards yield gracefully when a newer run is queued behind them).
concurrency:
  group: asr
  cancel-in-progress: false

# `actions: read` lets each shard poll the Actions API for a newer queued ASR run and yield
# gracefully (issue #63). Asserted statically in tests/test_workflows.py.
permissions:
  contents: read
  actions: read

jobs:
  asr:
    runs-on: ubuntu-latest
    # Rebuild the discovery index + reap dead workers once before any internal pull worker claims.
    needs: reconcile
    strategy:
      fail-fast: false
      matrix:
        # 4 identical internal pull workers. The slot only seeds a distinct claim-scan offset.
        slot: [0, 1, 2, 3]
    env:
      # ASR keeps Whisper weights in the existing Actions-cache/B2 cascade, but uses the same
      # checksum-pinned ffmpeg runtime as Audio instead of depending on Ubuntu package mirrors.
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-18-14-21/ffmpeg-n7.1.4-39-ga5faeca88f-linux64-lgpl-7.1.tar.xz
      FFMPEG_SHA256: bf89442300107bc9c73d4ffb80c1e4482bbde205903fe0f9e3d1de55e6d1140e
      FFMPEG_DIR: /home/runner/.cache/citypods/ffmpeg-static-v1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The scheduled lane never aligns, so do not install stable-ts/torch or benchmark-only jiwer.
        run: pip install -e ".[asr-transcribe,storage]" -c constraints/asr.txt

      - name: Cache static ffmpeg
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-static-linux64-7.1.4-v1

      - name: Install verified static ffmpeg
        run: |
          timeout 300 python scripts/install_static_ffmpeg.py \
            --url "${FFMPEG_URL}" \
            --sha256 "${FFMPEG_SHA256}" \
            --install-dir "${FFMPEG_DIR}"
          "${FFMPEG_DIR}/bin/ffmpeg" -version >/dev/null
          "${FFMPEG_DIR}/bin/ffprobe" -version >/dev/null
          echo "${FFMPEG_DIR}/bin" >> "$GITHUB_PATH"

      # Restore + download the large-v3-turbo weights (4-step cascade in the script). The transcribe
      # lane only loads faster-whisper, never stable-ts.
      - name: Cache Whisper model (large-v3-turbo)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/faster-whisper-large-v3-turbo
          key: whisper-large-v3-turbo-v2
          restore-keys: whisper-large-v3-turbo-

      - name: Prepare Whisper model
        continue-on-error: true
        env:
          # huggingface_hub < 0.18 reads HUGGINGFACE_HUB_TOKEN; >= 0.18 prefers HF_TOKEN.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: python scripts/prepare_whisper.py

      # Each worker claims from the shared transcript queue until the start cutoff or a newer run
      # is queued behind it. Completion persists per-item; the next run resumes from storage.
      - name: ASR worker ${{ matrix.slot }}/4
        id: asr
        env:
          # Lets the shard poll the Actions API and yield gracefully when a newer run is queued
          # behind it. Not auto-exported by Actions, so pass it explicitly. (Guarded by
          # test_workflows.)
          GITHUB_TOKEN: ${{ github.token }}
          CITYPODS_INTERNAL_WORKER_SLOT: ${{ matrix.slot }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          set +e
          log="${RUNNER_TEMP:-/tmp}/citypods-asr.log"
          citypods compute run-internal-worker \
            2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 143 ] && grep -q "stop: newer build queued behind this run" "$log"; then
            echo "::warning title=ASR yielded to newer run::Worker ${{ matrix.slot }} hit exit 143 (SIGTERM) after the stop signal — the designed yield is exit 0, so this is the Actions hard cap landing mid-yield. The queued run resumes from persisted state."
            exit 0
          fi
          exit "$code"

  # Run-start control plane: restore state, rebuild the transcript discovery index, reap dead
  # external claims, and roll the free-tier budget once before the identical pull workers claim.
  # No Whisper model / ffmpeg: it only reads/writes JSON state.
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      # Only this step touches storage; scope the secrets here instead of job-level
      # (CR2-GH-16/MR-GH-02) so checkout/setup-python/install remain credential-free.
      - name: Rebuild work index + reconcile dispatch leases + free-tier budget
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: citypods compute reconcile
