name: ASR

# Transcription lane (H6b): faster-whisper ASR over episodes that already have hosted audio,
# sharded by source_key (scoped push_state, no cross-shard clobber). Runs `--lane transcribe`, so
# only the fresh-transcription model loads — stable-ts alignment is a separate, currently-unscheduled
# `--lane align` job, kept apart so the two ASR models never co-load on one runner (review/12 §H6).

on:
  schedule:
    # Every 5 hours: transcription uses a 285m start cutoff and 350m backstop, so a run may
    # intentionally make the next scheduled run wait briefly while the current transcript finishes.
    - cron: "0 */5 * * *"
  workflow_dispatch:

# Own concurrency group, distinct from `pages` and `audio`: a deploy is never canceled by ASR, and
# a running ASR run finishes (its shards yield gracefully when a newer run is queued behind them).
concurrency:
  group: asr
  cancel-in-progress: false

# `actions: read` lets each shard poll the Actions API for a newer queued ASR run and yield
# gracefully (issue #63). Asserted statically in tests/test_workflows.py.
permissions:
  contents: read
  actions: read

jobs:
  asr:
    runs-on: ubuntu-latest
    # Reap dead workers + roll the free-tier budget once (globally) before any shard dispatches (H14a).
    needs: reconcile
    strategy:
      fail-fast: false
      matrix:
        # 4 shards by source_key. Disjoint + exhaustive — keep in sync with the `/4` below.
        shard: [0, 1, 2, 3]
    env:
      # ASR keeps Whisper weights in the existing Actions-cache/B2 cascade, but uses the same
      # checksum-pinned ffmpeg runtime as Audio instead of depending on Ubuntu package mirrors.
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-18-14-21/ffmpeg-n7.1.4-39-ga5faeca88f-linux64-lgpl-7.1.tar.xz
      FFMPEG_SHA256: bf89442300107bc9c73d4ffb80c1e4482bbde205903fe0f9e3d1de55e6d1140e
      FFMPEG_DIR: /home/runner/.cache/citypods/ffmpeg-static-v1
      # Lets the shard poll the Actions API and yield gracefully when a newer run is queued behind
      # it. Not auto-exported by Actions, so pass it explicitly. (Guarded by test_workflows.)
      GITHUB_TOKEN: ${{ github.token }}
      # huggingface_hub < 0.18 reads HUGGINGFACE_HUB_TOKEN; >= 0.18 prefers HF_TOKEN.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      # The reconcile job restored B2 once, reconciled leases, and planned source ownership from
      # that exact snapshot. Every matrix job downloads the same immutable artifact instead of
      # independently listing/downloading the complete B2 state prefix and recomputing ownership.
      - name: Download canonical ASR snapshot + shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        # download-artifact v8 currently emits Node's upstream Buffer() deprecation from its
        # bundled dependency. Suppress deprecations for this action process only; application and
        # Python warnings remain fully visible.
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          name: asr-planner-${{ github.run_id }}
          path: .

      - name: Install
        # The scheduled lane never aligns, so do not install stable-ts/torch or benchmark-only jiwer.
        run: pip install -e ".[asr-transcribe,storage]"

      - name: Cache static ffmpeg
        uses: actions/cache@v5
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-static-linux64-7.1.4-v1

      - name: Install verified static ffmpeg
        run: |
          timeout 300 python scripts/install_static_ffmpeg.py \
            --url "${FFMPEG_URL}" \
            --sha256 "${FFMPEG_SHA256}" \
            --install-dir "${FFMPEG_DIR}"
          "${FFMPEG_DIR}/bin/ffmpeg" -version >/dev/null
          "${FFMPEG_DIR}/bin/ffprobe" -version >/dev/null
          echo "${FFMPEG_DIR}/bin" >> "$GITHUB_PATH"

      # Restore + download the large-v3-turbo weights (4-step cascade in the script). The transcribe
      # lane only loads faster-whisper, never stable-ts.
      - name: Cache Whisper model (large-v3-turbo)
        uses: actions/cache@v5
        with:
          path: ~/.cache/faster-whisper-large-v3-turbo
          key: whisper-large-v3-turbo-v2
          restore-keys: whisper-large-v3-turbo-

      - name: Prepare Whisper model
        continue-on-error: true
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: python scripts/prepare_whisper.py

      # Transcribe this shard's sources only. On a newer queued run (or the 285m start cutoff) the
      # shard stops starting new ASR, lets any in-flight transcript finish (or hit the 350m
      # backstop), pushes state, and exits 0 — the graceful yield is exit 0, not 143. The 143
      # branch below is a fallback: a genuine SIGTERM (Actions 6h hard cap / manual cancel) arriving
      # after the stop signal, which we treat as a benign yield since the next run resumes from
      # persisted state.
      - name: ASR (shard ${{ matrix.shard }}/4)
        id: asr
        run: |
          set +e
          log="${RUNNER_TEMP:-/tmp}/citypods-asr.log"
          citypods enrich \
            --lane transcribe \
            --shard ${{ matrix.shard }}/4 \
            --shard-plan .citypods-asr-shard-plan.json \
            --state-snapshot-restored \
            2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 143 ] && grep -q "stop: newer build queued behind this run" "$log"; then
            echo "::warning title=ASR yielded to newer run::Shard ${{ matrix.shard }} hit exit 143 (SIGTERM) after the stop signal — the designed yield is exit 0, so this is the Actions hard cap landing mid-yield. The queued run resumes from persisted state."
            exit 0
          fi
          exit "$code"

  # Run-start reconcile (H14a): reap a crashed external worker's expired lease (→ re-queue the item),
  # settle completed dispatch jobs, and roll the monthly free-tier budget — once, against the GLOBAL
  # work.json + compute_budget.json, before the sharded `asr` job (which `needs` it) dispatches more.
  # No Whisper model / ffmpeg: it only lists objects and reads/writes JSON state.
  reconcile:
    runs-on: ubuntu-latest
    env:
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage]"

      - name: Reconcile dispatch leases + free-tier budget
        run: citypods compute reconcile

      - name: Plan canonical ASR shard ownership
        run: |
          citypods compute plan-shards \
            --lane transcribe \
            --shards 4 \
            --output .citypods-asr-shard-plan.json

      - name: Upload canonical ASR snapshot + shard plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asr-planner-${{ github.run_id }}
          path: |
            .citypods-state
            .citypods-asr-shard-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
