name: Reindex LLM dispatch queue

# One-time recovery action for upgrading the dispatch Worker to its date-ordered ready index.
# Dispatch dry-run first, inspect the count, then dispatch again with `apply` checked.  The script
# reads only this private dispatch bucket's canonical request records and writes compact `ready/`
# markers; it never changes prompts, completed results, or request status.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write ready markers (unchecked = dry-run)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: llm-dispatch-reindex
  cancel-in-progress: false

jobs:
  reindex:
    # workflow_dispatch can target arbitrary refs. Never expose production R2 credentials to code
    # outside the reviewed default branch, including for a nominally read-only dry-run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install R2 client
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Build ready markers
        env:
          APPLY_INPUT: ${{ inputs.apply }}
          GIT_REF: ${{ github.ref }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Dedicated credentials are scoped to the private dispatch bucket.  Do not reuse the
          # catalog-storage key: it cannot list this bucket.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_RECLAIM_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_RECLAIM_SECRET_ACCESS_KEY }}
          # R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}  # uncomment for jurisdiction-specific buckets
        run: |
          set -o pipefail
          ARGS=(--bucket citypods-llm-dispatch --workers 4 --r2-retries 5)
          if [ "$APPLY_INPUT" != "true" ]; then
            ARGS+=(--dry-run)
          elif [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "::error::apply can only write the production dispatch queue from main"
            exit 1
          fi
          python -u scripts/reindex_llm_dispatch_queue.py "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
