name: Tournament retained-catalog tag backfill

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      model:
        required: true
        type: string
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

concurrency:
  group: tournament-tag-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[storage,llm]" -c constraints/prod.txt
      - name: Choose the next bounded retained source
        id: next
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
          INPUT_MODEL: ${{ inputs.model || '' }}
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--issue-number "$INPUT_ISSUE_NUMBER" --model "$INPUT_MODEL")
          fi
          python -m citypods.tournament_backfill next-source "${args[@]}" > next.json
          echo "status=$(jq -r .status next.json)" >> "$GITHUB_OUTPUT"
          echo "source=$(jq -r '.source // empty' next.json)" >> "$GITHUB_OUTPUT"
          echo "issue=$(jq -r '.issue_number // empty' next.json)" >> "$GITHUB_OUTPUT"
          echo "model=$(jq -r '.model // empty' next.json)" >> "$GITHUB_OUTPUT"
      - name: Refresh one retained source through the normal bounded tag lane
        if: steps.next.outputs.status == 'active'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_DISPATCH_URL: ${{ secrets.LLM_DISPATCH_URL }}
          LLM_DISPATCH_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_AUTH_TOKEN }}
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          SOURCE: ${{ steps.next.outputs.source }}
        run: python -m citypods.cli enrich --lane tag --source "$SOURCE"
