name: Deploy LLM dispatch Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/llm-dispatch-proxy/src/**"
      - "workers/llm-dispatch-proxy/wrangler.jsonc"
      - "workers/llm-dispatch-proxy/package.json"
      - "workers/llm-dispatch-proxy/package-lock.json"
      - "config/provider_limits.yml"
      - "scripts/compile_llm_limits.py"
      - ".github/workflows/llm-dispatch-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-dispatch-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml -c constraints/prod.txt

      - name: Compile LLM limits
        run: python scripts/compile_llm_limits.py

      - name: Check for dispatch_limits.json drift
        run: |
          if ! git diff --exit-code workers/llm-dispatch-proxy/src/dispatch_limits.json; then
            echo "::error::dispatch_limits.json is out of date — recompile with 'python scripts/compile_llm_limits.py' and commit both the YAML and the JSON together."
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Test Worker
        working-directory: workers/llm-dispatch-proxy
        run: npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_LLM_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/llm-dispatch-proxy
          wranglerVersion: "4"
          # `accountId` above only configures the deploy CLI -- it does not expose
          # CLOUDFLARE_ACCOUNT_ID to the Worker at runtime. That used to be solved here with a
          # `secrets`/`env` block that made wrangler-action run `wrangler secret put
          # CLOUDFLARE_ACCOUNT_ID` before every deploy, but Cloudflare's secret-modification API
          # (which `secret bulk` calls) 400s with error 10215 ("the latest version of your Worker
          # isn't currently deployed") whenever this Worker's latest uploaded version and its
          # currently-deployed version have drifted -- and that check runs *before* this step's own
          # deploy, so a transient drift permanently wedges every future deploy attempt right here.
          # CLOUDFLARE_ACCOUNT_ID never actually changes, so it doesn't need re-uploading on every
          # deploy: it's now a one-time manual secret like every other credential this Worker uses
          # (DISPATCH_AUTH_TOKEN, the provider API keys, AI_GATEWAY_AUTH_TOKEN) -- see README.md's
          # Configuration section. `wrangler deploy` below never touches secrets, so it can't hit
          # this precondition.
