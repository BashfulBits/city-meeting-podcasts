name: Deploy Granicus media Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/granicus-media-proxy/src/**"
      - "workers/granicus-media-proxy/wrangler.jsonc"
      - "workers/granicus-media-proxy/package.json"
      - "workers/granicus-media-proxy/package-lock.json"
      - ".github/workflows/granicus-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: granicus-media-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Test Worker
        working-directory: workers/granicus-media-proxy
        run: npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/granicus-media-proxy
          wranglerVersion: "4"
