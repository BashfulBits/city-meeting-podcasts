name: Deploy Granicus media Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/granicus-media-proxy/src/**"
      - "workers/granicus-media-proxy/wrangler.jsonc"
      - "workers/granicus-media-proxy/package.json"
      - "workers/granicus-media-proxy/package-lock.json"
      - ".github/workflows/granicus-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: granicus-media-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Test Worker
        working-directory: workers/granicus-media-proxy
        run: npm test

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/granicus-media-proxy
          wranglerVersion: "4.129.0"
