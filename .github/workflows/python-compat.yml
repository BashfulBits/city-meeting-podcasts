name: Python compatibility

# Dependency/Python compatibility gate. Every workflow reads its Python from a version file
# (.python-version, or .github/python/asr/.python-version for the ASR stack), and
# scripts/python_lanes.py maps each one to the constraints files its jobs install. This
# dry-run resolves every such lane on its own interpreter, wheels only, so a Renovate
# Python or lock bump that cannot install (no wheel, requires_python cap, transitive
# pin like whisperX's torch~=2.8.0) fails here instead of in a production run.

on:
  pull_request:
    paths:
      - pyproject.toml
      - constraints/**
      - .python-version
      - .github/python/**
      - .github/workflows/**
      - scripts/python_lanes.py
      - scripts/lane_inputs.py
      - scripts/compile_constraints.sh
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - constraints/**
      - .python-version
      - .github/python/**
  workflow_dispatch:

concurrency:
  group: python-compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.lanes.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Check Python pins and list lanes
        id: lanes
        run: |
          python -m pip install --quiet "PyYAML>=6.0"
          python scripts/lane_inputs.py --check
          python scripts/python_lanes.py --check
          echo "matrix=$(python scripts/python_lanes.py)" >> "$GITHUB_OUTPUT"

  resolve:
    needs: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lanes.outputs.matrix) }}
    name: resolve (${{ matrix.constraints }} on ${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ${{ matrix.version_file }}

      - name: Dry-run install
        # Wheels only: a source build on the fleet Python is slow at best and a missing
        # toolchain at worst. antlr4-python3-runtime 4.9.3 (via omegaconf, ASR lane) is a
        # pure-Python sdist with no wheel, so it is the one allowed exception.
        env:
          CONSTRAINTS: ${{ matrix.constraints }}
          EXTRAS: ${{ matrix.extras }}
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --dry-run --ignore-installed \
            --only-binary=:all: --no-binary=antlr4-python3-runtime \
            -c "$CONSTRAINTS" -e ".[${EXTRAS}]"
