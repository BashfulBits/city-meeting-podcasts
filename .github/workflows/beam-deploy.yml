name: Deploy Beam Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "citypods/compute/**"
      - "citypods/ops/work_leases.py"
      - "citypods/asr.py" # image bakes the pinned model by importing this at build
      - "config/site_config.yml"
      - "constraints/asr.txt" # image installs pinned deps from this
      - "pyproject.toml"
      - "scripts/compute/**"
      - ".github/workflows/beam-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: beam-production
    env:
      BEAM_TOKEN: ${{ secrets.BEAM_TOKEN }}
      CITYPODS_BEAM_APP: citypods-beam-worker
      CITYPODS_BEAM_SCHEDULE: "@daily"
      CITYPODS_WORKER_LEASE_TTL_SECONDS: "72000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Beam CLI
        # beta9 imports `packaging` in its CLI
        # (beam/cli/utils.py) but omits it from its own declared dependencies -- an upstream
        # metadata bug. Installed explicitly, pinned for reproducible deploys (Renovate-tracked).
        run: python -m pip install "beam-client==0.2.202" "packaging==26.2"

      - name: Configure Beam CLI
        run: beam configure default --token "$BEAM_TOKEN"

      - name: Deploy Beam pull worker
        run: beam deploy scripts/compute/beam_app.py:run_scheduled
