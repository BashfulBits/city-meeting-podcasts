name: Endpoint contracts

# Weekly probe of live provider endpoints (Granicus/Swagit/CivicPlus/CivicClerk). Distinct from
# the feed-health audit: this checks the *upstream input* contracts (does each list/media/chapters
# endpoint still return the shape we parse?), so a platform HTML/JSON change is caught at the
# source and filed as a named GitHub issue. Network-touching, so it's its own scheduled job — not
# part of PR CI (which stays offline and deterministic).

on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC
  workflow_dispatch:
    inputs:
      all:
        description: "Scan every city (not just one per provider)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: endpoint-contracts
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e . -c constraints/prod.txt
      # The media-fetch contract check truncated-downloads each provider's newest clip via ffmpeg
      # (catches a CDN that 403s our User-Agent). Without ffmpeg that sub-check self-skips.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Fail fast if the proxy secrets are missing/empty: without them the production fetch path
      # silently self-disables the Worker fallback, so the media-fetch check would revert to the
      # known direct-fetch 403 and report a false break instead of testing the real path. Checked
      # before the (up to 2h) wait loop below so a misconfigured run fails in seconds, not hours.
      - name: Verify Granicus proxy secrets are configured
        env:
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
        run: |
          if [ -z "$GRANICUS_PROXY_BASE_URL" ] || [ -z "$GRANICUS_PROXY_TOKEN" ]; then
            echo "::error::GRANICUS_PROXY_BASE_URL and GRANICUS_PROXY_TOKEN must both be set as repo secrets; the media-fetch contract check depends on the Worker fallback path."
            exit 1
          fi

      # Wait for any active (or queued -- a queued run will start opening connections shortly,
      # so it must be waited on too) audio.yml OR granicus-probe.yml run to finish before probing
      # Granicus media endpoints. audio.yml's four shards each open Granicus CDN connections, and
      # granicus-probe.yml shares its `group: audio` concurrency slot for the same reason (CR2-GH-19)
      # -- adding an uncoordinated ffmpeg fetch on top of either is the primary cause of HTTP 403
      # throttling (GH#300). Polls every 2 minutes for up to 2 hours; always proceeds after the
      # timeout so a stuck run does not permanently block the weekly contracts check.
      - name: Wait for active audio runs to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            busy=false
            failed=false
            for workflow in audio.yml granicus-probe.yml; do
              for status in in_progress queued; do
                # A gh API/auth/network error must not be masked as "no active runs" -- that
                # would let the loop fall through to the endpoint probes while a run might still
                # be active. Retry (same backoff as the normal wait) instead of treating a failed
                # check as empty. Capture stderr separately so a successful call's incidental
                # stderr warning can't corrupt the "[]" comparison below (CR2-GH-18).
                if ! RESULT=$(gh run list --workflow "$workflow" --status "$status" \
                    --json databaseId --limit 5 2>/tmp/gh-run-list.err); then
                  echo "[$i/60] gh run list ($workflow $status) failed, will retry: $(cat /tmp/gh-run-list.err)"
                  failed=true
                elif [ "$RESULT" != "[]" ]; then
                  busy=true
                fi
              done
            done
            if [ "$failed" = "false" ] && [ "$busy" = "false" ]; then
              echo "No active or queued audio/granicus-probe runs. Proceeding with endpoint checks."
              exit 0
            fi
            echo "[$i/60] waiting on audio.yml/granicus-probe.yml (busy=$busy failed=$failed). Waiting 2 minutes..."
            sleep 120
          done
          echo "Timed out after 2 hours. Proceeding anyway."

      # Granicus 403s our User-Agent on direct CDN fetches; the production fetch path falls back to
      # the Cloudflare Worker proxy when these are set (citypods.media._worker_fallback_for_403).
      # Wire them in here so the media-fetch check exercises the same path a real audio run uses —
      # a failure then means upstream *or* the proxy genuinely broke, not the known direct-fetch 403.
      - name: Probe endpoints + reconcile issues
        env:
          GH_TOKEN: ${{ github.token }}
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
        run: >-
          PYTHONPATH=. python scripts/check_endpoints.py --issues
          ${{ (github.event_name == 'workflow_dispatch' && inputs.all) && '--all' || '' }}
