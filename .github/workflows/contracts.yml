name: Endpoint contracts

# Weekly probe of live provider endpoints (Granicus/Swagit/CivicPlus/CivicClerk). Distinct from
# the feed-health audit: this checks the *upstream input* contracts (does each list/media/chapters
# endpoint still return the shape we parse?), so a platform HTML/JSON change is caught at the
# source and filed as a named GitHub issue. Network-touching, so it's its own scheduled job — not
# part of PR CI (which stays offline and deterministic).

on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC
  workflow_dispatch:
    inputs:
      all:
        description: "Scan every city (not just one per provider)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: endpoint-contracts
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      # The media-fetch contract check truncated-downloads each provider's newest clip via ffmpeg
      # (catches a CDN that 403s our User-Agent). Without ffmpeg that sub-check self-skips.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Wait for any active audio.yml runs to finish before probing Granicus media endpoints.
      # audio.yml's four shards each open Granicus CDN connections; adding an uncoordinated
      # ffmpeg fetch on top of them is the primary cause of HTTP 403 throttling (GH#300).
      # Polls every 2 minutes for up to 2 hours; always proceeds after the timeout so a
      # stuck audio run does not permanently block the weekly contracts check.
      - name: Wait for active audio runs to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            ACTIVE=$(gh run list --workflow audio.yml --status in_progress --json databaseId --limit 5 2>/dev/null || echo "[]")
            if [ "$ACTIVE" = "[]" ]; then
              echo "No active audio runs. Proceeding with endpoint checks."
              exit 0
            fi
            echo "[$i/60] audio.yml is running. Waiting 2 minutes..."
            sleep 120
          done
          echo "Timed out after 2 hours. Proceeding anyway."

      - name: Probe endpoints + reconcile issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=. python scripts/check_endpoints.py --issues
          ${{ (github.event_name == 'workflow_dispatch' && inputs.all) && '--all' || '' }}
