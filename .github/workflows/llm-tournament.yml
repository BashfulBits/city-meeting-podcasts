name: LLM tag tournament

on:
  schedule:
    - cron: "30 17 * * 1" # weekly, inside DeepSeek's off-peak window
  workflow_dispatch:
    inputs:
      safe_diagnostics:
        description: "Emit non-sensitive structured-output diagnostics"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: llm-tag-tournament
  cancel-in-progress: false

jobs:
  tournament:
    runs-on: ubuntu-latest
    # The lane now uses its configured ~46-sample budget. Keep a 15-minute tail after the
    # sampling step for state persistence and champion-ticket publication.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: ./.github/actions/setup-gh-cli
      - run: pip install -e ".[storage,llm]" -c constraints/prod.txt
      - name: Capture starting LLM worker state
        env:
          CITYPODS_LLM_SUBMISSION_TELEMETRY_FILE: ${{ runner.temp }}/llm-submission-telemetry.jsonl
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
        run: |
          echo "CITYPODS_LLM_SUBMISSION_TELEMETRY_FILE=$CITYPODS_LLM_SUBMISSION_TELEMETRY_FILE" >> "$GITHUB_ENV"
          python scripts/llm_submission_telemetry.py snapshot start
      - name: Run bounded tag samples
        # Below the job timeout so the champion-ticket step below still runs. A job-level timeout
        # CANCELS the run, which skips every later step: the sampling work would be spent and no
        # ticket published, reported as a grey "cancelled" that looks like someone pressed the
        # button. The sample count now comes from the lane budget (~46 samples), so the step needs
        # the same 165-minute bounded-work window as the other asynchronous LLM lanes.
        timeout-minutes: 165
        env:
          LLM_SAFE_DIAGNOSTICS: ${{ inputs.safe_diagnostics && '1' || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_DISPATCH_URL: ${{ secrets.LLM_DISPATCH_URL }}
          LLM_DISPATCH_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_AUTH_TOKEN }}
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Direct provider calls route via the AI Gateway for observability; without this
          # token an authenticated gateway rejects them (see citypods/compute/llm.py).
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID || 'citypods-dispatch' }}
          AI_GATEWAY_AUTH_TOKEN: ${{ secrets.AI_GATEWAY_AUTH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        # No --samples: the per-run budget comes from
        # `llm_lanes["tournament:tag"].max_dispatches_per_run` in config/site_config.yml.
        # The old explicit `--samples 2` capped this lane at ~32 jobs/day against a budget
        # sized for far more, which is one reason the research lanes never filled quota.
        run: python -m citypods.tournament
      - name: Publish tournament champion ticket
        env:
          GH_TOKEN: ${{ github.token }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          python -m citypods.tournament ticket --out-dir tournament-ticket
          python scripts/publish_review_ticket.py --family tournament-tag \
            --label tournament-champion-ticket --title "Tournament champion ticket: tag" \
            --body-file tournament-ticket/ticket.md
      - name: Summarize LLM submission telemetry
        if: always()
        env:
          LLM_DISPATCH_V2_URL: ${{ secrets.LLM_DISPATCH_V2_URL }}
          LLM_DISPATCH_V2_AUTH_TOKEN: ${{ secrets.LLM_DISPATCH_V2_AUTH_TOKEN }}
        run: |
          python scripts/llm_submission_telemetry.py snapshot end
          python scripts/llm_submission_telemetry.py report

      - name: Upload LLM submission telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llm-submission-telemetry-${{ github.run_id }}
          path: ${{ runner.temp }}/llm-submission-telemetry.jsonl
          if-no-files-found: ignore
          retention-days: 30
