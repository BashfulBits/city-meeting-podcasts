name: R7 Diarization

# The Denton shadow pilot is deliberately isolated from the general ASR queue.  ASR and audio
# must publish their artifacts first; this lane only consumes hosted audio/timed words and owns
# the R7 speaker blocks.  Identity projection follows diarization in the same run so a fresh
# artifact can immediately produce private review candidates.
on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

concurrency:
  # This and the weekly review both replace the same private registry/evaluation artifacts.
  # A shared group makes those whole-artifact writes serial, as well as serializing diarization runs.
  group: r7-speaker-evaluation-state
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  diarize:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_HOME: /home/runner/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Pinned to constraints/asr.txt's compile target (scripts/compile_constraints.sh
          # resolves inside python:3.12-slim-bookworm) -- not the fleet-wide "3.14" a Renovate
          # actions bump landed everywhere (#1353). whisperx==3.8.6 (`asr`) has no distribution
          # satisfying the 3.14 resolver; see asr.yml for the same fix.
          python-version: "3.12"
          cache: pip

      - name: Cache pyannote models
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /home/runner/.cache/huggingface
          key: r7-pyannote-community-1-${{ runner.os }}-${{ hashFiles('constraints/asr.txt', 'config/site_config.yml') }}
          restore-keys: |
            r7-pyannote-community-1-${{ runner.os }}-

      # pyannote.audio 4 decodes through torchcodec, which dynamically loads FFmpeg's shared
      # libav* libraries. A standalone/static ffmpeg binary is not sufficient, and ffmpeg is no
      # longer guaranteed to be present on the moving ubuntu-latest runner image.
      - name: Install FFmpeg shared runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version >/dev/null
          ldconfig -p | grep -q 'libavcodec.so'

      - name: Install pinned diarization runtime
        run: pip install -e ".[asr,storage]" -c constraints/asr.txt

      - name: Preflight pyannote model access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/preflight_diarization.py

      - name: Diarize Denton pilot meetings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
          SWAGIT_PROXY_BASE_URL: ${{ secrets.SWAGIT_PROXY_BASE_URL }}
          SWAGIT_PROXY_TOKEN: ${{ secrets.SWAGIT_PROXY_TOKEN }}
        run: python -m citypods.cli enrich --city denton-tx --lane diarize

      - name: Project speaker identities and queue review candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
          SWAGIT_PROXY_BASE_URL: ${{ secrets.SWAGIT_PROXY_BASE_URL }}
          SWAGIT_PROXY_TOKEN: ${{ secrets.SWAGIT_PROXY_TOKEN }}
        run: python -m citypods.cli enrich --city denton-tx --lane speaker-identity
