name: R7 Diarization

# The Denton shadow pilot is deliberately isolated from the general ASR queue.  ASR and audio
# must publish their artifacts first; this lane only consumes hosted audio/timed words and owns
# the R7 speaker blocks.  Identity projection follows diarization in the same run so a fresh
# artifact can immediately produce private review candidates.
on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

concurrency:
  # This and the weekly review both replace the same private registry/evaluation artifacts.
  # A shared group makes those whole-artifact writes serial, as well as serializing diarization runs.
  group: r7-speaker-evaluation-state
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  diarize:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # Same checksum-pinned build audio.yml's host fallback uses -- NOT `apt-get install ffmpeg`,
      # which on ubuntu-latest (24.04 "noble") resolves to 6.1.1, a full major version behind the
      # 7.1.5 production actually decodes audio with (see ci.yml).
      FFMPEG_SHA256: 30d8f18138393081d7fdf95f7006fa132e7b063fd87c0e955652c64a4bc0d52d
      FFMPEG_DIR: /home/runner/.cache/citypods/ffmpeg-static-v1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Pinned to constraints/asr.txt's compile target (scripts/compile_constraints.sh
          # resolves inside python:3.12-slim-bookworm) -- not the fleet-wide "3.14" a Renovate
          # actions bump landed everywhere (#1353). whisperx==3.8.6 (`asr`) has no distribution
          # satisfying the 3.14 resolver; see asr.yml for the same fix.
          python-version: "3.12"
          cache: pip

      # sherpa-onnx's two ONNX models (~46MB combined) are non-gated GitHub release assets,
      # fetched lazily by citypods.diarize into this cache dir on first use -- no HF auth, no
      # torchcodec workaround the pyannote engine needed (this engine decodes audio via a plain
      # ffmpeg subprocess -- installed below, same as every other lane that decodes audio).
      - name: Cache sherpa-onnx diarization models
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /home/runner/.cache/citypods-diarize
          key: r7-sherpa-titanet-small-${{ runner.os }}-${{ hashFiles('citypods/diarize.py') }}

      - name: Install pinned diarization runtime
        run: pip install -e ".[diarize,storage]" -c constraints/asr.txt

      - name: Cache pinned ffmpeg
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-static-linux64-7.1.5-v2

      - name: Install pinned ffmpeg (matches production's audio.yml pin)
        # Self-built (scripts/build_ffmpeg_static.sh), vendored to our own B2 bucket -- not an
        # upstream/mirror host. FFMPEG_URL built from the B2 secret rather than hardcoded so it's
        # not duplicated across the workflows that pin ffmpeg (review/22). citypods/diarize.py
        # shells out to a bare `ffmpeg` on PATH, so this must land on PATH, not just be built --
        # this workflow never installed ffmpeg at all, so every diarize candidate failed
        # immediately with "ffmpeg ... was not found on PATH".
        env:
          FFMPEG_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}/deps/ffmpeg/7.1.5/ffmpeg-7.1.5-linux64-static.tar.xz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgnutls30 libopus0 libvpx9 libdav1d7 libmp3lame0
          python scripts/install_static_ffmpeg.py \
            --url "${FFMPEG_URL}" \
            --sha256 "${FFMPEG_SHA256}" \
            --install-dir "${FFMPEG_DIR}"
          "${FFMPEG_DIR}/bin/ffmpeg" -version >/dev/null
          "${FFMPEG_DIR}/bin/ffprobe" -version >/dev/null
          echo "${FFMPEG_DIR}/bin" >> "$GITHUB_PATH"

      - name: Preflight diarization model access
        run: python scripts/preflight_diarization.py

      - name: Diarize Denton pilot meetings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
          SWAGIT_PROXY_BASE_URL: ${{ secrets.SWAGIT_PROXY_BASE_URL }}
          SWAGIT_PROXY_TOKEN: ${{ secrets.SWAGIT_PROXY_TOKEN }}
        run: python -m citypods.cli enrich --city denton-tx --lane diarize

      - name: Project speaker identities and queue review candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
          SWAGIT_PROXY_BASE_URL: ${{ secrets.SWAGIT_PROXY_BASE_URL }}
          SWAGIT_PROXY_TOKEN: ${{ secrets.SWAGIT_PROXY_TOKEN }}
        run: python -m citypods.cli enrich --city denton-tx --lane speaker-identity
