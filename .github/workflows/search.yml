name: Search index

# Bounded static-search build, staged for the deploy workflow instead of published here.
# `deploy.yml` is the only publisher: it re-renders feeds/pages from the current object-store state,
# overlays the newest completed index, and publishes content + index together. A search run that
# published its own ~2h-old render would overwrite whatever merged in the meantime (the stale
# republish), so this workflow stops once the index is ready.
on:
  schedule:
    # Keep in sync with site_config.yml schedule_cron (the 4h production publish cadence).
    - cron: "26 */4 * * *"
  workflow_dispatch:

# One index build at a time, never cancelled mid-build (it writes the resumable checkpoint).
# This never publishes, so it holds no Pages slot at all: the group only serializes index builds.
concurrency:
  group: pages-search
  cancel-in-progress: false

# Never polls the Actions API except for the single dispatch in the last step.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      pages: read
      actions: write  # request the deploy run that publishes this index
    runs-on: ubuntu-latest
    # 120-minute indexing budget (site_config search_index_budget_minutes) plus the render, setup,
    # checkpoint save and artifact upload around it. Kept well above the budget so the graceful
    # "deferred, retain prior index" exit always wins.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          cache: pip

      # Same restored snapshot the deploy publishes from: the bucket is the source of truth and
      # citypods/statesync.py restores it at build start, so this cache is latency only.
      - name: Restore build state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .citypods-state
            docs
          key: build-state-${{ github.run_id }}
          restore-keys: |
            build-state-

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: false

      # The index is built from this run's own render (docs/, search-context.json and the source
      # record JSONs), so the workflow stays self-contained and never depends on another run's
      # artifacts. Keep this step identical to deploy.yml's render step.
      - name: Render feeds
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          # Backblaze B2 (+ Cloudflare CDN for free egress):
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          # Cloudflare R2:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
          SWAGIT_PROXY_BASE_URL: ${{ secrets.SWAGIT_PROXY_BASE_URL }}
          SWAGIT_PROXY_TOKEN: ${{ secrets.SWAGIT_PROXY_TOKEN }}
        run: citypods build --phase render --no-refresh --skip-search --search-context-output search-context.json

      - name: Resource report
        continue-on-error: true
        run: citypods report --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Validate generated feeds
        run: citypods validate-build docs/ --state-dir .citypods-state

      # restore-only: the checkpoint is saved explicitly below, because actions/cache's implicit
      # post-step save is skipped when a job fails and this run's indexing progress must survive an
      # upload or dispatch hiccup.
      - name: Restore resumable search checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .citypods-search-checkpoint
          key: search-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            search-checkpoint-

      - name: Build bounded search
        # Step-level timeout below the 180m job timeout so a stuck build fails this step and still
        # runs `Save resumable search checkpoint` (`if: always()`) instead of cancelling the job.
        timeout-minutes: 150
        shell: bash
        env:
          # Existing storage credentials are used only to read hosted sidecars.
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          # Cloudflare R2:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path

          working = Path(".citypods-search-checkpoint/working")
          path = working / ".search-cache.json"
          try:
              raw_cache = json.loads(path.read_text()) if path.exists() else {}
              cache = raw_cache if isinstance(raw_cache, dict) else {}
          except (OSError, ValueError):
              cache = {}
          shards = cache.get("shards")
          print(f"Restored checkpoint: {len(shards) if isinstance(shards, dict) else 0} completed sources")
          partials_dir = working / ".search-partials"
          if partials_dir.is_dir():
              for pfile in sorted(partials_dir.glob("*.json")):
                  try:
                      partial = json.loads(pfile.read_text())
                  except (OSError, ValueError):
                      continue
                  if not isinstance(partial, dict):
                      continue
                  records = partial.get("records")
                  count = len(records) if isinstance(records, dict) else 0
                  print(f"Resuming source {pfile.stem}: {count} saved records")
          legacy_partials = cache.get("partials")
          if isinstance(legacy_partials, dict):
              for key, partial in sorted(legacy_partials.items()):
                  if not isinstance(partial, dict):
                      continue
                  records = partial.get("records")
                  count = len(records) if isinstance(records, dict) else 0
                  print(f"Resuming legacy source {key}: {count} saved records")
          PYTHON
          citypods search-index --context-path search-context.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Persist resumable progress before anything below can fail (a failed build still keeps its
      # partial shards; that is the point of the checkpoint).
      - name: Save resumable search checkpoint
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .citypods-search-checkpoint
          key: search-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}

      # Only the rendered search payload: the shards, the search page and its assets. The deploy run
      # re-renders everything else from current state, so shipping the whole site here would
      # reintroduce the stale-content overwrite this workflow exists to avoid. upload-artifact
      # stores these relative to their common parent (`docs/`), so `path: docs` re-creates them.
      - name: Upload search index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: search-index
          path: |
            docs/data/search
            docs/search
            docs/assets/minisearch-*
            docs/assets/LICENSES/minisearch-*

      # Publishing belongs to deploy.yml, which renders from current state and overlays this
      # artifact before that render. GITHUB_TOKEN may dispatch workflows (push/PR events it creates
      # are suppressed, but workflow_dispatch is allowed), so no extra credential is needed.
      - name: Request a publish that includes this index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main -f "search_run_id=${GITHUB_RUN_ID}"
