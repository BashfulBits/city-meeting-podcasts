name: City discovery

# R12 runs discovery daily rather than on every issue edit: evidence generation can be queued by
# Tavily/LLM capacity, and bot comments/label changes must not create a feedback loop.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      city_slug:
        description: "Run one existing city only (optional)"
        required: false
      issue_number:
        description: "Run one add-city issue only (optional)"
        required: false
      mode:
        description: "all, new-city, auxiliary, or batch"
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: city-discovery
  cancel-in-progress: false

jobs:
  discover:
    permissions:
      contents: read
      discussions: write
      issues: write
    if: ${{ inputs.mode != 'batch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -e ".[storage,llm]" -c constraints/prod.txt

      - name: Discover queued new-city requests
        if: ${{ inputs.mode != 'auxiliary' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_API_KEY_SECONDARY: ${{ secrets.MISTRAL_API_KEY_SECONDARY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Direct provider calls route via the AI Gateway for observability; without this
          # token an authenticated gateway rejects them (see citypods/compute/llm.py).
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID || 'citypods-dispatch' }}
          AI_GATEWAY_AUTH_TOKEN: ${{ secrets.AI_GATEWAY_AUTH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          CITY_REQUEST_STATUS_WEBHOOK_URL: ${{ secrets.CITY_REQUEST_STATUS_WEBHOOK_URL }}
          REQUESTED_ISSUE: ${{ inputs.issue_number }}
        run: |
          if [ -n "$REQUESTED_ISSUE" ]; then
            issues="$REQUESTED_ISSUE"
          else
            issues=$(gh issue list --label add-city --state open --limit 1000 --json number,labels --jq '.[] | select([.labels[].name] | index("add-city:applied") | not) | .number')
          fi
          DISCOVERY_DEFERRED=75
          failures=0
          for issue in $issues; do
            mkdir -p "city-discovery/new-$issue"
            gh api "repos/${{ github.repository }}/issues/$issue" > "city-discovery/new-$issue/issue.json"
            jq -r .body "city-discovery/new-$issue/issue.json" > "city-discovery/new-$issue/issue.md"
            gh api --paginate --slurp "repos/${{ github.repository }}/issues/$issue/comments?per_page=100" \
              > "city-discovery/new-$issue/comments.json"
            jq 'add' "city-discovery/new-$issue/comments.json" > "city-discovery/new-$issue/comments-flat.json"
            python scripts/r12_issue_state.py \
              --issue "city-discovery/new-$issue/issue.json" \
              --comments "city-discovery/new-$issue/comments-flat.json" \
              --out "city-discovery/new-$issue/state.json"
            if [ "$(jq -r .discover "city-discovery/new-$issue/state.json")" != true ]; then
              continue
            fi
            if [ "$(jq -r .expired "city-discovery/new-$issue/state.json")" = true ]; then
              gh issue edit "$issue" --add-label r12:expired --add-label needs:discovery \
                --remove-label r12:approved
              gh issue comment "$issue" --body \
                "R12 evidence expired after 90 days; fresh discovery has been queued."
              gh issue view "$issue" --json number,url,body > "city-discovery/new-$issue/notify.json"
              python scripts/r12_notify.py --issue "city-discovery/new-$issue/notify.json" \
                --status evidence_expired
            fi
            if python scripts/city_discovery.py --mode new-city --issue-number "$issue" \
              --issue-body "city-discovery/new-$issue/issue.md" --out "city-discovery/new-$issue"; then
              :
            else
              status=$?
              if [ "$status" -eq "$DISCOVERY_DEFERRED" ]; then
                echo "::warning::Discovery deferred for add-city issue #$issue; it remains queued for tomorrow."
              else
                echo "::error::Discovery failed for add-city issue #$issue (exit $status)."
                failures=$((failures + 1))
              fi
              continue
            fi
            gh issue comment "$issue" --body-file "city-discovery/new-$issue/evidence.md"
            if [ "$(jq -r .needs_more_information "city-discovery/new-$issue/evidence.json")" = true ]; then
              gh issue edit "$issue" --add-label needs:more-information --remove-label needs:discovery \
                --remove-label r12:evidence-ready --remove-label r12:recheck --remove-label r12:expired
            else
              gh issue edit "$issue" --add-label r12:evidence-ready --remove-label r12:recheck \
                --remove-label r12:expired --remove-label needs:more-information
            fi
            gh issue view "$issue" --json number,url,body > "city-discovery/new-$issue/notify.json"
            notify_status=$(jq -r 'if .needs_more_information then "needs_more_information" elif .research_only then "research_only" else "evidence_ready" end' \
              "city-discovery/new-$issue/evidence.json")
            python scripts/r12_notify.py --issue "city-discovery/new-$issue/notify.json" \
              --status "$notify_status"
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures city discovery request(s) failed unexpectedly."
            exit 1
          fi

      - name: Discover eligible auxiliary agenda sources
        if: ${{ inputs.mode != 'new-city' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_API_KEY_SECONDARY: ${{ secrets.MISTRAL_API_KEY_SECONDARY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Direct provider calls route via the AI Gateway for observability; without this
          # token an authenticated gateway rejects them (see citypods/compute/llm.py).
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID || 'citypods-dispatch' }}
          AI_GATEWAY_AUTH_TOKEN: ${{ secrets.AI_GATEWAY_AUTH_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          REQUESTED_CITY: ${{ inputs.city_slug }}
        run: |
          mkdir -p city-discovery/aux
          if [ -z "$REQUESTED_CITY" ] && [ "${{ github.event_name }}" = schedule ] \
            && [ "$(date -u +%u)" != 1 ]; then
            echo "Auxiliary eligibility runs weekly; use workflow dispatch for a manual run."
            exit 0
          fi
          title_prefix="[city-discovery]"
          existing=$(gh issue list --state open --search "in:title $title_prefix" --limit 1000 \
            --json number,title | jq -r --arg prefix "$title_prefix" \
            '.[] | select(.title | startswith($prefix)) | .number' | head -1)
          if [ -n "$existing" ]; then
            gh api "repos/${{ github.repository }}/issues/$existing" > city-discovery/aux/issue.json
            gh api --paginate --slurp "repos/${{ github.repository }}/issues/$existing/comments?per_page=100" \
              > city-discovery/aux/comments.json
            jq 'add' city-discovery/aux/comments.json > city-discovery/aux/comments-flat.json
            jq -r .body city-discovery/aux/issue.json > city-discovery/aux/issue-body-prior.md
            python scripts/r12_aux_state.py --body city-discovery/aux/issue-body-prior.md \
              --out city-discovery/aux/prior-state.json
          else
            printf '{}\n' > city-discovery/aux/prior-state.json
          fi
          if [ -n "$REQUESTED_CITY" ]; then
            cities="$REQUESTED_CITY"
            cp city-discovery/aux/prior-state.json city-discovery/aux/state.json
          else
            python scripts/city_discovery.py --mode auxiliary --list-eligible-aux --pull-state \
              --prior-aux-state city-discovery/aux/prior-state.json > city-discovery/aux/eligibility.json
            cities=$(jq -r '.eligible[]' city-discovery/aux/eligibility.json)
            jq .state city-discovery/aux/eligibility.json > city-discovery/aux/state.json
          fi
          if [ -n "$existing" ]; then
            python scripts/r12_aux_queue.py --cities "$cities" \
              --issue city-discovery/aux/issue.json --comments city-discovery/aux/comments-flat.json \
              --out city-discovery/aux/queue.json
            cities=$(jq -r '.cities[]' city-discovery/aux/queue.json)
          fi
          : > city-discovery/aux/issue-body.md
          python scripts/r12_aux_state.py --render-state city-discovery/aux/state.json \
            >> city-discovery/aux/issue-body.md
          printf '\n\n' >> city-discovery/aux/issue-body.md
          count=0
          DISCOVERY_DEFERRED=75
          failures=0
          for city in $cities; do
            if python scripts/city_discovery.py --mode auxiliary --city-slug "$city" --out "city-discovery/aux/$city"; then
              :
            else
              status=$?
              if [ "$status" -eq "$DISCOVERY_DEFERRED" ]; then
                echo "::warning::Auxiliary discovery deferred for $city; it will be retried on a future run."
              else
                echo "::error::Auxiliary discovery failed for $city (exit $status)."
                failures=$((failures + 1))
              fi
              continue
            fi
            cat "city-discovery/aux/$city/evidence.md" >> city-discovery/aux/issue-body.md
            printf '\n' >> city-discovery/aux/issue-body.md
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            if [ "$failures" -ne 0 ]; then
              echo "::error::$failures auxiliary discovery request(s) failed unexpectedly."
              exit 1
            fi
            exit 0
          fi
          title="[city-discovery] $count candidate(s) pending"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body-file city-discovery/aux/issue-body.md
          else
            gh issue create --title "$title" --body-file city-discovery/aux/issue-body.md --label needs:discovery
          fi
          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures auxiliary discovery request(s) failed unexpectedly."
            exit 1
          fi

  batch:
    permissions:
      contents: write
      discussions: write
      issues: write
      pull-requests: write
    if: >-
      ${{ inputs.mode == 'batch' || inputs.mode == 'all' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned gh CLI
        uses: ./.github/actions/setup-gh-cli

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e . -c constraints/prod.txt

      - name: Assemble approved proposals
        env:
          GH_TOKEN: ${{ github.token }}
          CITY_REQUEST_STATUS_WEBHOOK_URL: ${{ secrets.CITY_REQUEST_STATUS_WEBHOOK_URL }}
        run: |
          # r12-commands.yml records the city-scoped approval beside the exact evidence marker.
          # This step intentionally operates only on files extracted from those markers, never on
          # an LLM re-run or a hand-parsed Markdown diff.
          python scripts/r12_collect_approved.py --repository "${{ github.repository }}" --out r12-batch
          git fetch origin main
          git switch --force-create automation/r12-city-batch origin/main
          changed=""
          if [ -s r12-batch/evidence-files.txt ]; then
            args=""
            while read -r evidence; do args="$args --evidence $evidence"; done < r12-batch/evidence-files.txt
            # shellcheck disable=SC2086
            python scripts/r12_batch.py --repo-root . $args --changed-out r12-batch/changed.json
            changed=$(jq -r '.[]' r12-batch/changed.json)
          else
            printf '[]\n' > r12-batch/changed.json
          fi
          if [ -s r12-batch/backlog-records.json ] && [ "$(jq length r12-batch/backlog-records.json)" -gt 0 ]; then
            python scripts/r12_update_backlog.py --records r12-batch/backlog-records.json
            changed="$changed"$'\n'"config/discovery/pending-providers.yml"
          fi
          if [ -z "$changed" ]; then
            echo "No current approved proposals."
            exit 0
          fi
          git diff --check
          printf '%s\n' "$changed" | sed '/^$/d' | sort -u > r12-batch/changed-files.txt
          git add -- $(tr '\n' ' ' < r12-batch/changed-files.txt)
          git diff --cached --check
          git diff --cached --name-only | sort | diff -u r12-batch/changed-files.txt -
          pytest -q tests/test_config.py tests/test_discovery.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git commit -m "config: batch verified city discovery proposals"
          git push --force-with-lease origin automation/r12-city-batch
          jq -r '"R12 batch: every included proposal was revalidated from unexpired evidence.\n\n## Source issues\n" + ([.[].number | "#" + tostring] | unique | join(", ")) + "\n\n<!-- citypods:r12-source-issues=" + ([.[].number | tostring] | unique | join(",")) + " -->"' \
            r12-batch/source-issues.json > r12-batch/pr-body.md
          pr=$(gh pr list --head automation/r12-city-batch --base main --state open --json url --jq '.[0].url')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "Add verified cities and agenda sources" \
              --body-file r12-batch/pr-body.md
          else
            pr=$(gh pr create --head automation/r12-city-batch --base main \
              --title "Add verified cities and agenda sources" \
              --body-file r12-batch/pr-body.md)
          fi
          jq -r '.[].number' r12-batch/source-issues.json | sort -u | while read -r issue; do
            gh issue edit "$issue" --add-label r12:batched
            gh issue comment "$issue" --body "R12 proposal is in maintainer review: $pr"
            gh issue view "$issue" --json number,url,body > r12-batch/notify-issue.json
            python scripts/r12_notify.py --issue r12-batch/notify-issue.json \
              --status batched_for_review --target-url "$pr"
          done
