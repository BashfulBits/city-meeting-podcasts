name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Keep in sync with site_config.yml schedule_cron.
    - cron: "0 */4 * * *"
  workflow_dispatch:

# Allow one concurrent deployment; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Persist build state across runs. docs/ is otherwise rebuilt from scratch every run,
      # so without this the audio-manifest dedup is lost (the per-run materialize budget gets
      # wasted re-confirming already-hosted objects and backfill never progresses) and
      # content-hash change detection can't skip unchanged cities. The unique key forces a
      # fresh save each run; restore-keys pulls the most recent previous cache.
      - name: Restore build state
        uses: actions/cache@v4
        with:
          path: |
            .citypods-state
            docs
          key: build-state-${{ github.run_id }}
          restore-keys: |
            build-state-

      - name: Install
        run: pip install -e ".[storage]"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build feeds
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          # Audio hosting (CivicPlus + extract_audio). Set the secrets for whichever backend
          # site_config.defaults.audio_storage_backend selects; if unset, HLS feeds stay empty.
          # Backblaze B2 (+ Cloudflare CDN for free egress):
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          # Cloudflare R2:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: citypods build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
