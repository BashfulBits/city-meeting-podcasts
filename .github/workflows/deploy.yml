name: Build & Deploy

on:
  push:
    branches: [main]
    # Docs/review-only merges do not change generated Pages output. Keep this list conservative:
    # do NOT ignore docs/, config/, templates/, citypods/, scripts/, or workflow files.
    paths-ignore:
      - "review/**"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.md"
      - "CLAUDE.md"
      - "README.md"
      - "ROADMAP.md"
      - "PLAN.md"
      - "CONTRIBUTING.md"
      - "MIGRATION.md"
      - "SECURITY.md"
      - "VISION.md"
      - ".github/ADD_CITY.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  schedule:
    # Keep in sync with site_config.yml schedule_cron.
    - cron: "0 */4 * * *"
  workflow_dispatch:

# Allow one concurrent deployment; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

# Render-only deploy (H11b): no `actions: read` graceful-yield token — render is not time-bounded
# (it always finishes in minutes), so it never polls the Actions API or yields. The heavy phase
# that needed that token lives in the audio.yml / asr.yml workflows now.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # A stalled render/deploy must not hold the `pages` concurrency slot for hours (CR2-GH-16/H6).
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    # Render-only: it reads the durable record store (restored from object storage by
    # citypods/statesync.py) to publish feeds/pages, so it needs the storage creds — but no
    # ffmpeg, no Whisper model, and no audio/ASR encodes. All heavy work runs in audio.yml/asr.yml.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      # Latency optimization only: the object bucket is the source of truth for build state
      # (citypods/statesync.py restores it at build start), so an evicted or missing cache
      # self-heals from the bucket. This cache just avoids re-downloading that snapshot and lets
      # unchanged cities skip re-rendering. The unique key forces a fresh save each run;
      # restore-keys pulls the most recent previous cache. Render never pushes records back to the
      # bucket (H11b) — the enrich workflow is the sole record writer.
      - name: Restore build state
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .citypods-state
            docs
          key: build-state-${{ github.run_id }}
          restore-keys: |
            build-state-

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # Render feeds/pages from the record store + apply any code/template/config changes, using
      # audio & chapters already hosted by the enrich workflow. No encoding, so this finishes in
      # minutes — the whole point is to publish merge fixes + new meetings ASAP, never blocked by
      # or marked red by audio/ASR work (which runs in audio.yml/asr.yml).
      - name: Render feeds
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          # Only this step touches storage (statesync pulls the durable record store); scope the
          # secrets here instead of job-level so checkout/setup-python/cache/configure-pages/
          # upload-pages-artifact/deploy-pages never see them (CR2-GH-16/MR-GH-02).
          # Audio hosting (CivicPlus + extract_audio). Set the secrets for whichever backend
          # site_config.defaults.audio_storage_backend selects; if unset, HLS feeds stay empty.
          # Backblaze B2 (+ Cloudflare CDN for free egress):
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          # Cloudflare R2:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: citypods build --phase render

      # Resource cost/time projection: writes docs/admin/{index.html,report.json} (the live
      # what-if calculator) and appends a summary to the run page. Reads accumulated run history
      # (prior enrich runs), so it's deployed alongside the site below. continue-on-error: this
      # is a cosmetic/informational feature — a bug in the report generator must not block feed
      # validation or the deploy itself (CR2-GH-15).
      - name: Resource report
        continue-on-error: true
        run: citypods report --markdown >> "$GITHUB_STEP_SUMMARY"

      # Validate generated feeds before publishing. Fails the deploy on structural
      # errors (malformed XML, missing required channel/item elements) and on feeds
      # that are unexpectedly empty. Known-empty feeds (cities mid-backfill whose audio
      # has not yet been hosted) are demoted to warnings and do not block the deploy.
      - name: Validate generated feeds
        run: citypods validate-build docs/ --state-dir .citypods-state

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

      # actions/deploy-pages occasionally fails with a generic "Deployment failed, try again
      # later." surfaced by GitHub's own Pages backend (a transient hiccup on GitHub's side, not
      # anything this workflow controls or that our build state affects) — seen twice on 2026-07-05
      # scheduled/push runs with an otherwise-clean render. Retry twice with backoff before failing.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        continue-on-error: true

      - name: Wait before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        continue-on-error: true

      - name: Wait before retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
