name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Keep in sync with site_config.yml schedule_cron.
    - cron: "0 */4 * * *"
  workflow_dispatch:

# Allow one concurrent deployment; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # citypods build polls the Actions API to detect a newer queued run (graceful yield)

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Shared by both the render and enrich phases (the heavy `enrich` is what actually encodes +
    # polls the Actions API to yield; render needs the storage creds for durable state pull/push).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Lets `citypods enrich` poll the Actions API and yield gracefully when a newer run is queued
      # behind it. Not auto-exported by Actions, so pass it explicitly. (Guarded by test_workflows.)
      GITHUB_TOKEN: ${{ github.token }}
      # Audio hosting (CivicPlus + extract_audio). Set the secrets for whichever backend
      # site_config.defaults.audio_storage_backend selects; if unset, HLS feeds stay empty.
      # Backblaze B2 (+ Cloudflare CDN for free egress):
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      # Cloudflare R2:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Latency optimization only: the object bucket is the source of truth for build state
      # (citypods/statesync.py restores it at build start and pushes at the end), so an evicted
      # or missing cache self-heals from the bucket. This cache just avoids re-downloading that
      # snapshot and lets unchanged cities skip re-rendering. The unique key forces a fresh save
      # each run; restore-keys pulls the most recent previous cache.
      - name: Restore build state
        uses: actions/cache@v4
        with:
          path: |
            .citypods-state
            docs
          key: build-state-${{ github.run_id }}
          restore-keys: |
            build-state-

      - name: Install
        run: pip install -e ".[asr,storage]"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Restore the cached Whisper model weights.  The mkdir ensures the path exists so
      # the cache save step works even on a cold first run (Actions skips save when the
      # path doesn't exist, which would leave every subsequent run cold too).
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo-v1
          restore-keys: whisper-large-v3-turbo-

      # Pre-download model weights so they are in the HuggingFace cache before the
      # parallel enrich pass starts.  Without this, every source would race to load the
      # model simultaneously, each making an authenticated Hub API call.
      #
      # HF_TOKEN (optional): a read-only HuggingFace token stored as a repo secret.
      # Unauthenticated requests share GitHub Actions' IP pool and hit HF's anonymous
      # rate limit (429) regularly.  A free HF account + read token raises that limit
      # dramatically.  Add it at:
      #   github.com/<org>/<repo>/settings/secrets/actions → New secret → HF_TOKEN
      # The step still succeeds if the token is absent; enrich falls back gracefully
      # (one "model load failed" error per source, ASR skipped for that run).
      - name: Pre-download Whisper model
        continue-on-error: true
        env:
          # huggingface_hub < 0.18 uses HUGGINGFACE_HUB_TOKEN; >= 0.18 prefers HF_TOKEN.
          # Set both so whichever version is installed picks it up and silences the
          # "unauthenticated requests" warning.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p ~/.cache/huggingface
          python - <<'EOF'
          from faster_whisper import WhisperModel
          print("Loading large-v3-turbo weights...")
          WhisperModel("large-v3-turbo", device="cpu", compute_type="int8")
          print("Model ready.")
          EOF

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Phase 1 (fast): render feeds/pages from the record store + apply any code/template/config
      # changes, using audio & chapters already hosted by prior runs. No encoding, so this finishes
      # in minutes — the whole point is to publish merge fixes + new meetings ASAP, then enrich.
      - name: Render feeds
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: citypods build --phase render

      # Resource cost/time projection: writes docs/admin/{index.html,report.json} (the live
      # what-if calculator) and appends a summary to the run page. Reads accumulated run history
      # (prior enrich runs), so it's deployed alongside the site below.
      - name: Resource report
        run: citypods report --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      # The fast outputs go live HERE — before the heavy phase runs.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Phase 2 (heavy, time-bounded): scrape chapters + encode audio + transcribe into
      # object storage. Does NOT render or deploy; its output is picked up by the NEXT run's render.
      # Bounded by the wall-clock window and yields gracefully when a newer run is queued behind it,
      # so it never blocks the next deploy for long (issue #63).
      # The Whisper model was pre-downloaded above; if that step failed (e.g. HF 429), the
      # model loads here on first use instead (one API call total, not per-episode, thanks to
      # the process-level cache in citypods/asr.py).  If it still can't load, one "model load
      # failed" error is recorded per source and ASR is skipped gracefully for that run.
      - name: Enrich (chapters + audio + transcripts)
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          # huggingface_hub < 0.18 uses HUGGINGFACE_HUB_TOKEN; >= 0.18 prefers HF_TOKEN.
          # Set both so whichever version is installed picks it up and silences the
          # "unauthenticated requests" warning.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: citypods enrich
