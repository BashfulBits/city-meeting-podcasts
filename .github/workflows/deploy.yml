name: Build & Deploy

on:
  push:
    branches: [main]
    # Docs/review-only merges do not change generated Pages output. Keep this list conservative:
    # do NOT ignore docs/, config/, templates/, citypods/, scripts/, or workflow files.
    paths-ignore:
      - "review/**"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.md"
      - "changelog.d/**"
      - "CLAUDE.md"
      - "README.md"
      - "ROADMAP.md"
      - "PLAN.md"
      - "CONTRIBUTING.md"
      - "MIGRATION.md"
      - "SECURITY.md"
      - "VISION.md"
      - ".github/ADD_CITY.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:
    inputs:
      search_run_id:
        description: >-
          Search-index workflow run to publish (blank uses the newest successful search run).
        required: false
        type: string

# Allow one concurrent deployment; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

# Render never polls the Actions API beyond the single staged-index download below. Heavy audio/ASR
# work and its graceful-yield token remain in their existing workflows; the bounded static-search
# build lives in search.yml and stages its index here rather than publishing its own older render.
permissions:
  contents: read

jobs:
  render:
    permissions:
      contents: read
      pages: read
      actions: read  # download the staged index artifact from the search.yml run
    runs-on: ubuntu-latest
    # A stalled render/deploy must not hold the `pages` concurrency slot for hours (CR2-GH-16/H6).
    timeout-minutes: 60
    # Render-only: it reads the durable record store (restored from object storage by
    # citypods/statesync.py) to publish feeds/pages, so it needs the storage creds — but no
    # ffmpeg, no Whisper model, and no audio/ASR encodes. All heavy work runs in audio.yml/asr.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          cache: pip

      # Latency optimization only: the object bucket is the source of truth for build state
      # (citypods/statesync.py restores it at build start), so an evicted or missing cache
      # self-heals from the bucket. This cache just avoids re-downloading that snapshot and lets
      # unchanged cities skip re-rendering. The unique key forces a fresh save each run;
      # restore-keys pulls the most recent previous cache. Render never pushes records back to the
      # bucket (H11b) — the enrich workflow is the sole record writer.
      - name: Restore build state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .citypods-state
            docs
          key: build-state-${{ github.run_id }}
          restore-keys: |
            build-state-

      - name: Install
        run: pip install -e ".[storage]" -c constraints/prod.txt

      # A search.yml run stops at "index is ready" and dispatches this workflow with its run id;
      # a plain `main` push has none, so fall back to the newest successful search run. Resolving it
      # from the search workflow rather than trusting the `build-state-` cache is deliberate: that
      # cache can be evicted, and `--skip-search` would then publish a site with no search entry
      # point at all.
      - name: Resolve search index run
        id: index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through env, never inlined: dispatch inputs are free-form text.
          SEARCH_RUN_ID: ${{ inputs.search_run_id }}
        run: |
          run_id="$SEARCH_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --workflow search.yml --status success --limit 1 \
              --json databaseId -q '.[0].databaseId')"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # Staging before the render is what keeps index and content matching: `--skip-search` reads
      # this manifest to advertise the search entry point and its shard counts, while the render
      # below refreshes every feed/page from current object-store state. A missing or expired
      # artifact keeps the site publishing (with whatever index `docs/` already carries).
      - name: Stage completed search index
        if: steps.index.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: search-index
          run-id: ${{ steps.index.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: docs

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: false

      # Render feeds/pages from the record store + apply any code/template/config changes, using
      # audio & chapters already hosted by the enrich workflow. No encoding, so this finishes in
      # minutes — the whole point is to publish merge fixes + new meetings ASAP, never blocked by
      # or marked red by audio/ASR work (which runs in audio.yml/asr.yml).
      - name: Render feeds
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          # Only this step touches storage (statesync pulls the durable record store); scope the
          # secrets here instead of job-level so checkout/setup-python/cache/configure-pages/
          # upload-pages-artifact/deploy-pages never see them (CR2-GH-16/MR-GH-02).
          # Audio hosting (CivicPlus + extract_audio). Set the secrets for whichever backend
          # site_config.defaults.audio_storage_backend selects; if unset, HLS feeds stay empty.
          # Backblaze B2 (+ Cloudflare CDN for free egress):
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          # Cloudflare R2:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GRANICUS_PROXY_BASE_URL: ${{ secrets.GRANICUS_PROXY_BASE_URL }}
          GRANICUS_PROXY_TOKEN: ${{ secrets.GRANICUS_PROXY_TOKEN }}
          SWAGIT_PROXY_BASE_URL: ${{ secrets.SWAGIT_PROXY_BASE_URL }}
          SWAGIT_PROXY_TOKEN: ${{ secrets.SWAGIT_PROXY_TOKEN }}
        run: citypods build --phase render --no-refresh --skip-search --search-context-output search-context.json

      # Resource cost/time projection: writes docs/admin/{index.html,report.json} (the live
      # what-if calculator) and appends a summary to the run page. Reads accumulated run history
      # (prior enrich runs), so it's deployed alongside the site below. continue-on-error: this
      # is a cosmetic/informational feature — a bug in the report generator must not block feed
      # validation or the deploy itself (CR2-GH-15).
      - name: Resource report
        continue-on-error: true
        run: citypods report --markdown >> "$GITHUB_STEP_SUMMARY"

      # Validate generated feeds before publishing. Fails the deploy on structural
      # errors (malformed XML, missing required channel/item elements) and on feeds
      # that are unexpectedly empty. Known-empty feeds (cities mid-backfill whose audio
      # has not yet been hosted) are demoted to warnings and do not block the deploy.
      - name: Validate generated feeds
        run: citypods validate-build docs/ --state-dir .citypods-state

      - name: Upload render handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: render-search-input
          include-hidden-files: true
          path: |
            docs
            search-context.json
            .citypods-state/sources/*/episodes.json

  deploy:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      # The handoff artifact carries the site under `docs/` plus the search handoff inputs, so it
      # lands in a scratch directory and the Pages artifact is republished from `staging/docs`.
      - name: Download same-run rendered site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: render-search-input
          path: staging
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: staging/docs

      # actions/deploy-pages occasionally fails with a generic "Deployment failed, try again
      # later." surfaced by GitHub's own Pages backend (a transient hiccup on GitHub's side, not
      # anything this workflow controls or that our build state affects) — seen twice on 2026-07-05
      # scheduled/push runs with an otherwise-clean render. Retry twice with backoff before failing.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true

      - name: Wait before retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        continue-on-error: true

      - name: Wait before retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
