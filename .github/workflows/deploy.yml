name: Build & Deploy

on:
  push:
    branches: [main]
    # Docs/review-only merges do not change generated Pages output. Keep this list conservative:
    # do NOT ignore docs/, config/, templates/, citypods/, scripts/, or workflow files.
    paths-ignore:
      - "review/**"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.md"
      - "CLAUDE.md"
      - "README.md"
      - "ROADMAP.md"
      - "PLAN.md"
      - "CONTRIBUTING.md"
      - "MIGRATION.md"
      - "SECURITY.md"
      - "VISION.md"
      - ".github/ADD_CITY.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  schedule:
    # Keep in sync with site_config.yml schedule_cron.
    - cron: "0 */4 * * *"
  workflow_dispatch:

# Allow one concurrent deployment; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

# Render-only deploy (H11b): no `actions: read` graceful-yield token — render is not time-bounded
# (it always finishes in minutes), so it never polls the Actions API or yields. The heavy phase
# that needed that token lives in the audio.yml / asr.yml workflows now.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Render-only: it reads the durable record store (restored from object storage by
    # citypods/statesync.py) to publish feeds/pages, so it needs the storage creds — but no
    # ffmpeg, no Whisper model, and no audio/ASR encodes. All heavy work runs in audio.yml/asr.yml.
    env:
      # Audio hosting (CivicPlus + extract_audio). Set the secrets for whichever backend
      # site_config.defaults.audio_storage_backend selects; if unset, HLS feeds stay empty.
      # Backblaze B2 (+ Cloudflare CDN for free egress):
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
      # Cloudflare R2:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      # Latency optimization only: the object bucket is the source of truth for build state
      # (citypods/statesync.py restores it at build start), so an evicted or missing cache
      # self-heals from the bucket. This cache just avoids re-downloading that snapshot and lets
      # unchanged cities skip re-rendering. The unique key forces a fresh save each run;
      # restore-keys pulls the most recent previous cache. Render never pushes records back to the
      # bucket (H11b) — the enrich workflow is the sole record writer.
      - name: Restore build state
        uses: actions/cache@v5
        with:
          path: |
            .citypods-state
            docs
          key: build-state-${{ github.run_id }}
          restore-keys: |
            build-state-

      - name: Install
        run: pip install -e ".[storage]"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Render feeds/pages from the record store + apply any code/template/config changes, using
      # audio & chapters already hosted by the enrich workflow. No encoding, so this finishes in
      # minutes — the whole point is to publish merge fixes + new meetings ASAP, never blocked by
      # or marked red by audio/ASR work (which runs in audio.yml/asr.yml).
      - name: Render feeds
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: citypods build --phase render

      # Resource cost/time projection: writes docs/admin/{index.html,report.json} (the live
      # what-if calculator) and appends a summary to the run page. Reads accumulated run history
      # (prior enrich runs), so it's deployed alongside the site below.
      - name: Resource report
        run: citypods report --markdown >> "$GITHUB_STEP_SUMMARY"

      # Validate generated feeds before publishing. Fails the deploy on structural
      # errors (malformed XML, missing required channel/item elements) and on feeds
      # that are unexpectedly empty. Known-empty feeds (cities mid-backfill whose audio
      # has not yet been hosted) are demoted to warnings and do not block the deploy.
      - name: Validate generated feeds
        run: citypods validate-build docs/ --state-dir .citypods-state

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
