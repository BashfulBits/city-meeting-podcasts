name: ASR Quality Review

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

concurrency:
  group: asr-quality-review
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[storage,wer]" -c constraints/prod.txt

      - name: Package H15 review issues
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: citypods transcript-quality package-review --out-dir h15-review

      - name: Build H15 Layer 3 calibration report
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_PUBLIC_BASE_URL: ${{ secrets.B2_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: citypods transcript-quality calibrate --out-dir h15-review

      - name: Upload H15 calibration report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: h15-calibration-report
          path: |
            h15-review/calibration.json
            h15-review/calibration.md
          retention-days: 90

      - name: Open or update H15 calibration report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="H15 L3 calibration report"
          existing=$(gh issue list --state open --search "in:title $title" --json number,title \
            | jq -r --arg title "$title" '[.[] | select(.title == $title)] | .[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file h15-review/calibration.md
          else
            gh issue edit "$existing" --body-file h15-review/calibration.md
          fi

      - name: Open or update H15 review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          parent_title="H15 transcript quality review"
          parent=$(gh issue list --state open --search "in:title $parent_title" --json number,title \
            | jq -r --arg title "$parent_title" '[.[] | select(.title == $title)] | .[0].number // empty')
          if [ -z "$parent" ]; then
            parent_url=$(gh issue create --title "$parent_title" --body-file h15-review/parent.md)
            parent=$(printf '%s' "$parent_url" | awk -F/ '{print $NF}')
          else
            gh issue edit "$parent" --body-file h15-review/parent.md
          fi
          jq -c '.children[]?' h15-review/review-batch.json | while read -r row; do
            sample_id=$(printf '%s' "$row" | jq -r '.sample_id')
            body_file=$(printf '%s' "$row" | jq -r '.body_file')
            title="H15 sample $sample_id"
            existing=$(gh issue list --state open --search "in:title $title" --json number,title \
              | jq -r --arg title "$title" '[.[] | select(.title == $title)] | .[0].number // empty')
            printf '\n\nParent issue: #%s\n' "$parent" >> "$body_file"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file "$body_file"
            else
              gh issue create --title "$title" --body-file "$body_file" >/dev/null
            fi
          done
