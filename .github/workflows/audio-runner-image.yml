name: Audio runner image

on:
  schedule:
    # Rebuild weekly so registry availability and the pinned toolchain are exercised regularly.
    - cron: "17 4 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/audio-runner/**"
      - ".github/workflows/audio-runner-image.yml"
      - "scripts/install_static_ffmpeg.py"
      - "pyproject.toml"

concurrency:
  group: audio-runner-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bashfulbits/citypods-audio-runner:py312-ffmpeg71-v1
  FFMPEG_SHA256: 30d8f18138393081d7fdf95f7006fa132e7b063fd87c0e955652c64a4bc0d52d

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish pinned audio runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/audio-runner/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          # On a non-main run (manual dispatch from a feature branch) push is false, so the GHCR
          # tag is never updated; load the build into the local daemon instead so the smoke test
          # below exercises the image just built here, not a possibly-stale published tag.
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}
          build-args: |
            FFMPEG_URL=${{ secrets.B2_PUBLIC_BASE_URL }}/deps/ffmpeg/7.1.5/ffmpeg-7.1.5-linux64-static.tar.xz
            FFMPEG_SHA256=${{ env.FFMPEG_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke-test runtime
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Published: pull it back from GHCR to prove the published tag is actually usable.
            docker pull "$IMAGE"
          fi
          docker run --rm --entrypoint sh "$IMAGE" -c '
            python --version
            ffmpeg -version
            ffprobe -version
            python -c "import boto3, citypods"
          '
