name: Audio runner image

on:
  schedule:
    # Rebuild weekly so registry availability and the pinned toolchain are exercised regularly.
    - cron: "17 4 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/audio-runner/**"
      - ".github/workflows/audio-runner-image.yml"
      - "scripts/install_static_ffmpeg.py"
      - "pyproject.toml"

concurrency:
  group: audio-runner-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bashfulbits/citypods-audio-runner:py312-ffmpeg71-v1
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-18-14-21/ffmpeg-n7.1.4-39-ga5faeca88f-linux64-lgpl-7.1.tar.xz
  FFMPEG_SHA256: bf89442300107bc9c73d4ffb80c1e4482bbde205903fe0f9e3d1de55e6d1140e

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish pinned audio runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/audio-runner/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}
          build-args: |
            FFMPEG_URL=${{ env.FFMPEG_URL }}
            FFMPEG_SHA256=${{ env.FFMPEG_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke-test published runtime
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c '
            python --version
            ffmpeg -version
            ffprobe -version
            python -c "import boto3, citypods"
          '
