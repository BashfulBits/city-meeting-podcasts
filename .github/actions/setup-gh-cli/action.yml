name: Setup pinned gh CLI
description: >
  Installs the exact `gh` CLI version pinned in constraints/gh-cli.txt (linux/amd64 -- the only
  platform any of our runners use) and prepends it to PATH, verified against the release's own
  published gh_<version>_checksums.txt. Exists so gh's JSON output shapes and repo-resolution
  behavior don't silently change out from under these workflows when the hosted runner image
  bumps its preinstalled gh (see constraints/gh-cli.txt for the 2026-07-27 incident this guards
  against).

  Callable from jobs that have no `actions/checkout` step -- and most of the resolve/finalize
  jobs that only call `gh issue list`/`gh issue view` deliberately skip checkout -- via the
  self-referencing form, which the runner fetches independently of the job's own checkout:
    uses: ${{ github.repository }}/.github/actions/setup-gh-cli@${{ github.sha }}

runs:
  using: composite
  steps:
    - name: Install pinned gh CLI
      shell: bash
      run: |
        set -euo pipefail
        pin_file="${GITHUB_ACTION_PATH}/../../../constraints/gh-cli.txt"
        version=$(grep -m1 '^GH_CLI_VERSION=' "$pin_file" | cut -d= -f2)
        tarball="gh_${version}_linux_amd64.tar.gz"
        base_url="https://github.com/cli/cli/releases/download/v${version}"

        tmp=$(mktemp -d)
        curl -fsSL "${base_url}/${tarball}" -o "${tmp}/${tarball}"
        curl -fsSL "${base_url}/gh_${version}_checksums.txt" -o "${tmp}/checksums.txt"

        expected=$(grep " ${tarball}\$" "${tmp}/checksums.txt" | awk '{print $1}')
        if [ -z "$expected" ]; then
          echo "::error::no checksum entry for ${tarball} in gh v${version}'s checksums.txt"
          exit 1
        fi
        actual=$(sha256sum "${tmp}/${tarball}" | awk '{print $1}')
        if [ "$expected" != "$actual" ]; then
          echo "::error::gh CLI checksum mismatch for ${tarball}: expected ${expected}, got ${actual}"
          exit 1
        fi

        tar -xzf "${tmp}/${tarball}" -C "${tmp}"
        install_dir="${RUNNER_TEMP}/gh-cli-${version}/bin"
        mkdir -p "$install_dir"
        cp "${tmp}/gh_${version}_linux_amd64/bin/gh" "${install_dir}/gh"
        chmod +x "${install_dir}/gh"

        # Prepend (not append): must shadow the runner image's preinstalled gh on PATH.
        echo "$install_dir" >> "$GITHUB_PATH"
        export PATH="${install_dir}:${PATH}"
        gh --version
